<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0072D6" />
<title>Vehicle Management — FAMS V5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== FAMS V5 Design tokens ===== */
    --brand: #0072D6;
    --brand-deep: #005BAB;
    --brand-soft: #E6F2FC;
    --brand-line: rgba(0,114,214,0.24);

    --bg-page: #F9FAFB;
    --surface: #FFFFFF;
    --surface-2: #F9FAFB;
    --surface-3: #F2F4F7;

    --border: #EAECF0;
    --border-strong: #D0D5DD;
    --divider: #F2F4F7;

    --text-900: #101828;
    --text-800: #1D2939;
    --text-600: #475467;
    --text-500: #667085;
    --text-400: #98A2B3;

    --good: #12B76A;
    --good-soft: #ECFDF3;
    --good-text: #027A48;
    --good-line: #A6F4C5;

    --warn: #F79009;
    --warn-soft: #FFFAEB;
    --warn-line: #FEDF89;
    --warn-text: #B54708;

    --danger: #D92D20;
    --danger-text: #B42318;
    --danger-soft: #FEE4E2;

    --rail-primary-bg: #0B1F3D;

    --row-selected: var(--brand-soft);

    --focus-ring: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--brand);

    --shadow-card: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-input-inset: inset 0 1px 2px rgba(16,24,40,0.04);
    --shadow-pop: 0 12px 32px rgba(16,24,40,0.14), 0 4px 8px rgba(16,24,40,0.06);

    --r-6: 6px; --r-8: 8px; --r-10: 10px; --r-12: 12px; --r-16: 16px;

    --sw-blue: #2E90FA;
    --sw-black: #1D2939;
    --sw-purple: #9E77ED;
    --sw-brown: #7A5548;
    --sw-yellow: #FDB022;
    --sw-green: #12B76A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, button, input, select, textarea {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #D0D5DD; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: #98A2B3; background-clip: padding-box; border: 2px solid transparent; }

  html, body { height: 100%; background: var(--bg-page); color: var(--text-800); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-size: 14px; line-height: 1.45; font-weight: 400; }

  button, input, [role="button"], .mod, .rail-app, .tb-tab, .tb-add, .ck, .chip-tag, .chip-more { cursor: pointer; }

  /* Focus */
  button:focus-visible,
  input:focus-visible,
  .ck:focus-visible,
  .tb-tab:focus-visible,
  .mod:focus-visible,
  .rail-app:focus-visible,
  .rail-util:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .search input:focus-visible { outline: none; }

  .app {
    display: grid;
    grid-template-columns: 48px 56px 1fr;
    grid-template-rows: 48px 1fr;
    grid-template-areas: "railP railM topbar" "railP railM main";
    height: 100vh;
    overflow: hidden;
  }

  /* ===== PRIMARY APP RAIL (dark navy) ===== */
  .rail-primary { grid-area: railP; background: var(--rail-primary-bg); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px 8px; z-index: 50; }
  .rail-top { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .rail-logo { width: 28px; height: 28px; border-radius: 6px; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 10px; letter-spacing: -.3px; }
  .rail-apps { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .rail-app { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,0.20); border: 0; border-left: 2px solid rgba(0,114,214,0.40); transition: background .14s ease; }
  .rail-app:hover { background: rgba(255,255,255,0.30); }
  .rail-app.active { background: #fff; color: var(--brand); border-left-color: rgba(0,114,214,0.60); }
  .rail-app svg { width: 16px; height: 16px; }
  .rail-utils { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .rail-util { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,0.20); border: 0; }
  .rail-util:hover { background: rgba(255,255,255,0.30); }
  .rail-util svg { width: 15px; height: 15px; }
  .rail-ava { width: 28px; height: 28px; border-radius: 999px; background: #F97066; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; }

  /* ===== MODULE RAIL (white) ===== */
  .rail-modules { grid-area: railM; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; z-index: 40; }
  .rail-modules::-webkit-scrollbar { width: 0; }
  .mod { width: 32px; height: 32px; border-radius: var(--r-8); border: 0; background: transparent; color: var(--text-500); display: grid; place-items: center; position: relative; transition: background .14s ease, color .14s ease; flex-shrink: 0; }
  .mod:hover { background: var(--surface-2); color: var(--text-900); }
  .mod.active { background: var(--brand); color: #fff; }
  .mod svg { width: 18px; height: 18px; }
  .mod .tip { position: absolute; left: 42px; top: 50%; transform: translateY(-50%); background: var(--text-900); color: #fff; font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s ease; z-index: 60; }
  .mod:hover .tip { opacity: 1; }

  /* ===== TOP TAB BAR ===== */
  .topbar { grid-area: topbar; background: var(--bg-page); border-bottom: 1px solid var(--border); display: flex; align-items: stretch; z-index: 30; }
  .tb-section { display: flex; align-items: center; padding: 0 24px; font-size: 15px; font-weight: 600; color: var(--text-900); white-space: nowrap; letter-spacing: -0.1px; }
  .tb-tabs { display: flex; align-items: stretch; }
  .tb-tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: var(--r-8) var(--r-8) 0 0; margin: 6px -1px -1px 0; font-size: 13px; font-weight: 600; color: var(--text-900); position: relative; }
  .tb-tab::after { content:''; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; background: var(--brand); border-radius: 2px 2px 0 0; }
  .tb-tab svg { width: 15px; height: 15px; color: var(--brand); }
  .tb-add { display: grid; place-items: center; width: 36px; border: 0; background: transparent; color: var(--text-500); border-radius: 6px; margin: 8px 4px; height: 32px; }
  .tb-add:hover { background: var(--surface-2); color: var(--text-900); }
  .tb-add svg { width: 16px; height: 16px; }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .tb-icon-btn { width: 32px; height: 32px; border-radius: 6px; border: 0; background: transparent; color: var(--text-500); display: grid; place-items: center; position: relative; }
  .tb-icon-btn:hover { background: var(--surface-2); color: var(--text-900); }
  .tb-icon-btn svg { width: 16px; height: 16px; }
  .tb-icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 999px; background: var(--danger); border: 1.5px solid var(--bg-page); }
  .tb-ava { width: 26px; height: 26px; border-radius: 999px; background: #F97066; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; }

  /* ===== MAIN ===== */
  .main { grid-area: main; overflow: auto; }
  .page { padding: 16px 20px 32px; }

  /* ===== TOOLBAR ===== */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .search { position: relative; flex: 0 0 367px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-500); pointer-events: none; }
  .search input { width: 100%; height: 40px; padding: 0 12px 0 38px; border: 1px solid var(--border-strong); border-radius: var(--r-8); background: var(--surface); color: var(--text-900); font-size: 13px; box-shadow: var(--shadow-input-inset); transition: border-color .14s ease, box-shadow .14s ease; }
  .search input::placeholder { color: var(--text-500); }
  .search input:focus { border-color: var(--brand); box-shadow: var(--shadow-input-inset), 0 0 0 3px var(--brand-line); outline: none; }

  .icon-btn-ol { width: 40px; height: 40px; border-radius: var(--r-8); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-600); display: grid; place-items: center; transition: background .12s ease, color .12s ease, border-color .12s ease; }
  .icon-btn-ol:hover { background: var(--surface-2); border-color: var(--text-400); color: var(--text-900); }
  .icon-btn-ol svg { width: 16px; height: 16px; }

  .spacer { flex: 1; }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: var(--r-8); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-900); font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .12s ease, border-color .12s ease, transform .06s ease; font-family: inherit; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translate(0, 1px); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
  .btn-primary:active { background: var(--brand-deep); transform: translate(0, 1px); }
  .btn-destructive { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-destructive:hover { background: #B42318; border-color: #B42318; }
  .btn-warn { background: var(--warn); border-color: var(--warn); color: #fff; }
  .btn-warn:hover { background: #DC6803; border-color: #DC6803; }

  /* ===== TABLE ===== */
  .tbl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-10); box-shadow: var(--shadow-card); overflow: hidden; }
  .tbl-scroll { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl thead th { position: sticky; top: 0; z-index: 2; text-align: left; font-weight: 600; color: var(--text-500); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; padding: 0 14px; height: 40px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.tbl td { padding: 8px 14px; height: 48px; border-bottom: 1px solid var(--divider); vertical-align: middle; white-space: nowrap; color: var(--text-800); font-size: 13px; }
  table.tbl tbody tr { transition: background .12s ease; opacity: 0; transform: translateY(4px); animation: rowIn 200ms ease-out forwards; }
  table.tbl tbody tr:last-child td { border-bottom: 0; }
  table.tbl tbody tr:hover { background: var(--surface-2); }
  table.tbl tbody tr.selected { background: var(--row-selected); }
  table.tbl tbody tr.selected:hover { background: #D8E9F9; }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bulkIn {
    from { opacity: 0; transform: translate(-50%, 16px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    table.tbl tbody tr { animation: none; opacity: 1; transform: none; }
    .bulk-bar.visible { animation: none; }
    * { transition: none !important; }
  }

  /* Checkboxes */
  .ck { width: 18px; height: 18px; border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--surface); appearance: none; -webkit-appearance: none; margin: 0; position: relative; flex-shrink: 0; transition: background .12s, border-color .12s; }
  .ck:hover { border-color: var(--brand); }
  .ck:checked { background: var(--brand); border-color: var(--brand); }
  .ck:checked::after { content: ''; position: absolute; left: 4px; top: 0px; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .ck:indeterminate { background: var(--brand); border-color: var(--brand); }
  .ck:indeterminate::after { content: ''; position: absolute; left: 3px; top: 7px; width: 10px; height: 2px; background: #fff; border-radius: 1px; }

  /* ===== BULK ACTIONS BAR ===== */
  .bulk-bar { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-12); box-shadow: var(--shadow-pop); height: 56px; display: flex; align-items: center; padding: 0 12px; gap: 4px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity 200ms ease-out, transform 200ms ease-out; }
  .bulk-bar.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); animation: bulkIn 200ms ease-out; }
  .bulk-count { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; color: var(--text-900); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .bulk-count b { font-weight: 700; margin-right: 4px; }
  .bulk-div { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; margin: 0 4px; }
  .bulk-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--r-6); border: 0; background: transparent; color: var(--text-800); font-size: 13px; font-weight: 600; white-space: nowrap; font-family: inherit; transition: background .12s ease; }
  .bulk-btn svg { width: 16px; height: 16px; }
  .bulk-btn:hover { background: var(--surface-2); }
  .bulk-btn.activate { color: var(--good-text); }
  .bulk-btn.activate:hover { background: var(--good-soft); }
  .bulk-btn.deactivate { color: var(--warn-text); }
  .bulk-btn.deactivate:hover { background: var(--warn-soft); }
  .bulk-btn.delete { color: var(--danger-text); }
  .bulk-btn.delete:hover { background: var(--danger-soft); }
  .bulk-btn.clear { color: var(--text-500); }
  .bulk-btn.clear:hover { background: var(--surface-2); color: var(--text-900); }

  /* ===== MODAL ===== */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,0.50); z-index: 60; display: none; align-items: center; justify-content: center; }
  .modal-backdrop.visible { display: flex; }
  .modal { width: 400px; background: var(--surface); border-radius: var(--r-12); box-shadow: var(--shadow-pop); padding: 24px; }
  .modal-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .modal-icon { width: 40px; height: 40px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; flex-shrink: 0; }
  .modal-icon svg { width: 20px; height: 20px; }
  .modal-icon.warn { background: var(--warn-soft); color: var(--warn-text); }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text-900); margin-top: 6px; letter-spacing: -0.1px; }
  .modal-body { font-size: 13px; color: var(--text-600); margin-bottom: 20px; line-height: 1.55; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* ===== TOAST ===== */
  .toast-stack { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 70; }
  .toast { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--good-soft); color: var(--good-text); border: 1px solid var(--good-line); border-radius: var(--r-8); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-card); opacity: 0; transform: translateX(20px); transition: opacity 200ms ease, transform 200ms ease; }
  .toast.visible { opacity: 1; transform: translateX(0); }
  .toast svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ===== CELLS ===== */
  .asset-cell { display: flex; align-items: center; gap: 10px; }
  .car-thumb { width: 44px; height: 32px; display: grid; place-items: center; flex-shrink: 0; }
  .car-thumb svg { width: 40px; height: 32px; display: block; }
  .asset-name { font-weight: 600; color: var(--text-900); font-size: 13px; }

  .tags-cell { display: inline-flex; gap: 4px; align-items: center; }
  .chip-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 10px; font-weight: 600; background: var(--warn-soft); color: var(--warn-text); border: 1px solid var(--warn-line); letter-spacing: 0.4px; text-transform: uppercase; }
  .chip-more { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 10px; font-weight: 600; background: var(--surface-3); color: var(--text-500); border: 1px solid var(--border); }

  .color-cell { display: inline-flex; align-items: center; gap: 8px; }
  .color-sw { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); flex-shrink: 0; }

  .assign-cell { display: inline-flex; align-items: center; gap: 8px; }
  .ava { width: 24px; height: 24px; border-radius: 999px; color: #FFFFFF; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex-shrink: 0; letter-spacing: 0.2px; }

  .devices-cell { display: inline-flex; align-items: center; gap: 6px; color: var(--text-800); }
  .devices-cell svg { color: var(--brand); }

  .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid transparent; }
  .pill-active { background: var(--good-soft); color: var(--good-text); border-color: var(--good-line); }
  .pill-inactive { background: var(--surface-3); color: var(--text-500); border-color: var(--border-strong); }

  .th-edit { text-align: right; }
  .th-edit-btn { width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--brand); display: inline-grid; place-items: center; }
  .th-edit-btn:hover { background: var(--brand-soft); }
  .th-edit-btn svg { width: 14px; height: 14px; }

  .th-check, .td-check { width: 44px; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ PRIMARY APP RAIL ============ -->
  <div class="rail-primary">
    <div class="rail-top">
      <div class="rail-logo" title="FAMS">F5</div>
      <div class="rail-apps">
        <button class="rail-app" title="App 1" aria-label="App 1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button class="rail-app active" title="FAMS" aria-current="page" aria-label="FAMS">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V9l2-5h11l3 5v8"/><path d="M3 11h16"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
        </button>
        <button class="rail-app" title="App 3" aria-label="App 3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16"/></svg>
        </button>
      </div>
    </div>
    <div class="rail-utils">
      <button class="rail-util" title="Inbox" aria-label="Inbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      </button>
      <button class="rail-util" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

et="0.37" stop-color="#192021"/><stop offset="0.44" stop-color="#181E1F"/><stop offset="0.47" stop-color="#111615"/></linearGradient><linearGradient id="paint14_linear_30086_10059" x1="8.94787" y1="8.60018" x2="13.4211" y2="10.2519" gradientUnits="userSpaceOnUse"><stop offset="0.22" stop-color="#353635"/><stop offset="0.26" stop-color="#434343"/><stop offset="0.31" stop-color="#4B4C4B"/><stop offset="0.39" stop-color="#4E4E4E"/></linearGradient></defs></svg>`;

  var SIGNAL_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 0 1 20 0"/><path d="M5 14a7 7 0 0 1 14 0"/><path d="M8.5 16a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="18" r="1.25" fill="currentColor" stroke="none"/></svg>';

  var COLOR_MAP = {
    Blue:   'var(--sw-blue)',
    Black:  'var(--sw-black)',
    Purple: 'var(--sw-purple)',
    Brown:  'var(--sw-brown)',
    Yellow: 'var(--sw-yellow)',
    Green:  'var(--sw-green)'
  };

  function avaColor(name){
    var h = 0; for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    var hue = h % 360;
    return 'hsl(' + hue + ' 55% 45%)';
  }
  function initials(name){
    var parts = name.split(' ').filter(Boolean);
    return ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||'');
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var ROWS = [
    { vin:'1HGCM82633A123456', model:'2023', color:'Blue',   fuel:'Petrol',   assignee:'Ronald Richards' },
    { vin:'7FMDK3GC4CBA123456', model:'2022', color:'Black',  fuel:'Electric', assignee:'Robert Fox' },
    { vin:'6T1BF1FK0HU654321',  model:'2021', color:'Purple', fuel:'Petrol',   assignee:'Wade Warren' },
    { vin:'5N1AZ2MH1FN654321',  model:'2020', color:'Black',  fuel:'Electric', assignee:'Devon Lane' },
    { vin:'4T1BF1FK0HU654321',  model:'2023', color:'Brown',  fuel:'Electric', assignee:'Arlene McCoy' },
    { vin:'3N1AB7AP7FY654321',  model:'2019', color:'Yellow', fuel:'Petrol',   assignee:'Jacob Jones' },
    { vin:'0N1AZ2MH1FN123456',  model:'2021', color:'Yellow', fuel:'Electric', assignee:'Eleanor Pena' },
    { vin:'9T1BF1FK0HU123456',  model:'2022', color:'Purple', fuel:'Petrol',   assignee:'Floyd Miles' },
    { vin:'8N1AB7AP7FY123456',  model:'2023', color:'Green',  fuel:'Electric', assignee:'Kathryn Murphy' },
    { vin:'7FMDK3GC4CBA654321', model:'2020', color:'Black',  fuel:'Electric', assignee:'Annette Black' },
    { vin:'1HGCM82633A654321',  model:'2019', color:'Brown',  fuel:'Petrol',   assignee:'Albert Flores' },
    { vin:'6T1BF1FK0HU123456',  model:'2022', color:'Green',  fuel:'Electric', assignee:'Theresa Webb' },
    { vin:'5N1AZ2MH1FN123456',  model:'2021', color:'Brown',  fuel:'Electric', assignee:'Esther Howard' },
    { vin:'4T1BF1FK0HU123456',  model:'2023', color:'Yellow', fuel:'Petrol',   assignee:'Kristin Watson' },
    { vin:'3N1AB7AP7FY123456',  model:'2019', color:'Purple', fuel:'Electric', assignee:'Ralph Edwards' },
    { vin:'2FMDK3GC4CBA654321', model:'2022', color:'Green',  fuel:'Petrol',   assignee:'Leslie Alexander' },
    { vin:'2FMDK3GC4CBA123456', model:'2021', color:'Black',  fuel:'Electric', assignee:'Jacob Jones' },
    { vin:'1HGCM82633A234567',  model:'2023', color:'Blue',   fuel:'Petrol',   assignee:'Cameron Williamson' }
  ];

  ROWS.forEach(function(r, i){ r.id = 'v' + i; r.status = 'Active'; });

  var body = document.getElementById('vehBody');

  function statusPill(status){
    if (status === 'Active') return '<span class="pill pill-active">Active</span>';
    return '<span class="pill pill-inactive">Inactive</span>';
  }

  function render(){
    var html = '';
    for (var i=0; i<ROWS.length; i++){
      var r = ROWS[i];
      var ac = avaColor(r.assignee);
      var ini = initials(r.assignee);
      var sw = COLOR_MAP[r.color] || '#98A2B3';
      html += '<tr data-id="' + r.id + '">'
        + '<td class="td-check"><input type="checkbox" class="ck row-ck" data-id="' + r.id + '" aria-label="Select ' + esc(r.assignee) + '"></td>'
        + '<td><div class="asset-cell"><div class="car-thumb">' + CAR_SVG + '</div><span class="asset-name">Z 1234</span></div></td>'
        + '<td><span class="tags-cell"><span class="chip-tag">Tag</span><span class="chip-more">+2</span></span></td>'
        + '<td>' + esc(r.vin) + '</td>'
        + '<td>Car</td>'
        + '<td>Toyota</td>'
        + '<td>' + esc(r.model) + '</td>'
        + '<td><span class="color-cell"><span class="color-sw" style="background:' + sw + '"></span>' + esc(r.color) + '</span></td>'
        + '<td>' + esc(r.fuel) + '</td>'
        + '<td><span class="assign-cell"><span class="ava" style="background:' + ac + '">' + esc(ini) + '</span>' + esc(r.assignee) + '</span></td>'
        + '<td><span class="devices-cell">' + SIGNAL_SVG + '3</span></td>'
        + '<td class="status-cell">' + statusPill(r.status) + '</td>'
        + '<td class="th-edit"></td>'
        + '</tr>';
    }
    body.innerHTML = html;
    wireRowChecks();
    syncSelectionUI();
  }

  var selected = new Set();

  function wireRowChecks(){
    var cks = body.querySelectorAll('.row-ck');
    cks.forEach(function(ck){
      ck.checked = selected.has(ck.dataset.id);
      ck.addEventListener('change', function(){
        var id = ck.dataset.id;
        if (ck.checked) selected.add(id); else selected.delete(id);
        syncSelectionUI();
      });
    });
  }

  function syncSelectionUI(){
    body.querySelectorAll('tr').forEach(function(tr){
      if (selected.has(tr.dataset.id)) tr.classList.add('selected'); else tr.classList.remove('selected');
    });
    var ckAll = document.getElementById('ckAll');
    var total = ROWS.length;
    var n = selected.size;
    if (n === 0){ ckAll.checked = false; ckAll.indeterminate = false; }
    else if (n === total){ ckAll.checked = true; ckAll.indeterminate = false; }
    else { ckAll.checked = false; ckAll.indeterminate = true; }
    var bar = document.getElementById('bulkBar');
    document.getElementById('bulkCount').textContent = String(n);
    if (n > 0) bar.classList.add('visible'); else bar.classList.remove('visible');
  }

  document.getElementById('ckAll').addEventListener('change', function(e){
    if (e.target.checked){
      ROWS.forEach(function(r){ selected.add(r.id); });
    } else {
      selected.clear();
    }
    body.querySelectorAll('.row-ck').forEach(function(ck){ ck.checked = selected.has(ck.dataset.id); });
    syncSelectionUI();
  });

  // ===== Bulk actions =====
  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalIcon = document.getElementById('modalIcon');
  var modalTitle = document.getElementById('modalTitle');
  var modalBody = document.getElementById('modalBody');
  var modalConfirm = document.getElementById('modalConfirm');
  var pendingAction = null;

  function openModal(kind){
    var n = selected.size;
    if (n === 0) return;
    pendingAction = kind;
    if (kind === 'delete'){
      modalIcon.className = 'modal-icon';
      modalIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
      modalTitle.textContent = 'Delete ' + n + ' ' + (n===1?'vehicle':'vehicles') + '?';
      modalBody.textContent = 'This action cannot be undone. The selected records will be permanently removed.';
      modalConfirm.className = 'btn btn-destructive';
      modalConfirm.textContent = 'Delete';
    } else if (kind === 'deactivate'){
      modalIcon.className = 'modal-icon warn';
      modalIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
      modalTitle.textContent = 'Deactivate ' + n + ' ' + (n===1?'vehicle':'vehicles') + '?';
      modalBody.textContent = 'The selected records will be set to Inactive and won\'t appear in active reports.';
      modalConfirm.className = 'btn btn-warn';
      modalConfirm.textContent = 'Deactivate';
    }
    modalBackdrop.classList.add('visible');
  }
  function closeModal(){ modalBackdrop.classList.remove('visible'); pendingAction = null; }

  modalBackdrop.addEventListener('click', function(e){ if (e.target === modalBackdrop) closeModal(); });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && modalBackdrop.classList.contains('visible')) closeModal(); });

  modalConfirm.addEventListener('click', function(){
    var n = selected.size;
    if (pendingAction === 'delete'){
      for (var i = ROWS.length - 1; i >= 0; i--){
        if (selected.has(ROWS[i].id)) ROWS.splice(i, 1);
      }
      selected.clear();
      render();
      closeModal();
      toast(n + ' ' + (n===1?'vehicle':'vehicles') + ' deleted');
    } else if (pendingAction === 'deactivate'){
      ROWS.forEach(function(r){ if (selected.has(r.id)) r.status = 'Inactive'; });
      body.querySelectorAll('tr').forEach(function(tr){
        var id = tr.dataset.id;
        var row = ROWS.find(function(r){ return r.id === id; });
        if (row){ tr.querySelector('.status-cell').innerHTML = statusPill(row.status); }
      });
      closeModal();
      toast(n + ' ' + (n===1?'vehicle':'vehicles') + ' deactivated');
    }
  });

  document.getElementById('bulkDelete').addEventListener('click', function(){ openModal('delete'); });
  document.getElementById('bulkDeactivate').addEventListener('click', function(){ openModal('deactivate'); });
  document.getElementById('bulkActivate').addEventListener('click', function(){
    var n = selected.size;
    ROWS.forEach(function(r){ if (selected.has(r.id)) r.status = 'Active'; });
    body.querySelectorAll('tr').forEach(function(tr){
      var id = tr.dataset.id;
      var row = ROWS.find(function(r){ return r.id === id; });
      if (row){ tr.querySelector('.status-cell').innerHTML = statusPill(row.status); }
    });
    toast(n + ' ' + (n===1?'vehicle':'vehicles') + ' activated');
  });
  document.getElementById('bulkAssign').addEventListener('click', function(){
    toast('Assigned ' + selected.size + ' ' + (selected.size===1?'vehicle':'vehicles'));
  });
  document.getElementById('bulkExport').addEventListener('click', function(){
    toast('Exported ' + selected.size + ' ' + (selected.size===1?'vehicle':'vehicles'));
  });
  document.getElementById('bulkClear').addEventListener('click', function(){
    selected.clear();
    body.querySelectorAll('.row-ck').forEach(function(ck){ ck.checked = false; });
    syncSelectionUI();
  });

  // ===== Toasts =====
  function toast(msg){
    var stack = document.getElementById('toastStack');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>' + esc(msg) + '</span>';
    stack.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('visible'); });
    setTimeout(function(){
      el.classList.remove('visible');
      setTimeout(function(){ el.remove(); }, 250);
    }, 2500);
  }

  render();
</script>
