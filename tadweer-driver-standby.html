<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Driver - Standby</title>
<style>
  @font-face { font-family: 'Gilroy'; src: url('v5-design-system-ai-main/Font/Gilroy-Medium.otf') format('opentype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Gilroy'; src: url('v5-design-system-ai-main/Font/Gilroy-Semibold.otf') format('opentype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Gilroy'; src: url('v5-design-system-ai-main/Font/Gilroy-Bold.otf') format('opentype'); font-weight: 700; font-display: swap; }

  :root {
    --brand-primary: #8A1538;
    --neutral-lightest: #F9FAFB; --border-lightest: #EAECF0;
    --text-darker: #1D2939; --text-normal: #475467; --text-light: #667085; --neutral-400: #98A2B3;
    --success: #12B76A; --success-bg: #ECFDF3; --success-bd: #ABEFC6; --success-tx: #067647;
    --rail-w: 112px; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ease-out: cubic-bezier(.22, 1, .36, 1); --dur-fast: 160ms;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Gilroy', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: var(--text-darker); display: flex; height: 100dvh; overflow: hidden; }
  svg { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  /* ── maroon rail ── */
  .sidebar { width: var(--rail-w); flex-shrink: 0; background: var(--brand-primary); display: flex; flex-direction: column; align-items: center; padding: calc(24px + var(--safe-top)) 0 calc(20px + var(--safe-bottom)); }
  .crest { width: 80px; height: 80px; fill: #fff; stroke: none; } /* explicit: the global svg rule would otherwise strip the fill */
  .sidebar .spacer { flex: 1; }
  .rail-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; cursor: pointer; }
  .rail-btn svg { width: 26px; height: 26px; stroke: #fff; }
  .fams { color: rgba(255,255,255,.65); font-weight: 700; font-size: 17px; letter-spacing: .5px; text-align: center; line-height: 1; margin-top: 8px; }
  .fams small { display: block; font-size: 7px; font-weight: 500; letter-spacing: 1px; margin-top: 4px; opacity: .8; }

  /* ── main ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* top bar: inspector = primary contact during standby */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(22px + var(--safe-top)) 36px 20px; border-bottom: 1px solid var(--border-lightest); }
  .insp { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .insp-avatar { width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0; background: #F2D9E0; object-fit: cover; display: block; }
  .insp-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .insp-name h1 { font-weight: 700; font-size: 24px; line-height: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .insp-phone { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; font-weight: 600; font-size: 16px; color: var(--text-normal); background: var(--neutral-lightest); border: 1px solid var(--border-lightest); border-radius: 999px; padding: 6px 14px 6px 11px; }
  .insp-phone svg { width: 16px; height: 16px; stroke: var(--brand-primary); }
  .insp-role { font-weight: 500; font-size: 16px; line-height: 22px; color: var(--text-light); margin-top: 2px; }
  .insp-call { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 60px; height: 60px; border-radius: 16px; background: var(--brand-primary); text-decoration: none; margin-left: 6px; transition: transform var(--dur-fast) var(--ease-out); }
  .insp-call:active { transform: scale(.94); }
  .insp-call svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 2.2; }

  .status { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; margin-top: 28px; background: var(--success-bg); border: 1.5px solid var(--success-bd); color: var(--success-tx); border-radius: 999px; padding: 10px 20px 10px 14px; font-weight: 700; font-size: 18px; }
  .status .chk { width: 28px; height: 28px; border-radius: 50%; background: var(--success); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .status .chk svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3; }

  /* standby hero: icon-first, minimal text (drivers = low literacy) */
  .standby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 32px calc(40px + var(--safe-bottom)); }
  /* 3D tanker with its green "ready" badge — the illustration carries the meaning, not the text */
  .illus { position: relative; width: 420px; height: 420px; margin: -40px 0 -20px; display: flex; align-items: center; justify-content: center; }
  /* radar: dispatch "scanning" for a job — rings ripple outward, a beam sweeps round */
  .radar { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; } /* centred on the driver's tanker */
  .radar .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(138,21,56,.22); animation: ripple 3.6s cubic-bezier(.2,.6,.3,1) infinite; }
  .radar .ring:nth-child(2) { animation-delay: 1.2s; }
  .radar .ring:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ripple { 0% { transform: scale(.42); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  .radar .disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(138,21,56,.10) 0%, rgba(138,21,56,.05) 45%, rgba(138,21,56,0) 70%); }
  .radar .beam { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(138,21,56,0) 0deg, rgba(138,21,56,0) 300deg, rgba(138,21,56,.22) 360deg); animation: sweep 4s linear infinite; -webkit-mask: radial-gradient(circle, #000 0 70%, transparent 71%); mask: radial-gradient(circle, #000 0 70%, transparent 71%); }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .illus .shadow { position: absolute; left: 50%; top: 50%; width: 220px; height: 30px; margin: 62px 0 0 -110px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(29,41,57,.2), rgba(29,41,57,0) 70%); }
  .illus .hero { position: relative; width: 280px; height: auto; filter: drop-shadow(0 14px 18px rgba(29,41,57,.16)); animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .standby h2 { font-weight: 700; font-size: 38px; line-height: 46px; letter-spacing: -.2px; }
  .bell { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; font-weight: 600; font-size: 19px; color: var(--text-light); }
  .bell svg { width: 24px; height: 24px; stroke: var(--text-light); flex-shrink: 0; }

  /* ── responsive ── */
  @media (max-width: 1024px) {
    :root { --rail-w: 84px; }
    .crest { width: 60px; height: 60px; }
    .rail-btn { width: 48px; height: 48px; } .rail-btn svg { width: 22px; height: 22px; }
    .topbar { padding-left: 24px; padding-right: 24px; }
    .insp-name h1 { font-size: 20px; line-height: 26px; }
    .status { font-size: 16px; }
    .standby h2 { font-size: 32px; line-height: 40px; }
  }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; flex-direction: row; padding: calc(10px + var(--safe-top)) 14px 10px; }
    .crest { width: 44px; height: 44px; }
    .rail-btn { width: 40px; height: 40px; margin: 0 0 0 10px; } .rail-btn svg { width: 20px; height: 20px; }
    .fams { margin: 0 0 0 14px; font-size: 14px; } .fams small { display: none; }
    .topbar { padding: 14px 16px; }
    .insp { gap: 12px; }
    .insp-avatar { width: 48px; height: 48px; font-size: 16px; }
    .insp-name h1 { font-size: 18px; line-height: 22px; white-space: normal; } /* wrap, never truncate — drivers must see the full name */
    .insp-phone { display: none; } /* the call button is the affordance on phones */
    .insp-role { font-size: 14px; line-height: 18px; }
    .insp-call { width: 48px; height: 48px; border-radius: 13px; } .insp-call svg { width: 22px; height: 22px; }
    .status { font-size: 14px; padding: 8px 14px 8px 10px; } .status .chk { width: 22px; height: 22px; } .status .chk svg { width: 12px; height: 12px; }
    .illus { width: 320px; height: 320px; margin: -24px 0 -12px; } .illus .hero { width: 240px; } .radar { width: 290px; height: 290px; }    .standby h2 { font-size: 30px; line-height: 36px; }
    .bell { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .illus .hero, .radar .ring, .radar .beam { animation: none; } .radar .ring { transform: scale(.7); opacity: .5; } }
</style>
</head>
<body>
  <aside class="sidebar" aria-label="Navigation">
    <img class="crest" src="assets/tadweer-driver-home/logo.svg" alt="Tadweer">
    <div class="spacer"></div>
    <button class="rail-btn" type="button" aria-label="Report a problem"><svg viewBox="0 0 24 24"><path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".7" fill="#fff" stroke="none"/></svg></button>
    <button class="rail-btn" type="button" aria-label="Log out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    <div class="fams">FAMS<small>BY FALKENHERZ</small></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="insp">
        <img class="insp-avatar" src="assets/tadweer-driver-home/avatar.png" alt="" aria-hidden="true">
        <div style="min-width:0">
          <div class="insp-name">
            <h1>Saim Bin Wali</h1>
            <span class="insp-phone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>+974 55 789 0123</span>
          </div>
          <div class="insp-role">Inspector</div>
        </div>
        <a class="insp-call" href="tel:+974557890123" aria-label="Call inspector Saim Bin Wali">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        </a>
      </div>
    </header>

    <main class="standby" role="status" aria-live="polite">
      <div class="illus" aria-hidden="true">
        <div class="radar"><div class="disc"></div><div class="beam"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
        <div class="shadow"></div>
        <img class="hero" src="assets/tadweer-driver-home/tanker-ready.svg" alt="">
      </div>
      <h2>Wait here</h2>
      <div class="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>You will start getting jobs soon</div>
      <div class="status"><span class="chk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>At assembly point</span></div>
    </main>
  </div>
</body>
</html>
