name: Visual regression (VRT)

# OPTIONAL lane — phase 4 §2, task 4.C. NOT part of the required PR gate
# (check.yml stays demo check + tool tests + app build/test, no screenshots):
# this suite needs a reachable self-hosted VRT instance
# (fams-design-system/infra/vrt/) and running it on every PR would both slow
# required CI down and fail spuriously without VRT_URL configured. Trigger
# explicitly:
#   - workflow_dispatch — run on demand from the Actions tab.
#   - the `visual-regression` label on a PR.
#
# Requires repo/environment secrets: VRT_URL, VRT_APIKEY (same instance the
# design system's suite uses — one shared VRT server, two projects).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  visual-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'visual-regression'
    runs-on: ubuntu-latest
    # Playwright's own image pins the exact browser + OS font stack CI
    # expects — see fams-design-system/infra/vrt/README.md § "Deterministic
    # fonts in CI".
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      VRT_URL: ${{ secrets.VRT_URL }}
      VRT_APIKEY: ${{ secrets.VRT_APIKEY }}
      VRT_PROJECT: fams-v5-demo-environment
      VRT_BRANCHNAME: ${{ github.head_ref || github.ref_name }}
      VRT_CIBUILDID: ${{ github.run_id }}
    steps:
      - name: Checkout fams-v5-demo-environment
        uses: actions/checkout@v4
        with:
          path: fams-v5-demo-environment

      # Same interim sibling-checkout pattern as check.yml — the app links
      # the design system's packages via pnpm `link:` until a published
      # registry exists.
      - name: Checkout fams-design-system (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DESIGN_SYSTEM_REPO }}
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: fams-design-system

      # pnpm setup mechanism, consistent across all three demo workflows
      # (check.yml, capture.yml, visual.yml): pnpm/action-setup@v4 with no
      # pinned version, so it honours the repo's `packageManager` field
      # (pnpm@11.1.3 in package.json) as its single source of truth.
      - uses: pnpm/action-setup@v4

      # Node 22, NOT 20: pnpm 11 relies on `node:sqlite` (Node 22.5+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fams-v5-demo-environment/pnpm-lock.yaml

      - name: Build the design system (all packages)
        working-directory: fams-design-system
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install demo deps (links the design system) + msw worker
        working-directory: fams-v5-demo-environment
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter app msw:init

      - name: Suite B — visual-matrix (tenant x persona x screen)
        working-directory: fams-v5-demo-environment
        run: pnpm --filter app test:visual
