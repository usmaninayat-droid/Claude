name: capture

# Capture-as-a-GitHub-Action (decision #17, the failure ladder). Runs the
# approval-time canonicalizer when a maintainer APPROVES the PR or comments
# `/capture`. It canonicalizes the locked-in resolved/ diff into minimal typed
# deltas, commits them to the PR branch, and posts the ops list as a PR comment.
# Loud + harmless: an inexpressible edit makes this check red (PR stays open),
# UNLESS the PR carries the `needs-canonicalization` label — then it merges as
# flagged debt (ladder step 2): capture still commits every expressible edit AND
# commits a tracked `*.override.json` debt record + the hand-edited resolved/, so
# the branch is mergeable (check stays green with a loud warning) while the debt
# is visible on the dashboard. Never silent: every path posts a PR comment.
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Least-privilege: commit to the PR branch + comment on the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    # Gate: an APPROVED review, or a `/capture` comment on a PR (not an issue).
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/capture'))
    steps:
      - name: Resolve the PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fams-v5-demo-environment (PR branch)
        uses: actions/checkout@v4
        with:
          path: fams-v5-demo-environment
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check out the PR head branch
        working-directory: fams-v5-demo-environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ steps.pr.outputs.number }}

      # Same design-system build as check.yml (INTERIM sibling link: until a
      # published registry exists — see check.yml for the DESIGN_SYSTEM_* vars).
      - name: Checkout fams-design-system (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DESIGN_SYSTEM_REPO }}
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: fams-design-system

      # pnpm setup mechanism, consistent across all three demo workflows
      # (check.yml, capture.yml, visual.yml): pnpm/action-setup@v4 with no
      # pinned version, so it honours the repo's `packageManager` field
      # (pnpm@11.1.3 in package.json) as its single source of truth.
      - uses: pnpm/action-setup@v4

      # Node 22, NOT 20: pnpm 11 relies on `node:sqlite` (Node 22.5+); on Node
      # 20 `pnpm store path` throws ERR_UNKNOWN_BUILTIN_MODULE (same reason as
      # the design system's ci.yml and this repo's visual.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fams-v5-demo-environment/pnpm-lock.yaml

      - name: Build the design system (all packages)
        working-directory: fams-design-system
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install demo deps (links the design system)
        working-directory: fams-v5-demo-environment
        run: pnpm install --frozen-lockfile

      # Ladder step 2: the `needs-canonicalization` label lets an ambiguous
      # capture through as flagged debt (exit 0 + loud warning comment).
      - name: Detect the needs-canonicalization override label
        id: override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh pr view ${{ steps.pr.outputs.number }} --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx 'needs-canonicalization'; then
            echo "flag=1" >> "$GITHUB_OUTPUT"
          else
            echo "flag=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run capture (the ladder)
        id: capture
        working-directory: fams-v5-demo-environment
        env:
          CAPTURE_OVERRIDE: ${{ steps.override.outputs.flag }}
        run: node tools/capture-action.mjs
        continue-on-error: true

      # Push the bot's commit(s) back to the PR branch. This runs whenever
      # capture exited 0 (step outcome 'success') — that is BOTH ladder rungs
      # that produce commits: SUCCESS (canonicalized deltas + resolved/) AND
      # OVERRIDE (ladder ②: expressible edits + the *.override.json debt records
      # + the hand-edited resolved/ + the regenerated dashboard). It is a
      # harmless no-op when nothing was committed (e.g. a tree already in sync).
      # It is SKIPPED on the unflagged-ambiguous rung (exit 1 → step outcome
      # 'failure' → nothing to push, PR stays red/open).
      # LIMITATION: pushing to a PR opened from a FORK needs the fork to allow
      # maintainer edits AND a token with write access to the fork branch; the
      # default GITHUB_TOKEN cannot push to a fork, so on fork PRs the bot still
      # posts the report comment but the contributor must apply the commit.
      - name: Push capture commit (SUCCESS + OVERRIDE — both exit 0)
        if: steps.capture.outcome == 'success'
        working-directory: fams-v5-demo-environment
        run: git push

      - name: Post the capture report as a PR comment (never silent)
        working-directory: fams-v5-demo-environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ steps.pr.outputs.number }} --repo "$GITHUB_REPOSITORY" --body-file capture-report.md

      - name: Reflect the ladder outcome in the check status
        if: steps.capture.outcome == 'failure'
        run: |
          echo "capture: ambiguous edit and no needs-canonicalization label — failing the check (PR stays open)."
          exit 1
