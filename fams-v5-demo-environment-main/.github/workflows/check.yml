name: check

# The CI gate (decision #17): resolve(core + deltas) MUST equal committed
# resolved/, ops/manifests/JSON must be valid, and the tests must pass — on
# every push and PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fams-v5-demo-environment
        uses: actions/checkout@v4
        with:
          path: fams-v5-demo-environment

      # INTERIM (flagged for founder): tools consume @fams/v5-composer via a
      # sibling `link:` until a published registry exists. CI must therefore
      # check out and build the design system next to this repo. Set the
      # DESIGN_SYSTEM_REPO variable (owner/repo) and, for a private repo, a
      # DESIGN_SYSTEM_TOKEN secret with read access.
      - name: Checkout fams-design-system (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DESIGN_SYSTEM_REPO }}
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: fams-design-system

      # pnpm setup mechanism, consistent across all three demo workflows
      # (check.yml, capture.yml, visual.yml): pnpm/action-setup@v4 with no
      # pinned version, so it honours the repo's `packageManager` field
      # (pnpm@11.1.3 in package.json) as its single source of truth.
      - uses: pnpm/action-setup@v4

      # Node 22, NOT 20: pnpm 11 relies on `node:sqlite` (Node 22.5+); on Node
      # 20 `pnpm store path` throws ERR_UNKNOWN_BUILTIN_MODULE (same reason as
      # the design system's ci.yml and this repo's visual.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fams-v5-demo-environment/pnpm-lock.yaml

      # Build ALL design-system packages, not just the composer: the tools need
      # @fams/v5-composer, but the demo APP links demo-kit / skeleton-kit /
      # tokens / ui-kit / v5-kit / v5-templates too, and its build + tests fail
      # without their dist. (INTERIM: sibling `link:` until a published registry.)
      - name: Build the design system (all packages)
        working-directory: fams-design-system
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install demo deps (links the design system)
        working-directory: fams-v5-demo-environment
        run: pnpm install --frozen-lockfile

      - name: Lint repo JSON + verify resolved is not stale
        working-directory: fams-v5-demo-environment
        run: pnpm demo check

      - name: Tool tests (resolve/check/capture/promote + break-a-delta proof)
        working-directory: fams-v5-demo-environment
        run: pnpm test

      # App regressions must fail CI too: typecheck + build (the render path) and
      # the jsdom/MSW integration suite (persona gating, tenant deltas, the
      # workforce→vehicle coherence path, the pipeline rule gate).
      - name: Build the demo app (tsc + vite)
        working-directory: fams-v5-demo-environment
        run: pnpm --filter app build

      - name: App tests (jsdom + msw/node)
        working-directory: fams-v5-demo-environment
        run: pnpm --filter app test
