<!doctype html>
<html lang="en" data-tenant="iwmp" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#22C882">
<title>Tadweer — Contract Management</title>
<!-- Design-system token layer (link-mode symlink → ../fams-design-system-main) -->
<link rel="stylesheet" href="/fams-design-system/packages/tokens/fonts.css">
<link rel="stylesheet" href="/fams-design-system/packages/tokens/dist/tokens.css">
<link rel="stylesheet" href="/fams-design-system/packages/tokens/dist/theme.css">
<link rel="stylesheet" href="/fams-design-system/packages/tokens/dist/tenants.css">
<link rel="stylesheet" href="cm.css">
<script>try{if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed')}catch(e){}</script>
</head>
<body>

<!-- ══ List (Figma 2111:10733) ══ -->
<div class="cm-app" id="cmApp">
  <div class="toolbar">
    <div class="tb-left">
      <label class="search">
        <svg class="ic" width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#i-search-refraction"/></svg>
        <input id="cmSearch" placeholder="Search anything here" autocomplete="off" aria-label="Search contracts">
      </label>
      <button class="iconbtn" id="cmFilter" type="button" aria-label="Filter">
        <svg class="ic" width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#i-filter-funnel-01"/></svg>
      </button>
    </div>
    <button class="btn-primary sm" id="cmCreate" type="button">
      <svg class="ic" width="12" height="12" aria-hidden="true"><use href="assets/icons.svg#i-plus"/></svg>Create New Contract
    </button>
  </div>
  <div class="kpis" id="cmKpis"></div>
  <div class="grid" id="cmGrid"></div>
</div>

<!-- ══ Contract Details (Figma 2303:2988 · Timeline 2303:3679 · Raw Data 2303:4514) ══ -->
<div class="cm-detail" id="cmDetail" hidden>
  <div class="dt-top">
    <div class="dt-tl">
      <button class="dt-back" id="dtBack" type="button" aria-label="Back to contracts"><svg class="ic" width="20" height="20" aria-hidden="true"><use href="assets/icons.svg#i-arrow-narrow-left"/></svg></button>
      <div class="dt-crumb"><span class="c1"><svg class="ic r180" width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#i-hash-02"/></svg><b id="dtId">CRT123</b></span><span class="c2" id="dtTitle">LOT 1: Abu Dhabi Contract</span></div>
      <span class="chip esp" id="dtEsp"><span class="av">B</span>Beah</span>
      <span class="chip lot" id="dtLot"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#i-skew"/></svg>Lot 1</span>
    </div>
    <div class="dt-tr">
      <span class="dt-active" id="dtStatus">Active</span>
      <button class="dt-act" id="dtTimeline" type="button" aria-label="Open timeline"><svg class="ic" width="20" height="20" aria-hidden="true"><use href="assets/icons.svg#i-activity"/></svg></button>
    </div>
  </div>
  <div class="dt-wrap" id="dtWrap"></div>
  <div class="dt-drawer" id="dtDrawer" hidden>
    <div class="dt-scrim" id="dtScrim"></div>
    <div class="dt-panel" id="dtPanel"></div>
  </div>
</div>

<!-- ══ Create New Contract wizard (Figma 2111:1925 …) ══ -->
<div class="cm-wizard" id="cmWizard" hidden>
  <button class="wz-close" id="wzClose" type="button" aria-label="Close">
    <svg class="ic" width="24" height="24" aria-hidden="true"><use href="assets/icons.svg#i-x"/></svg>
  </button>
  <div class="wz-panel" role="dialog" aria-modal="true" aria-labelledby="wzTitle">
    <aside class="wz-rail">
      <h2 class="wz-title" id="wzTitle">Create New Contract</h2>
      <div class="wz-steps" id="wzSteps"></div>
    </aside>
    <section class="wz-main">
      <div class="wz-content">
        <div class="wz-title-row" id="wzTitleRow"></div>
        <div class="wz-body" id="wzBody"></div>
      </div>
      <div class="wz-foot">
        <button class="wz-back" id="wzBack" type="button">Back</button>
        <button class="btn-primary lg" id="wzNext" type="button">Save and Continue</button>
      </div>
    </section>
  </div>
</div>

<script src="cm.js"></script>
</body>
</html>
