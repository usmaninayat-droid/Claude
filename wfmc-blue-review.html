/* ---------- 6. ATTENDANCE TWO-SOURCE ---------- */
route('attendance', ()=>{
  return `
    <div class="page-head">
      <div>
        <h2>Attendance · two data sources <span class="chip blue" style="vertical-align:middle;margin-left:6px">Source-aware</span></h2>
        <div class="sub">Drivers: attendance derived from <strong>Plan-login</strong> (opening and executing their route in the app). Helpers &amp; terminal workforce: <strong>BioTime</strong> biometric only. The register never pretends these are the same event.</div>
      </div>
      <div class="ref">ATT · v1</div>
    </div>

    <div class="grid-4" style="margin-bottom:16px">
      <div class="kpi"><div class="label">Rostered today</div><div class="value">${EMPS.length}</div></div>
      <div class="kpi"><div class="label">Plan-login</div><div class="value" style="color:var(--blue-500)">${EMPS.filter(e=>e.src==='plan').length}</div><div class="delta">Drivers · route-based</div></div>
      <div class="kpi"><div class="label">BioTime</div><div class="value" style="color:var(--violet-500)">${EMPS.filter(e=>e.src==='bio').length}</div><div class="delta">Helpers / terminal</div></div>
      <div class="kpi warn"><div class="label">Missing source</div><div class="value">1</div><div class="delta">Expected but no signal</div></div>
    </div>

    <div class="card">
      <h3>Daily attendance register · 12 Aug 2026</h3>
      <table>
        <thead><tr><th>Employee</th><th>Role</th><th>Shift</th><th>Source</th><th>In</th><th>Out</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${EMPS.map(e=>{
            const src = e.src==='plan'?'<span class="src plan"><i class="fa-solid fa-route"></i> Plan-login</span>':'<span class="src bio"><i class="fa-solid fa-fingerprint"></i> BioTime</span>';
            const inT = e.src==='plan' ? '06:04' : '05:58';
            const outT = e.src==='plan' ? '14:12' : '14:03';
            const stat = e.status.startsWith('blocked') ? '<span class="chip red">Blocked</span>' : '<span class="chip green">Present</span>';
            return `<tr><td><strong>${e.name}</strong><div style="font-size:11px;color:var(--ink-3)">${e.id}</div></td><td>${e.role}</td><td>${SHIFTS.find(x=>x.id===e.shift).name}</td><td>${src}</td><td>${inT}</td><td>${outT}</td><td>${stat}</td><td><button class="btn ghost" onclick="showPunch('${e.id}')"><i class="fa-solid fa-magnifying-glass-plus"></i></button></td></tr>`;
          }).join('')}
          <tr style="background:var(--red-100)"><td><strong>Kareem Anwar</strong><div style="font-size:11px;color:var(--ink-3)">TJ-5122</div></td><td>HD Driver</td><td>Morning Shift</td><td><span class="src none"><i class="fa-solid fa-circle-question"></i> No signal</span></td><td>—</td><td>—</td><td><span class="chip red">Absent · plan not opened</span></td><td><button class="btn ghost"><i class="fa-solid fa-magnifying-glass-plus"></i></button></td></tr>
        </tbody>
      </table>
      <div style="margin-top:12px;padding:12px 14px;background:var(--surface-2);border-radius:8px;font-size:12.5px;color:var(--ink-2)">
        <strong>Missing-source state:</strong> a driver expected on Plan-login who never opened the app shows as <em>"Absent · plan not opened"</em> — never as a BioTime miss. The two sources are never conflated.
      </div>
    </div>

    <div class="grid-2">
      <div class="card" style="border-left:4px solid var(--blue-500)">
        <h3><span class="src plan"><i class="fa-solid fa-route"></i> Plan-login</span> · how it works</h3>
        <ol style="padding-left:20px;font-size:12.5px;color:var(--ink-2);line-height:1.9">
          <li>Driver opens the app for their published plan</li>
          <li>App confirms identity + route</li>
          <li>Login timestamp = attendance In</li>
          <li>Route completion = attendance Out</li>
          <li>Deviation from shift window flagged via grace rules from the shift's timing variant</li>
        </ol>
        <div style="margin-top:10px;font-size:11.5px;color:var(--ink-3)">Applies to: HD Driver, LD Driver</div>
      </div>
      <div class="card" style="border-left:4px solid var(--violet-500)">
        <h3><span class="src bio"><i class="fa-solid fa-fingerprint"></i> BioTime</span> · how it works</h3>
        <ol style="padding-left:20px;font-size:12.5px;color:var(--ink-2);line-height:1.9">
          <li>Employee taps their card at depot device</li>
          <li>Device polls WFMC every 10 minutes</li>
          <li>Punch matched to employee &amp; shift</li>
          <li>In / Out derived from first / last punch</li>
          <li>Missed punches route to regularization workflow</li>
        </ol>
        <div style="margin-top:10px;font-size:11.5px;color:var(--ink-3)">Applies to: Labour, Helper, Supervisor, Terminal staff</div>
      </div>
    </div>
  `;
}, 'Attendance', 'Workforce › Attendance');

function showPunch(id){
  const e = EMPS.find(x=>x.id===id);
  const isPlan = e.src==='plan';
  modal(`
    <div class="modal" style="max-width:520px">
      <div class="h">
        ${isPlan?'<span class="src plan"><i class="fa-solid fa-route"></i> Plan-login</span>':'<span class="src bio"><i class="fa-solid fa-fingerprint"></i> BioTime</span>'}
        <h4>${e.name} · punch detail</h4><button class="btn ghost" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="b">
        ${isPlan?`
          <div class="field"><label>Plan ID</label><input value="PLN-2026-08-12-R14" disabled></div>
          <div class="field"><label>Login timestamp</label><input value="06:04:12 · 12 Aug 2026" disabled></div>
          <div class="field"><label>Route executed</label><input value="R-14 · Musaffah Sector 3" disabled></div>
          <div class="field"><label>Completion</label><input value="14:12:44 · 118 bins collected" disabled></div>
        `:`
          <div class="field"><label>Device</label><input value="BIO-MSF-01 · Musaffah gate" disabled></div>
          <div class="field"><label>First punch</label><input value="05:58:20 · 12 Aug 2026" disabled></div>
          <div class="field"><label>Shift window</label><input value="Morning · Early · 05:00–13:00" disabled></div>
          <div class="field"><label>Exception</label><input value="None · within grace" disabled></div>
        `}
        <div class="field"><label>Actions</label>
          <div style="display:flex;gap:8px"><button class="btn ghost"><i class="fa-solid fa-download"></i> Timesheet</button><button class="btn ghost"><i class="fa-regular fa-pen-to-square"></i> Regularization</button></div>
        </div>
      </div>
    </div>
  `);
}
