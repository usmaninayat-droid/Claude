<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAJMEE'E — WFMC Blue Review (13 Aug 2026)</title>
<!--
  ============================================================================
  WFMC BLUE REVIEW PROTOTYPE — for internal review 13 Aug 2026
  ----------------------------------------------------------------------------
  Covers the five BLUE (committed) workstreams from the 06-Aug design sync,
  plus the Global Shift entity that blocks four of them.
    1. Global Shift entity                     (settings)
    2. Employee Master — field alignment       (workforce)
    3. Document Expiry Alerts + Dispatch Block (alerts)
    4. Training / Skill Matrix / Materials     (compliance)
    5. Roster board + working-hours rules      (workforce)
    6. Attendance — two sources                (workforce)
  Green (good-for-product) and Parked items are intentionally excluded.
  Blue vs Green partitioning is preserved via the topbar banner and nav tags.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================================
   TAJMEE'E / IWMP BRANDING — tokens mirror contract-management/index.html
   Primary #22c882 (IWMP green) · blue→green gradient rail · Gilroy → Inter fallback
   ============================================================================ */
:root{
  /* ── Colors (unchanged — IWMP/Tadweer palette) ── */
  --fams:#0072D6; --fams-hover:#005CAB; --fams-50:#E6F1FB; --fams-200:#8ABEEC;
  --primary:#22c882; --primary-hover:#43d095; --primary-lightest:#e9faf3;
  --blue-500:#0072d6; --blue-100:#e6f2fc; --blue-50:#eaf4fd;   /* info accent */
  --green-500:#12b76a; --green-100:#e7f9f1;                     /* success tint */
  --amber-500:#f79009; --amber-100:#fef3e6;                     /* warning tint */
  --red-500:#f04438;   --red-100:#feecec;                       /* error tint */
  --violet-500:#444ce7; --violet-100:#eceefd;                   /* indigo tint */
  --bg:#f9fafb; --surface:#ffffff; --surface-2:#f9fafb;
  --line:#eaecf0; --line-strong:#d0d5dd;
  --ink:#101828; --ink-2:#344054; --ink-3:#98a2b3;
  --sidebar:linear-gradient(180deg,#0a8bc4 0%,#19b09d 30%,#22c784 70%,#26d07c 100%);
  --sidebar-ink:rgba(255,255,255,.75); --sidebar-active:#FFFFFF;
  --module-rail:#FFFFFF;

  /* ── Elevation — FAMS V5 Figma Standard ladder ── */
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-1:0px 1px 2px 0px rgba(16,24,40,.06), 0px 1px 3px 0px rgba(16,24,40,.10);
  --shadow-2:0px 2px 4px -2px rgba(16,24,40,.06), 0px 4px 8px -2px rgba(16,24,40,.10);
  --shadow-3:0px 4px 6px -2px rgba(16,24,40,.03), 0px 12px 16px -4px rgba(16,24,40,.08);
  --shadow-4:0px 8px 8px -4px rgba(16,24,40,.03), 0px 20px 24px -4px rgba(16,24,40,.08);
  --shadow-5:0px 24px 48px -12px rgba(16,24,40,.18);
  --shadow-6:0px 32px 64px -12px rgba(16,24,40,.14);

  /* ── Radius — FAMS V5 (6px default; 2/4/8 ladder) ── */
  --radius-sm:2px; --radius-md:4px; --radius:6px; --radius-lg:8px; --radius-xl:8px; --radius-full:999px;

  /* ── Typography ── */
  --font:'Gilroy','Inter',system-ui,-apple-system,sans-serif;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;

  /* Semantic size scale (Figma V2 aligned) */
  --text-h1:48px;      --lh-h1:56px;
  --text-h2:40px;      --lh-h2:48px;
  --text-h3:32px;      --lh-h3:40px;
  --text-h4:28px;      --lh-h4:36px;
  --text-h5:24px;      --lh-h5:32px;
  --text-h6:20px;      --lh-h6:26px;
  --text-body-xl:20px; --lh-body-xl:26px;
  --text-body-lg:18px; --lh-body-lg:26px;
  --text-body-md:16px; --lh-body-md:24px;
  --text-body-sm:14px; --lh-body-sm:20px;
  --text-body-xs:12px; --lh-body-xs:18px;
  --text-caption:12px; --lh-caption:14px;   /* platform 12px minimum */
  --lh-base:1.5;

  /* ── FAMS V5 design-system tokens (Tadweer tenant) — used by roster .fcal-*/.ros-* ── */
  --ds-primary:#22C882; --ds-border:#EAECF0; --ds-gray-300:#D0D5DD; --ds-gray-400:#98A2B3;
  --ds-gray-600:#475467; --ds-bg:#F9FAFB; --ds-success:#12B76A; --ds-warning:#F79009;
  --ds-error:#F04438; --ds-error-dark:#B42318; --ds-info:#0072D6; --ds-fg:#101828;
  --ds-purple:#9E77ED; --ds-ring:#DCFAE6; --ds-fams:#0072D6; --ds-blue-light:#339CE7;
}
[data-theme="dark"]{
  --bg:#0C1220; --surface:#131A2A; --surface-2:#1A2338;
  --line:#25304A; --line-strong:#374561;
  --ink:#F5F7FA; --ink-2:#B4BFD1; --ink-3:#7A879E;
  --sidebar:linear-gradient(180deg,#0a5a7c 0%,#0f6d5a 60%,#12805a 100%);
  --module-rail:#131A2A;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 4px 12px rgba(0,0,0,.35);
  --blue-100:#0F3253; --blue-50:#0B2340; --green-100:#0F3B29; --amber-100:#3D2B10; --red-100:#3D1E1A; --violet-100:#231C45;
}
*{margin:0;padding:0;box-sizing:border-box;border-color:var(--line)}
html{scroll-behavior:smooth;font-family:var(--font)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
     font-size:var(--text-body-sm);line-height:var(--lh-base);
     font-weight:var(--fw-regular);overflow:hidden;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     font-feature-settings:"cv02","cv03","cv04","cv11";}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit;font-weight:var(--fw-medium)}
input,select,textarea{font-family:inherit;font-size:var(--text-body-sm);color:inherit;font-weight:var(--fw-regular)}
/* Base heading defaults (only apply where no explicit text-* class is set) */
h1{font-size:var(--text-h1);line-height:var(--lh-h1);font-weight:var(--fw-semibold);font-family:var(--font)}
h2{font-size:var(--text-h2);line-height:var(--lh-h2);font-weight:var(--fw-semibold);font-family:var(--font)}
h3{font-size:var(--text-h3);line-height:var(--lh-h3);font-weight:var(--fw-semibold);font-family:var(--font)}
h4{font-size:var(--text-h4);line-height:var(--lh-h4);font-weight:var(--fw-semibold);font-family:var(--font)}
h5{font-size:var(--text-h5);line-height:var(--lh-h5);font-weight:var(--fw-semibold);font-family:var(--font)}
h6{font-size:var(--text-h6);line-height:var(--lh-h6);font-weight:var(--fw-semibold);font-family:var(--font)}
label{font-size:var(--text-caption);line-height:var(--lh-caption);font-weight:var(--fw-semibold);font-family:var(--font)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}

/* ================ LAYOUT — IWMP dual rail: 52px gradient + 66px white ================ */
.app{display:grid;grid-template-columns:52px 66px 1fr;grid-template-rows:1fr;height:100vh;
     grid-template-areas:"apprail modrail main"}

/* Primary rail — 52px, tadweer gradient, 1:1 port of contract-management .sidenav-primary */
.apprail{grid-area:apprail;background:var(--sidebar);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:16px 12px;z-index:20}
.apprail-top{display:flex;flex-direction:column;align-items:flex-start;gap:28px;width:28px;flex:none}
/* Tadweer logo — ring-mask.svg (masked white) + logo-text.svg (image below) */
.tadweer{position:relative;width:28px;height:34px;flex:none}
.tadweer .ring{position:absolute;left:5px;top:1px;width:18.51px;height:19.92px;background:#ffffff;
               -webkit-mask-image:url('./contract-management/icons/ring-mask.svg');mask-image:url('./contract-management/icons/ring-mask.svg');
               -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.tadweer .txt{position:absolute;left:0;top:23.09px;width:28px;height:10.05px;display:block}
.apprail-apps{display:flex;flex-direction:column;align-items:flex-start;gap:16px;width:28px;flex:none}
.apptile{position:relative;width:28px;height:28px;border-radius:var(--radius);flex:none;
         display:flex;align-items:center;justify-content:center;cursor:pointer}
.apptile.active{background:#ffffff;border-left:2px solid rgba(34,200,130,.3)}
.apptile.tile2{background:rgba(255,255,255,.4);border-left:2px solid rgba(34,200,130,.2)}
.apptile img{width:18px;height:18px;object-fit:contain;display:block}
.apprail-bottom{display:flex;flex-direction:column;align-items:center;gap:12px;flex:none}
.apprail .foot{width:28px;height:28px;border-radius:41px;background:rgba(255,255,255,.20);
               display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,box-shadow .15s}
.apprail .foot:hover{background:rgba(255,255,255,.30)}
.apprail .foot.active{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.apprail .foot.active img{filter:brightness(0) saturate(1) invert(58%) sepia(78%) saturate(400%) hue-rotate(105deg) brightness(92%) contrast(88%)}
.apprail .foot img{width:18px;height:18px;object-fit:contain;display:block}

/* Secondary rail — 66px white, 1:1 port of contract-management .sidenav-secondary */
.modrail{grid-area:modrail;background:var(--module-rail);border-right:1px solid var(--line-strong);
         display:flex;flex-direction:column;align-items:center;padding:16px;gap:16px;overflow-y:auto;z-index:19}
.modrail .brand{display:none}
.nav-label{display:none}

/* .nav-item styled exactly like contract-management .sidenav-item */
.nav-item{position:relative;width:34px;height:34px;border-radius:var(--radius);flex:none;
          display:flex;align-items:center;justify-content:center;cursor:pointer;
          background:transparent;border:none;padding:0;transition:background .15s}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--primary)}
.nav-item.active img{filter:brightness(0) invert(1)}
.nav-item:not(.active){filter:drop-shadow(0 .944px .944px rgba(16,24,40,.05))}
.nav-item img{width:18px;height:18px;object-fit:contain;display:block}
.nav-item i{display:none}      /* FontAwesome fallback hidden — SVG imgs win */
.nav-item .item-label{display:none}
.nav-item .tag{display:none}

/* Tooltip on hover — 24px right of tile, ink pill */
.nav-item::after{content:attr(data-tt);position:absolute;left:calc(100% + 24px);top:50%;transform:translateY(-50%);
                 background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:var(--radius);
                 white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s;
                 box-shadow:var(--shadow-1);z-index:30}
.nav-item:hover::after{opacity:1;visibility:visible}

.topbar{grid-area:topbar;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.topbar .title{font-size:14px;font-weight:600;color:var(--ink)}
.topbar .crumb{color:var(--ink-3);font-size:12.5px;margin-left:6px}
.topbar .spacer{flex:1}
.topbar .action{padding:6px 12px;border-radius:var(--radius);background:transparent;border:1px solid var(--line-strong);color:var(--ink-2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-xs)}
.topbar .action:hover{background:var(--primary-lightest);color:var(--primary);border-color:var(--primary)}

.banner{grid-area:banner;background:var(--primary-lightest);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;font-size:12.5px;color:var(--ink-2)}
.banner .pill{background:var(--primary);color:#fff;padding:2px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:700;letter-spacing:.5px}
.banner strong{color:var(--ink)}
.banner .right{margin-left:auto;color:var(--ink-3);font-size:11.5px}

.main{grid-area:main;overflow-y:auto;padding:24px 28px 60px}

/* ================ COMPONENTS ================ */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head h2{font-size:20px;font-weight:700;margin-bottom:4px}
.page-head .sub{color:var(--ink-2);font-size:13px;max-width:720px}
.page-head .ref{margin-left:auto;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:none;margin-bottom:16px}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3 .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:var(--radius);background:var(--blue-100);color:var(--primary);letter-spacing:.4px}
.card h3 .badge.new{background:var(--green-100);color:var(--green-500)}
.card h3 .sub{margin-left:auto;color:var(--ink-3);font-size:12px;font-weight:400}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative}
.kpi .label{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .value{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .delta{margin-top:4px;font-size:11.5px;color:var(--ink-2)}
.kpi.warn{border-color:var(--amber-500);background:var(--amber-100)}
.kpi.warn .value{color:var(--amber-500)}
.kpi.crit{border-color:var(--red-500);background:var(--red-100)}
.kpi.crit .value{color:var(--red-500)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink)}
tr:hover td{background:var(--surface-2)}
.thin td{padding:8px 12px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chip.blue{background:var(--blue-100);color:var(--blue-500)}
.chip.green{background:var(--green-100);color:var(--green-500)}
.chip.amber{background:var(--amber-100);color:var(--amber-500)}
.chip.red{background:var(--red-100);color:var(--red-500)}
.chip.violet{background:var(--violet-100);color:var(--violet-500)}
.chip.gray{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-strong)}
.chip.new-field{background:transparent;color:var(--green-500);border:1px dashed var(--green-500);text-transform:none}

/* Buttons */
.btn{padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all .15s;border:1px solid transparent;line-height:1.2;box-shadow:var(--shadow-xs)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn.danger{background:var(--red-500);color:#fff}
.btn.subtle{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary-lightest)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.field label .req{color:var(--red-500);margin-left:2px}
.field label .new{background:var(--green-100);color:var(--green-500);font-size:9.5px;padding:1px 5px;border-radius:3px;margin-left:6px;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);transition:border .15s;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-lightest)}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.field.added{background:linear-gradient(90deg,rgba(21,149,112,.06),transparent);padding:8px;margin:0 -8px 6px;border-radius:6px}

/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(11,31,53,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;box-shadow:var(--shadow-3);max-height:90vh;overflow-y:auto}
.modal .h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal .h h4{font-size:15px;font-weight:700;flex:1}
.modal .b{padding:20px 22px}
.modal .f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius);box-shadow:var(--shadow-3);z-index:100;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* Roster board — Drivers & Shifts pattern (iwmp-prototype reference) */
.roster{overflow-x:auto}
.roster table{min-width:1080px;border-collapse:separate;border-spacing:0}
.roster th{background:#fff;border-bottom:1px solid var(--line);padding:14px 12px;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-align:center;text-transform:uppercase}
.roster th.emp{text-align:left;padding-left:16px}
.roster th .dnum{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-top:4px;letter-spacing:0}
.roster td.day{width:12.4%;padding:8px;vertical-align:top;border-bottom:1px solid var(--line)}
.roster tbody tr:hover td{background:#FAFBFC}
.roster tbody tr:hover td.warn-day{background:rgba(247,144,9,.10)}
.roster tbody tr:hover td.block-day{background:rgba(240,68,56,.09)}
.roster .emp{width:200px;min-width:200px;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.roster .drv-row{display:flex;align-items:center;gap:12px}
.roster .drv-av{width:36px;height:36px;border-radius:var(--radius-full);color:#fff;font-weight:700;font-size:12.5px;
                display:flex;align-items:center;justify-content:center;flex:none;font-family:'Gilroy',var(--font)}
.roster .drv-info{flex:1;min-width:0}
.roster .drv-name{font-weight:600;font-size:13px;color:var(--ink);line-height:1.35}
.roster .drv-role{font-size:11px;color:var(--ink-3);margin-top:1px}
.roster .drv-util{font-size:9.5px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;margin-top:4px;text-transform:uppercase}

/* Shift cell — reference: time · route · depot; left border tinted per shift */
.shift-cell{display:block;padding:8px 10px 9px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);
            border-left:3px solid var(--green-500);cursor:grab;user-select:none;line-height:1.35;transition:box-shadow .12s}
.shift-cell:hover{box-shadow:var(--shadow-1)}
.shift-cell .t{font-size:11px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font);letter-spacing:.01em}
.shift-cell .r{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);margin-top:4px;font-weight:600}
.shift-cell .r .em{font-size:12px;line-height:1;flex:none}
.shift-cell .d{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3);margin-top:3px;font-weight:500}
.shift-cell .d i{font-size:9px;color:var(--red-500)}
.shift-cell.morning{border-left-color:var(--green-500)}
.shift-cell.afternoon{border-left-color:var(--violet-500)}
.shift-cell.night{border-left-color:#1F2937;background:#0F172A;color:#F3F4F6}
.shift-cell.night .t{color:#fff}
.shift-cell.night .r{color:#CBD5E1}
.shift-cell.night .d{color:#94A3B8}
.shift-cell.night .d i{color:#F97066}
.shift-cell.standby{border-left-color:var(--amber-500);border-left-width:3px;background:#FFFBF0}
.shift-cell.reliever{border-left-color:var(--green-500);border-left-width:3px;background:#F0FBF6}
.off-cell{display:flex;align-items:center;justify-content:center;height:64px;color:var(--ink-3);font-size:12px;font-weight:500}

/* Day-6 warn + Day-7 hard block — WFMC-specific rule enforcement */
td.warn-day{background:rgba(247,144,9,.06);position:relative}
td.warn-day .shift-cell{border-left-color:var(--amber-500);box-shadow:inset 0 0 0 1px rgba(247,144,9,.25)}
td.warn-day::after{content:'\f071';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:4px;right:6px;font-size:10px;color:var(--amber-500)}
td.block-day{background:rgba(240,68,56,.05);position:relative}
td.block-day::after{content:'\f023';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:4px;right:6px;font-size:10px;color:var(--red-500)}
.block-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;color:var(--red-500);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-align:center;text-transform:uppercase;line-height:1.3}
.block-msg i{font-size:14px;margin-bottom:4px}
.doc-block-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;
                background:repeating-linear-gradient(45deg,var(--red-100),var(--red-100) 5px,transparent 5px,transparent 10px);
                border:1px dashed var(--red-500);border-radius:var(--radius);color:var(--red-500);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-align:center;text-transform:uppercase;line-height:1.3}
.doc-block-cell i{font-size:12px;margin-bottom:3px}

/* Underlined tabs — reference pattern */
.ros-tabs-under{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);padding:0 24px}
.ros-tabs-under .tab{padding:14px 4px 12px;margin-right:28px;font-size:13px;font-weight:600;color:var(--ink-3);
                     background:transparent;border:none;cursor:pointer;position:relative;font-family:'Gilroy',var(--font);transition:color .15s}
.ros-tabs-under .tab:hover{color:var(--ink-2)}
.ros-tabs-under .tab.active{color:var(--primary)}
.ros-tabs-under .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px 2px 0 0}
.ros-tabs-under .tab .cnt{display:inline-flex;align-items:center;justify-content:center;background:var(--red-500);color:#fff;
                          font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:6px;letter-spacing:.03em}

/* Toolbar row — Search / Depot / Showing X of Y / New Shift */
.ros-toolbar-2{padding:14px 24px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ros-search{position:relative;flex:1;max-width:340px}
.ros-search input{width:100%;padding:8px 12px 8px 34px;background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius-md);
                  font-size:12.5px;color:var(--ink);height:36px;font-family:'Gilroy',var(--font)}
.ros-search input:focus{outline:2px solid var(--primary-lightest);outline-offset:-1px;border-color:var(--primary)}
.ros-search::before{content:'\f002';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:12px;top:50%;
                    transform:translateY(-50%);color:var(--ink-3);font-size:11px}
.ros-depot{background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:8px 32px 8px 12px;
           font-size:12.5px;color:var(--ink);font-family:'Gilroy',var(--font);font-weight:600;height:36px;min-width:220px;
           appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;cursor:pointer}
.ros-showing{font-size:12px;color:var(--ink-3);margin-left:4px}
.ros-showing strong{color:var(--ink-2);font-weight:700}
.ros-add-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:36px;
             background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:12.5px;font-weight:700;
             cursor:pointer;font-family:'Gilroy',var(--font)}
.ros-add-btn:hover{background:var(--primary-hover)}

/* Weekly/Daily segmented + Highlight Conflicts row */
.ros-toolbar-3{padding:14px 24px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ros-seg{display:inline-flex;background:#F2F4F7;border-radius:var(--radius);padding:3px;height:32px}
.ros-seg button{padding:0 14px;height:26px;border:none;background:transparent;border-radius:var(--radius-sm);
                font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:'Gilroy',var(--font);transition:all .12s}
.ros-seg button.active{background:var(--primary);color:#fff}
.ros-wknav{display:inline-flex;align-items:center;gap:2px}
.ros-wknav .wk-btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:#fff;
                   color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.ros-wknav .wk-btn:hover{color:var(--primary);border-color:var(--primary)}
.ros-wknav .wk-lbl{font-size:12.5px;font-weight:700;color:var(--ink);padding:0 10px;white-space:nowrap;font-family:'Gilroy',var(--font)}
.ros-conflict-toggle-group{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ros-hlight{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:600;cursor:pointer;font-family:'Gilroy',var(--font)}
.ros-hlight input{appearance:none;width:32px;height:18px;background:var(--line-strong);border-radius:9px;position:relative;cursor:pointer;transition:background .15s;flex:none}
.ros-hlight input:checked{background:var(--primary)}
.ros-hlight input::before{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ros-hlight input:checked::before{transform:translateX(14px)}
.ros-hlight-stat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);font-weight:600;font-family:'Gilroy',var(--font)}
.ros-hlight-stat .dot{width:8px;height:8px;border-radius:50%}
.ros-hlight-stat.miss .dot{background:var(--amber-500)}
.ros-hlight-stat.conf .dot{background:var(--red-500)}
.ros-hlight-stat strong{color:var(--ink-2);font-weight:700}

/* Skill matrix grid */
.smx{display:grid;gap:2px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.smx > div{background:var(--surface);padding:8px 10px;font-size:11.5px;text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center}
.smx .head{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
.smx .name{background:var(--surface-2);text-align:left;font-weight:600;font-size:12px}
.smx .cell.on{background:var(--green-100);color:var(--green-500);font-weight:700}
.smx .cell.exp{background:var(--red-100);color:var(--red-500);font-weight:700}
.smx .cell.miss{color:var(--ink-3)}

/* Source badges */
.src{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.2px}
.src.plan{background:var(--blue-100);color:var(--blue-500)}
.src.bio{background:var(--violet-100);color:var(--violet-500)}
.src.none{background:var(--red-100);color:var(--red-500)}

/* Pool cards */
.pool-emp{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);margin-bottom:6px}
.pool-emp .av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.pool-emp .info{flex:1}
.pool-emp .info .n{font-weight:600;font-size:12.5px}
.pool-emp .info .m{font-size:10.5px;color:var(--ink-3)}

/* Alert bucket */
.bucket{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.bucket:hover{border-color:var(--primary);transform:translateX(2px)}
.bucket .icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.bucket .icon.d90{background:var(--blue-100);color:var(--blue-500)}
.bucket .icon.d60{background:var(--violet-100);color:var(--violet-500)}
.bucket .icon.d30{background:var(--amber-100);color:var(--amber-500)}
.bucket .icon.d7{background:var(--red-100);color:var(--red-500)}
.bucket .icon.exp{background:#1F2937;color:#fff}
.bucket .txt{flex:1}
.bucket .txt .h{font-weight:600;font-size:13px}
.bucket .txt .s{font-size:11.5px;color:var(--ink-3)}
.bucket .cnt{font-size:22px;font-weight:700}

/* Blocked employee state */
.blocked-row{opacity:.55;position:relative;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(220,38,38,.05) 6px,rgba(220,38,38,.05) 12px)}
.blocked-row td:first-child::before{content:'\f023';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--red-500);margin-right:6px}

/* Section legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.legend .item{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:14px;border-radius:3px}

.review-badge{position:fixed;bottom:20px;left:138px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:12px;box-shadow:var(--shadow-2);display:flex;gap:10px;align-items:center;z-index:50}
.review-badge .dot{width:8px;height:8px;background:var(--primary);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab:hover{color:var(--primary)}

/* Two-column split */
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty i{font-size:32px;margin-bottom:12px;color:var(--ink-3)}

/* ============================================================================
   EMPLOYEE MASTER — matches Figma 6493:31482 (List) and 6493:32075 (Overview)
   ============================================================================ */
.emp-screen{margin:-24px -28px -60px;min-height:100vh;background:#F7F8FA;font-family:'Gilroy',var(--font);display:flex;flex-direction:column}
.emp-header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:24px}
.emp-header h1{font-size:18px;font-weight:700;color:#000;margin:0;font-family:'Gilroy',var(--font)}
.emp-tab-strip{display:flex;align-items:center;gap:2px}
.emp-tab-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:4px;background:#F2F4F7;border:none;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Gilroy',var(--font)}
.emp-tab-pill.active{background:#E7F9F1;color:var(--primary)}
.emp-tab-pill i{font-size:12px}
.emp-tab-pill-add{width:28px;height:28px;border-radius:4px;background:transparent;border:1px dashed var(--line-strong);color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.emp-tab-pill-add:hover{border-color:var(--primary);color:var(--primary)}

.emp-toolbar{padding:18px 24px 14px;display:flex;align-items:center;gap:10px}
.emp-search{flex:0 0 320px;height:36px;background:#fff;border:1px solid var(--line-strong);border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 12px}
.emp-search i{color:var(--ink-3);font-size:12px}
.emp-search input{border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);flex:1;font-family:'Gilroy',var(--font);padding:0}
.emp-search input::placeholder{color:var(--ink-3)}
.emp-filter-btn{width:36px;height:36px;border-radius:6px;background:#fff;border:1px solid var(--line-strong);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.emp-filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.emp-toolbar-spacer{flex:1}
.emp-add-btn{display:inline-flex;align-items:center;gap:8px;padding:0 16px;height:36px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Gilroy',var(--font);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.emp-add-btn:hover{background:var(--primary-hover)}
.emp-add-btn i{font-size:12px}

.emp-table-wrap{flex:1;margin:0 24px 24px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.emp-table{width:100%;border-collapse:collapse;font-family:'Gilroy',var(--font);min-width:1600px}
.emp-table th{text-align:left;padding:12px 14px;font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:#fff;border-bottom:1px solid var(--line);white-space:nowrap}
.emp-table th.th-new{position:relative;color:var(--primary)}
.emp-table th.th-new::after{content:"NEW";position:absolute;top:8px;right:8px;background:var(--primary);color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.04em}
.emp-table td{padding:14px;font-size:12.5px;color:var(--ink);border-bottom:1px solid var(--line);white-space:nowrap;line-height:1.3;font-weight:500;background:#fff}
.emp-row{cursor:pointer;transition:background .1s}
.emp-row:hover td{background:#F9FAFB}
.emp-row:last-child td{border-bottom:none}

.emp-cell-name{display:flex;align-items:center;gap:10px;min-width:170px}
.emp-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.emp-name-text{font-weight:500;color:#000}
.emp-email{color:var(--ink-2)}
.emp-addr{color:var(--ink-2)}
.emp-new-cell{position:relative;font-weight:600;color:#000}
.emp-new-badge{display:inline-block;margin-left:6px;background:var(--primary);color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;line-height:12px}
.emp-tags-cell{display:flex;align-items:center;gap:6px}
.emp-tag{background:#FEF3E6;color:#F79009;padding:3px 8px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.02em;font-family:'Gilroy',var(--font);text-transform:uppercase}
.emp-tag-more{background:var(--primary-lightest);color:var(--primary);padding:3px 8px;border-radius:4px;font-size:10.5px;font-weight:600;font-family:'Gilroy',var(--font);border:1px solid rgba(34,200,130,.25)}

/* Employee profile sheet */
.emp-sheet-scrim{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;font-family:'Gilroy',var(--font)}
.emp-sheet-scrim.open{opacity:1;pointer-events:auto}
.emp-sheet{position:fixed;top:0;right:0;bottom:0;width:1120px;max-width:96vw;background:#F7F8FA;z-index:101;transform:translateX(100%);transition:transform .28s ease-out;display:flex;flex-direction:column;font-family:'Gilroy',var(--font);box-shadow:-8px 0 32px rgba(16,24,40,.15)}
.emp-sheet.open{transform:none}
.emp-sheet-topbar{background:#EDEEF0;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.emp-sheet-close{position:absolute;top:10px;right:20px;background:#fff;border:1px solid var(--line-strong);color:var(--ink-2);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.emp-sheet-close:hover{color:#F04438;border-color:#F04438}
.emp-sheet-crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.emp-sheet-crumb .crumb-mut{color:var(--ink-3);font-weight:500}
.emp-sheet-crumb i{font-size:9px;color:var(--ink-3)}
.crumb-name{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.crumb-dot{width:14px;height:14px;border-radius:50%;display:inline-block}

.emp-sheet-body{flex:1;display:grid;grid-template-columns:280px 1fr;gap:0;overflow:hidden;background:#fff}
.emp-profile-col{background:#fff;border-right:1px solid var(--line);padding:20px 20px 24px;overflow-y:auto}
.emp-profile-photo{position:relative;width:100%;height:200px;background:#F2F4F7;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;overflow:hidden}
.status-chip{position:absolute;top:10px;left:10px;background:var(--primary);color:#fff;padding:3px 8px;border-radius:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;z-index:2}
.rank-chip{position:absolute;top:10px;right:10px;background:#000;color:#fff;padding:3px 8px;border-radius:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;z-index:2}
.photo-placeholder{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px}
.emp-profile-name{font-size:20px;font-weight:700;color:#000;margin:0 0 2px}
.emp-profile-id{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.emp-profile-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.emp-profile-tag{background:var(--primary-lightest);color:var(--primary);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-family:'Gilroy',var(--font)}
.emp-profile-tag-add{width:24px;height:24px;border-radius:4px;background:transparent;border:1px dashed var(--line-strong);color:var(--ink-3);cursor:pointer;font-size:12px}
.emp-profile-tag-add:hover{border-color:var(--primary);color:var(--primary)}
.emp-profile-detail-heading{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.emp-profile-dl{display:flex;flex-direction:column;gap:0;font-family:'Gilroy',var(--font)}
.emp-profile-dl .row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.emp-profile-dl .row:last-child{border-bottom:none}
.emp-profile-dl dt{color:var(--ink-3);font-weight:500}
.emp-profile-dl dd{color:#000;font-weight:600;margin:0;text-align:right}
.emp-profile-dl .new-row{background:rgba(34,200,130,.05)}
.emp-profile-dl .new-row dt{color:var(--primary)}
.mini-new{display:inline-block;background:var(--primary);color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:6px;letter-spacing:.04em;vertical-align:middle}

.emp-detail-col{overflow-y:auto;background:#fff;display:flex;flex-direction:column}
.emp-sheet-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);padding:0 24px;background:#fff;position:sticky;top:0;z-index:5}
.emp-sheet-tab{padding:14px 4px;font-size:14px;font-weight:600;color:var(--ink-3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Gilroy',var(--font);margin-bottom:-1px}
.emp-sheet-tab:hover{color:var(--primary)}
.emp-sheet-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.emp-sheet-content{padding:20px 24px 32px;flex:1;background:#F7F8FA}

.emp-alert-bar{background:#EAF4FD;border:1px solid #D6EBFC;color:var(--ink);border-radius:6px;padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.emp-alert-bar i{color:#0BA5EC}
.emp-alert-bar .alert-meta{margin-left:auto;color:var(--ink-3);font-size:11.5px}

.emp-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px;font-family:'Gilroy',var(--font)}
.emp-card-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#000;margin-bottom:14px}
.emp-card-head i{font-size:14px}
.emp-card-title{font-size:14px;font-weight:700;color:#000;margin:0 0 14px;font-family:'Gilroy',var(--font)}
.chart-legend{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--ink-2);font-weight:500}
.chart-legend .lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.chart-legend .lg.planned{background:#F79009}
.chart-legend .lg.actual{background:#0BA5EC}
.mini-chart{position:relative}
.mini-chart svg{width:100%;height:120px;display:block}
.chart-x{display:flex;justify-content:space-between;font-size:8.5px;color:var(--ink-3);margin-top:6px;padding:0 4px;font-family:'Gilroy',var(--font);letter-spacing:.5px}

.emp-two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:180px;height:180px}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:8px;font-size:12px}
.donut-legend div{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.donut-legend b{margin-left:auto;color:#000}
.d-dot{width:10px;height:10px;border-radius:2px}
.donut-delta{font-size:11px;color:var(--primary);margin-top:12px}
.donut-delta i{margin-right:4px}

.event-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-family:'Gilroy',var(--font)}
.event-list li{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:6px}
.ev-icon{width:32px;height:32px;border-radius:6px;background:#F2F4F7;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:none}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:13px;font-weight:600;color:#000}
.ev-meta{font-size:11px;color:var(--ink-3)}
.ev-time{font-size:11px;color:var(--ink-2);text-align:right;line-height:1.35}

/* Details tab */
.detail-dl{display:flex;flex-direction:column;gap:0;font-family:'Gilroy',var(--font)}
.detail-dl > div{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.detail-dl > div:last-child{border-bottom:none}
.detail-dl dt{color:var(--ink-3);font-weight:500}
.detail-dl dd{color:#000;font-weight:600;margin:0}
.chip-mini{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chip-mini.green{background:var(--primary-lightest);color:var(--primary)}
.src-chip{padding:3px 8px;border-radius:4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.src-chip.plan{background:#EAF4FD;color:#0BA5EC}
.src-chip.bio{background:#EBE9FE;color:#7C3AED}
.new-fields-card{border:1px solid var(--primary);background:rgba(34,200,130,.03)}

.tab-placeholder{text-align:center;padding:60px 20px;color:var(--ink-3);font-family:'Gilroy',var(--font)}
.tab-placeholder i{font-size:32px;margin-bottom:12px;color:var(--ink-3)}
.tab-placeholder h3{font-size:16px;color:#000;margin:8px 0}

/* Training tab */
.tr-tab{font-family:'Gilroy',var(--font);color:var(--ink)}
.tr-tab-head{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tr-tab-title{font-size:15px;font-weight:700;color:#000;margin:0 0 2px}
.tr-tab-sub{font-size:11px;color:var(--ink-3);margin:0}
.tr-section-lbl{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.tr-section-lbl .tr-count{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F2F4F7;color:var(--ink-2);text-transform:none;letter-spacing:0}
.tr-section-lbl .tr-count.crit{background:#FCEBEB;color:#A32D2D}

.tr-meter{background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.tr-meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.tr-meter-h{font-size:13.5px;font-weight:600;color:#000}
.tr-meter-stats{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tr-meter-stats b{color:#000;font-size:14px;font-weight:700}
.tr-meter-track{height:8px;background:#EAECF0;border-radius:4px;overflow:hidden;display:flex}
.tr-meter-fill{height:100%}
.tr-meter-fill.ok{background:#22C882}
.tr-meter-fill.warn{background:#EF9F27}
.tr-meter-fill.crit{background:#E24B4A}
.tr-meter-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--ink-2)}
.tr-meter-legend .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.tr-meter-legend b{color:#000;font-weight:700;margin-left:2px}

.tr-course-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:6px;background:#fff;border:1px solid var(--line);margin-bottom:6px}
.tr-course-row.missing{border:1px dashed #F09595;background:#FEF5F5}
.tr-course-row.expiring{border-left:2px solid #EF9F27}
.tr-course-icn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.tr-course-icn.done{background:#DCFAE6;color:#12B76A}
.tr-course-icn.warn{background:#FEF3E6;color:#EF9F27}
.tr-course-icn.miss{background:#FEECEC;color:#E24B4A}
.tr-course-body{flex:1;min-width:0}
.tr-course-title{font-size:13.5px;font-weight:600;color:#000;margin:0;line-height:1.3}
.tr-course-meta{font-size:11px;color:var(--ink-2);margin-top:2px}
.tr-code{font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--ink-3);letter-spacing:.02em;font-weight:600}
.tr-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;flex:none}
.tr-pill.ok{background:#DCFAE6;color:#0F6E56}
.tr-pill.warn{background:#FEF3E6;color:#854F0B}
.tr-pill.miss{background:#FEECEC;color:#A32D2D}
.tr-pill.opt{background:#F2F4F7;color:var(--ink-2);border:1px solid var(--line)}
.tr-mark-btn{font-size:11.5px;padding:5px 10px;border-radius:4px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);cursor:pointer;font-family:'Gilroy',var(--font);font-weight:600;display:inline-flex;align-items:center;gap:4px;flex:none}
.tr-mark-btn:hover{background:#DCFAE6;border-color:#12B76A;color:#0F6E56}
.tr-mark-btn i{font-size:10px}

.tr-skill-cat{margin-bottom:12px}
.tr-skill-cat-hd{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.tr-skill-row{display:flex;flex-wrap:wrap;gap:6px}
.tr-skill-badge{font-size:11.5px;padding:5px 12px;border-radius:14px;background:#fff;color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-family:'Gilroy',var(--font)}
.tr-skill-badge.strong{background:#DCFAE6;color:#0F6E56;border-color:transparent}
.tr-skill-badge.dim{color:var(--ink-3);background:transparent;border-style:dashed;font-weight:500}
.tr-skill-badge i{font-size:11px}
.tr-skill-note{font-size:11px;color:var(--ink-3);margin-top:8px;font-style:italic;line-height:1.5}

.tr-tab-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.tr-score-block{display:flex;flex-direction:column;align-items:flex-end;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#F9FAFB;flex:none}
.tr-score-block.ok{background:#DCFAE6;border-color:#84E1BC}
.tr-score-block.warn{background:#FEF3E6;border-color:#FCC773}
.tr-score-block.crit{background:#FEECEC;border-color:#F7A6A6}
.tr-score-lbl{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.tr-score-val{font-size:26px;font-weight:800;color:#000;line-height:1.1;margin-top:2px}
.tr-score-block.ok   .tr-score-val{color:#0F6E56}
.tr-score-block.warn .tr-score-val{color:#854F0B}
.tr-score-block.crit .tr-score-val{color:#A32D2D}
.tr-score-unit{font-size:12px;font-weight:600;color:var(--ink-3);margin-left:2px}

.tr-dispatch-alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:#FEECEC;border:1px solid #F09595;border-radius:8px;color:#4A1B0C;font-size:12.5px;line-height:1.5;margin:14px 0 0;font-family:'Gilroy',var(--font)}
.tr-dispatch-alert i{color:#A32D2D;font-size:14px;margin-top:2px;flex:none}
.tr-dispatch-alert strong{color:#A32D2D;font-weight:700}
.tr-dispatch-alert em{font-style:normal;color:var(--ink-3);font-size:11.5px}

/* Fleet-Availability-style compliance widget */
.tr-avail-widget{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;font-family:'Gilroy',var(--font)}
.tr-avail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
.tr-avail-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.tr-avail-icon{width:36px;height:36px;border-radius:50%;background:var(--primary-lightest);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.tr-avail-title{font-size:16px;font-weight:700;color:#000;line-height:1.2}
.tr-avail-sub{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.tr-avail-filter select{background:#fff;border:1px solid var(--line-strong);border-radius:6px;padding:7px 32px 7px 12px;font-size:12.5px;color:var(--ink-2);font-family:'Gilroy',var(--font);font-weight:600;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;cursor:pointer;flex:none}
.tr-avail-kpis{display:flex;padding:16px 0 14px}
.tr-avail-kpi{flex:1;text-align:center;padding:0 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
.tr-avail-kpi:last-child{border-right:none}
.tr-avail-lbl{font-size:12px;color:var(--ink-2);font-weight:500;font-family:'Gilroy',var(--font)}
.tr-avail-val{font-size:26px;font-weight:700;font-family:'Gilroy',var(--font);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.5px}
.tr-avail-val.neutral{color:#000}
.tr-avail-val.valid{color:#22C882}
.tr-avail-val.expiring{color:#EF9F27}
.tr-avail-val.expired{color:#F04438}
.tr-avail-val.missing{color:#98A2B3}
.tr-avail-bar{display:flex;height:6px;margin:2px 18px 18px;border-radius:3px;overflow:hidden;background:#F2F4F7}
.tr-avail-seg{height:100%;transition:width .2s}
.tr-avail-seg.valid{background:#22C882}
.tr-avail-seg.expiring{background:#EF9F27}
.tr-avail-seg.expired{background:#F04438}
.tr-avail-seg.missing{background:#98A2B3}

.tr-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.tr-kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:#F9FAFB}
.tr-kpi.dim{background:#F9FAFB;border-color:var(--line)}
.tr-kpi.ok{background:#DCFAE6;border-color:#84E1BC}
.tr-kpi.warn{background:#FEF3E6;border-color:#FCC773}
.tr-kpi.crit{background:#FEECEC;border-color:#F7A6A6}
.tr-kpi-head{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-family:'Gilroy',var(--font)}
.tr-kpi-head i{font-size:11px;color:var(--ink-2)}
.tr-kpi.ok   .tr-kpi-head, .tr-kpi.ok   .tr-kpi-head i{color:#0F6E56}
.tr-kpi.warn .tr-kpi-head, .tr-kpi.warn .tr-kpi-head i{color:#854F0B}
.tr-kpi.crit .tr-kpi-head, .tr-kpi.crit .tr-kpi-head i{color:#A32D2D}
.tr-kpi-val{font-size:26px;font-weight:800;color:#000;line-height:1.1;font-family:'Gilroy',var(--font);font-variant-numeric:tabular-nums}
.tr-kpi.ok   .tr-kpi-val{color:#0F6E56}
.tr-kpi.warn .tr-kpi-val{color:#854F0B}
.tr-kpi.crit .tr-kpi-val{color:#A32D2D}
.tr-kpi-sub{font-size:11px;color:var(--ink-3);font-weight:500;line-height:1.3;margin-top:1px;font-family:'Gilroy',var(--font)}
.tr-kpi.ok   .tr-kpi-sub{color:#0F6E56;opacity:.75}
.tr-kpi.warn .tr-kpi-sub{color:#854F0B;opacity:.8}
.tr-kpi.crit .tr-kpi-sub{color:#A32D2D;opacity:.8}

.tr-tbt-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:6px}
.tr-tbt-date{width:100px;flex:none;font-size:11.5px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.tr-tbt-subject{flex:1;font-size:13px;color:#000;font-weight:500}
.tr-empty{padding:14px;background:#F9FAFB;border:1px dashed var(--line-strong);border-radius:6px;font-size:12px;color:var(--ink-3);text-align:center;font-family:'Gilroy',var(--font)}

/* ============================================================================
   ROSTER & JOB ASSIGNMENT — production-grade shell (FR-ROS §7.4)
   ============================================================================ */
.ros-screen{margin:-24px -28px -60px;min-height:100vh;background:#F7F8FA;font-family:'Gilroy',var(--font);display:flex;flex-direction:column}
.ros-header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.ros-header h1{font-size:18px;font-weight:700;color:var(--ds-fg);margin:0;font-family:'Gilroy',var(--font)}
.ros-hd-sub{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.ros-tab-strip{display:flex;align-items:center;gap:6px}
.ros-tab-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:4px;background:#F2F4F7;border:none;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Gilroy',var(--font)}
.ros-tab-pill.active{background:var(--primary-lightest);color:var(--primary)}
.ros-tab-pill i{font-size:11px}
.ros-tab-count{background:#F04438;color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;line-height:1.4;letter-spacing:.03em}

.ros-toolbar{padding:14px 24px;display:flex;align-items:center;gap:10px}
.ros-week-nav-group{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line-strong);border-radius:6px;padding:2px}
.ros-icon-btn{width:28px;height:28px;border-radius:4px;background:transparent;border:none;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.ros-icon-btn:hover{background:var(--primary-lightest);color:var(--primary)}
.ros-week-lbl{display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--ds-fg);white-space:nowrap;height:28px}
.ros-week-lbl i{color:var(--primary);font-size:11px}
.ros-filter-group{display:flex;gap:8px}
.ros-select{background:#fff;border:1px solid var(--line-strong);border-radius:6px;padding:8px 32px 8px 12px;font-size:12.5px;color:var(--ink);font-family:'Gilroy',var(--font);font-weight:600;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;cursor:pointer;height:34px}
.ros-toolbar-spacer{flex:1}
.ros-secondary-btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;background:#fff;border:1px solid var(--line-strong);border-radius:6px;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Gilroy',var(--font)}
.ros-secondary-btn:hover{border-color:var(--primary);color:var(--primary)}
.ros-primary-btn{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:34px;background:var(--primary);border:none;border-radius:6px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);font-family:'Gilroy',var(--font)}
.ros-primary-btn:hover{background:var(--primary-hover)}

.ros-alert{margin:0 24px 16px;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:#FEECEC;border:1px solid #F09595;border-radius:8px;color:#4A1B0C;font-size:12.5px;line-height:1.5}
.ros-alert i{color:#A32D2D;font-size:14px;margin-top:2px;flex:none}
.ros-alert strong{color:#A32D2D;font-weight:700}
.ros-alert em{font-style:normal;color:var(--ink-3);font-size:11.5px}

.ros-board-card{margin:0 24px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ros-board-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:16px}
.ros-board-title{font-size:15px;font-weight:700;color:var(--ds-fg);font-family:'Gilroy',var(--font)}
.ros-board-sub{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px;line-height:1.5}
.ros-board-sub em{font-style:normal;color:var(--ink-3);font-size:10.5px}
.ros-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink-2);align-items:center;max-width:520px;justify-content:flex-end}
.ros-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:500}
.ros-sw{width:14px;height:12px;border-radius:2px;display:inline-block}
.ros-board-body{padding:14px 20px 20px}

.ros-pools-grid,.ros-demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 24px 16px}
.ros-pool-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-family:'Gilroy',var(--font)}
.ros-pool-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ros-pool-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ros-pool-icon.standby{background:#FEF3E6;color:#EF9F27}
.ros-pool-icon.reliever{background:#DCFAE6;color:#22C882}
.ros-pool-title{font-size:14px;font-weight:700;color:#000;display:flex;align-items:center;gap:8px}
.ros-pool-cnt{font-size:10.5px;font-weight:600;color:var(--ink-3);background:#F2F4F7;padding:2px 8px;border-radius:10px;text-transform:none;letter-spacing:0}
.ros-pool-sub{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px;line-height:1.5}
.ros-pool-body{display:flex;flex-direction:column;gap:6px}
.ros-pool-emp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#F9FAFB}
.ros-pool-av{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;letter-spacing:.02em}
.ros-pool-info{flex:1;min-width:0}
.ros-pool-info .n{font-size:13px;font-weight:600;color:#000}
.ros-pool-info .m{font-size:11px;color:var(--ink-3);margin-top:2px}
.ros-pool-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;flex:none}
.ros-pool-pill.amber{background:#FEF3E6;color:#854F0B;border:1px dashed #EF9F27}
.ros-pool-pill.green{background:#DCFAE6;color:#0F6E56;border:2px solid #22C882}
.ros-pool-pill.red{background:#FEECEC;color:#A32D2D}
.ros-pool-pill.gray{background:#F2F4F7;color:var(--ink-2);border:1px solid var(--line-strong)}

.ros-demo-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-family:'Gilroy',var(--font)}
.ros-demo-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ros-demo-hd h4{font-size:14px;font-weight:700;color:#000;margin:0;flex:1}
.ros-demo-hd i{font-size:14px}
.ros-demo-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#FEECEC;color:#A32D2D;text-transform:uppercase;letter-spacing:.04em}
.ros-demo-card p{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.5}
.ros-demo-note{margin-top:12px;padding:10px 12px;background:#FEF3E6;border-radius:6px;font-size:11.5px;color:#854F0B;display:flex;gap:8px;align-items:flex-start}
.ros-demo-note i{color:#EF9F27;margin-top:2px}
.ros-picker{display:flex;flex-direction:column;gap:6px}
.ros-pick-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#F9FAFB}
.ros-pick-row.muted{opacity:.65}

/* ============================================================================
   CONFLICTS SCREEN — ROS-03 rule-violation detail view (Week 33 conflicts)
   ============================================================================ */
.ros-c-block-banner{margin:0 24px 16px;padding:18px 22px;background:linear-gradient(90deg,#FEE4E2 0%,#FEF3F2 100%);
                    border:1px solid #FDA29B;border-radius:var(--radius-lg);display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-1)}
.ros-c-block-icon{width:48px;height:48px;background:var(--red-500);color:#fff;border-radius:var(--radius-full);
                  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;box-shadow:0 2px 6px rgba(240,68,56,.35)}
.ros-c-block-body{flex:1;min-width:0}
.ros-c-block-title{font-size:15px;font-weight:700;color:#7A271A;line-height:1.35}
.ros-c-block-sub{font-size:12.5px;color:#912018;margin-top:4px;line-height:1.55}
.ros-c-block-sub em{font-style:normal;color:#B42318;font-weight:600;background:rgba(255,255,255,.5);padding:1px 6px;border-radius:4px;font-size:11px;margin-left:4px}
.ros-c-block-actions{display:flex;gap:8px;flex:none}

.ros-c-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 24px 16px}
.ros-c-stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-1)}
.ros-c-stat .lbl{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ros-c-stat .val{font-size:26px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1;font-family:'Gilroy',var(--font)}
.ros-c-stat .val.red{color:var(--red-500)}
.ros-c-stat .val.amber{color:var(--amber-500)}
.ros-c-stat .val.green{color:var(--green-500)}
.ros-c-stat .sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.4}

.ros-c-list{display:flex;flex-direction:column;gap:12px;margin:0 24px 24px}
.ros-c-list-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.ros-c-list-hd h3{font-size:14px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font)}
.ros-c-list-hd .filter-group{display:flex;gap:6px}
.ros-c-list-hd .filter-pill{padding:5px 11px;font-size:11.5px;font-weight:600;background:#F2F4F7;color:var(--ink-2);border-radius:var(--radius-full);cursor:pointer;border:none;font-family:'Gilroy',var(--font)}
.ros-c-list-hd .filter-pill.active{background:var(--ink);color:#fff}

.ros-c-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line-strong);
            border-radius:var(--radius-lg);padding:18px 20px;display:grid;grid-template-columns:200px minmax(0,1fr) 180px;
            gap:20px;align-items:stretch;box-shadow:var(--shadow-1);transition:box-shadow .15s}
@media (max-width:1200px){
  .ros-c-card{grid-template-columns:1fr;gap:16px}
  .ros-c-emp{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:12px}
  .ros-c-actions{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:12px;flex-direction:row;flex-wrap:wrap}
  .ros-c-actions .ros-c-act{flex:1;min-width:180px}
}
.ros-c-card:hover{box-shadow:var(--shadow-2)}
.ros-c-card.doc{border-left-color:var(--red-500)}
.ros-c-card.hours{border-left-color:var(--amber-500)}
.ros-c-card.double{border-left-color:#F79009}

.ros-c-emp{display:flex;gap:12px;align-items:flex-start;border-right:1px solid var(--line);padding-right:20px}
.ros-c-av{width:44px;height:44px;border-radius:var(--radius-full);color:#fff;font-weight:700;
          display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;font-family:'Gilroy',var(--font)}
.ros-c-emp-info{flex:1;min-width:0}
.ros-c-name{font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.3}
.ros-c-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.ros-c-meta .k{color:var(--ink-2);font-weight:600}

.ros-c-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.ros-c-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ros-c-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:var(--radius-full);
             font-size:11px;font-weight:700;letter-spacing:.02em;font-family:'Gilroy',var(--font)}
.ros-c-badge.doc{background:var(--red-100);color:var(--red-500)}
.ros-c-badge.hours{background:var(--amber-100);color:#B54708}
.ros-c-badge.double{background:#FEF0C7;color:#B54708}
.ros-c-badge.rule{background:#F2F4F7;color:var(--ink-2)}
.ros-c-badge.day{background:var(--blue-100);color:var(--blue-500)}
.ros-c-desc{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.ros-c-desc strong{color:var(--ink);font-weight:600}
.ros-c-week-strip{display:flex;gap:4px;margin-top:2px}
.ros-c-week-cell{flex:1;padding:8px 4px 6px;text-align:center;font-size:9.5px;font-weight:700;border-radius:var(--radius-md);
                 background:#F2F4F7;color:var(--ink-3);letter-spacing:.02em;line-height:1.2;position:relative;font-family:'Gilroy',var(--font)}
.ros-c-week-cell .n{display:block;font-size:11px;font-weight:700;margin-top:2px;color:var(--ink-2)}
.ros-c-week-cell.assigned{background:var(--blue-50);color:var(--blue-500)}
.ros-c-week-cell.assigned .n{color:var(--blue-500)}
.ros-c-week-cell.violate{background:var(--red-100);color:var(--red-500);box-shadow:inset 0 0 0 1px rgba(240,68,56,.35)}
.ros-c-week-cell.violate .n{color:var(--red-500)}
.ros-c-week-cell.warn{background:var(--amber-100);color:#B54708;box-shadow:inset 0 0 0 1px rgba(247,144,9,.35)}
.ros-c-week-cell.warn .n{color:#B54708}
.ros-c-week-cell.off{background:#F2F4F7;color:var(--ink-3)}

.ros-c-actions{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:20px;justify-content:center}
.ros-c-act{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line-strong);
           border-radius:var(--radius-md);background:#fff;color:var(--ink);font-size:12px;font-weight:600;
           cursor:pointer;font-family:'Gilroy',var(--font);text-align:left;justify-content:flex-start;transition:all .12s}
.ros-c-act i{width:14px;color:var(--primary);font-size:11px}
.ros-c-act:hover{border-color:var(--primary);background:var(--primary-lightest)}
.ros-c-act.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.ros-c-act.primary i{color:#fff}
.ros-c-act.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.ros-c-act.danger{border-color:#F09595;color:#912018;background:var(--red-100)}
.ros-c-act.danger i{color:#912018}
.ros-c-act.danger:hover{background:#FEE4E2;border-color:var(--red-500)}
.ros-c-act .locked{color:var(--ink-3);font-size:10.5px;font-weight:500;font-style:italic}

.ros-c-empty{background:#fff;border:1px dashed var(--line-strong);border-radius:var(--radius-lg);
             padding:48px 24px;text-align:center;margin:0 24px 24px;color:var(--ink-3)}
.ros-c-empty i{font-size:32px;color:var(--green-500);margin-bottom:12px;display:block}
.ros-c-empty h3{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px;font-family:'Gilroy',var(--font)}
.ros-c-empty p{font-size:12.5px}

/* ============================================================================
   LEAVE MANAGEMENT — FR-LVE §7.5 · LVE-01..LVE-04 (LVE-05/06 deferred)
   Three views inside one route:
     · register  — pending/endorsed/approved/rejected queue with workflow trail
     · planner   — monthly calendar with public holidays + approved absences
     · new       — request form (self / on-behalf) with roster-impact warning
   ============================================================================ */
.lve-screen{margin:-24px -28px -60px;min-height:100vh;background:#F7F8FA;font-family:'Gilroy',var(--font);display:flex;flex-direction:column}
.lve-header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.lve-header h1{font-size:18px;font-weight:700;color:#000;margin:0;font-family:'Gilroy',var(--font)}
.lve-header .sub{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.lve-tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);padding:0 24px;background:#fff}
.lve-tabs .tab{padding:14px 4px 12px;margin-right:28px;font-size:13px;font-weight:600;color:var(--ink-3);
               background:transparent;border:none;cursor:pointer;position:relative;font-family:'Gilroy',var(--font);transition:color .15s}
.lve-tabs .tab:hover{color:var(--ink-2)}
.lve-tabs .tab.active{color:var(--primary)}
.lve-tabs .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px 2px 0 0}
.lve-tabs .tab .cnt{display:inline-flex;align-items:center;justify-content:center;background:var(--amber-500);color:#fff;
                    font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:6px}

/* KPI strip */
.lve-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 24px}
.lve-kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-1)}
.lve-kpi .lbl{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.lve-kpi .val{font-size:24px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1;font-family:'Gilroy',var(--font)}
.lve-kpi .val.amber{color:var(--amber-500)}
.lve-kpi .val.green{color:var(--green-500)}
.lve-kpi .val.red{color:var(--red-500)}
.lve-kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.4}

/* Register table */
.lve-panel{margin:0 24px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.lve-panel-hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lve-panel-hd h3{font-size:14px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font)}
.lve-panel-hd .sub{font-size:11.5px;color:var(--ink-3);font-weight:500}
.lve-panel-hd .spacer{flex:1}
.lve-status-pills{display:flex;gap:6px}
.lve-status-pills button{padding:5px 11px;font-size:11.5px;font-weight:600;background:#F2F4F7;color:var(--ink-2);
                         border-radius:var(--radius-full);cursor:pointer;border:none;font-family:'Gilroy',var(--font)}
.lve-status-pills button.active{background:var(--ink);color:#fff}
.lve-panel table{width:100%;border-collapse:separate;border-spacing:0}
.lve-panel th{background:#FAFBFC;padding:11px 16px;text-align:left;font-size:10.5px;font-weight:700;
              color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.lve-panel td{padding:14px 16px;font-size:12.5px;color:var(--ink);border-bottom:1px solid var(--line);vertical-align:middle}
.lve-panel tbody tr:hover td{background:#FAFBFC;cursor:pointer}
.lve-panel tbody tr:last-child td{border-bottom:none}
.lve-emp-cell{display:flex;align-items:center;gap:10px}
.lve-emp-cell .av{width:32px;height:32px;border-radius:var(--radius-full);color:#fff;font-weight:700;
                  display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;font-family:'Gilroy',var(--font)}
.lve-emp-cell .nm{font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.35}
.lve-emp-cell .id{font-size:10.5px;color:var(--ink-3);margin-top:1px}

/* Leave type + status chips */
.lve-type{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);
          font-size:10.5px;font-weight:700;letter-spacing:.02em}
.lve-type.annual{background:var(--blue-100);color:var(--blue-500)}
.lve-type.sick{background:var(--red-100);color:var(--red-500)}
.lve-type.casual{background:var(--amber-100);color:#B54708}
.lve-type.unpaid{background:#F2F4F7;color:var(--ink-2)}
.lve-type.maternity{background:#FCE7F3;color:#BE185D}
.lve-type.compassionate{background:#EDE9FE;color:#7C3AED}
.lve-type.hajj{background:#DCFCE7;color:#166534}
.lve-stat{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-full);
          font-size:11px;font-weight:700}
.lve-stat.pending{background:var(--amber-100);color:#B54708}
.lve-stat.endorsed{background:var(--blue-100);color:var(--blue-500)}
.lve-stat.approved{background:var(--green-100);color:var(--green-500)}
.lve-stat.rejected{background:var(--red-100);color:var(--red-500)}
.lve-stat.draft{background:#F2F4F7;color:var(--ink-2)}

/* SLA countdown */
.lve-sla{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:var(--radius-md);
         font-size:10.5px;font-weight:700;font-family:'Gilroy',var(--font)}
.lve-sla.ok{background:var(--green-100);color:var(--green-500)}
.lve-sla.warn{background:var(--amber-100);color:#B54708}
.lve-sla.brk{background:var(--red-100);color:var(--red-500)}
.lve-sla i{font-size:9px}

/* Impact chips (roster gap indicator) */
.lve-impact{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;background:var(--red-100);
            color:var(--red-500);font-size:10.5px;font-weight:600;border-radius:var(--radius-md)}
.lve-impact i{font-size:9px}
.lve-impact.none{background:#F2F4F7;color:var(--ink-3)}

/* Workflow trail (modal body) */
.lve-trail{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.lve-trail-step{display:flex;gap:14px;padding:10px 0;position:relative}
.lve-trail-step:not(:last-child)::before{content:'';position:absolute;left:15px;top:36px;bottom:-6px;width:2px;background:var(--line)}
.lve-trail-step.done:not(:last-child)::before{background:var(--green-500)}
.lve-trail-step.active:not(:last-child)::before{background:var(--line-strong);background:repeating-linear-gradient(to bottom,var(--line-strong) 0,var(--line-strong) 3px,transparent 3px,transparent 6px)}
.lve-trail-dot{width:32px;height:32px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;
               background:#F2F4F7;color:var(--ink-3);font-size:12px;flex:none;font-weight:700;border:2px solid transparent}
.lve-trail-step.done .lve-trail-dot{background:var(--green-500);color:#fff}
.lve-trail-step.active .lve-trail-dot{background:#fff;color:var(--primary);border-color:var(--primary)}
.lve-trail-body{flex:1;min-width:0}
.lve-trail-role{font-size:12px;font-weight:700;color:var(--ink)}
.lve-trail-name{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.lve-trail-when{font-size:10.5px;color:var(--ink-3);margin-top:4px;font-weight:500}
.lve-trail-note{margin-top:6px;padding:8px 10px;background:var(--surface-2);border-radius:var(--radius-md);
                font-size:11.5px;color:var(--ink-2);line-height:1.5}

/* Roster-impact warning banner (on request form + register row) */
.lve-impact-banner{margin:0 0 14px;padding:12px 14px;background:#FEF3E6;border:1px solid #FDB022;
                   border-left:3px solid var(--amber-500);border-radius:var(--radius-md);
                   display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#7A2E0E;line-height:1.5}
.lve-impact-banner i{color:var(--amber-500);font-size:14px;margin-top:2px;flex:none}
.lve-impact-banner strong{color:#7A2E0E;font-weight:700}
.lve-impact-banner em{font-style:normal;color:#B54708;font-weight:600}

/* Request form */
.lve-form{display:grid;grid-template-columns:1fr 320px;gap:20px;margin:16px 24px 24px}
.lve-form-main{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-1)}
.lve-form-side{display:flex;flex-direction:column;gap:12px}
.lve-form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-1)}
.lve-form-card h4{font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;font-family:'Gilroy',var(--font)}
.lve-form h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:14px;font-family:'Gilroy',var(--font)}
.lve-form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.lve-form .row.single{grid-template-columns:1fr}
.lve-form .field{display:flex;flex-direction:column;gap:5px}
.lve-form label{font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lve-form label .req{color:var(--red-500)}
.lve-form input, .lve-form select, .lve-form textarea{width:100%;padding:9px 12px;background:#fff;border:1px solid var(--line-strong);
                                                     border-radius:var(--radius-md);font-size:13px;color:var(--ink);font-family:'Gilroy',var(--font)}
.lve-form input:focus, .lve-form select:focus, .lve-form textarea:focus{outline:2px solid var(--primary-lightest);outline-offset:-1px;border-color:var(--primary)}
.lve-form textarea{resize:vertical;min-height:70px}
.lve-form .toggle-row{display:inline-flex;background:#F2F4F7;border-radius:var(--radius);padding:3px;margin-bottom:16px}
.lve-form .toggle-row button{padding:0 14px;height:28px;border:none;background:transparent;border-radius:var(--radius-sm);
                              font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:'Gilroy',var(--font);transition:all .12s}
.lve-form .toggle-row button.active{background:var(--primary);color:#fff}
.lve-form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:6px}
.lve-drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius-md);padding:16px;text-align:center;
          color:var(--ink-3);font-size:12px;cursor:pointer;transition:all .12s}
.lve-drop:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-lightest)}
.lve-drop i{font-size:20px;display:block;margin-bottom:6px;color:var(--primary)}
.lve-drop strong{color:var(--ink-2);font-weight:600}

/* Balance readout */
.lve-bal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
.lve-bal-row:last-child{border-bottom:none}
.lve-bal-row .n{color:var(--ink-2);font-weight:600}
.lve-bal-row .v{color:var(--ink);font-weight:700;font-family:'Gilroy',var(--font)}
.lve-bal-row .v.low{color:var(--amber-500)}
.lve-bal-row .v.crit{color:var(--red-500)}
.lve-bal-row .v .of{color:var(--ink-3);font-weight:500;font-size:11px}

/* Planner calendar */
.lve-planner-toolbar{padding:14px 24px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lve-month-nav{display:inline-flex;align-items:center;gap:2px}
.lve-month-nav .btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:#fff;
                    color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.lve-month-nav .btn:hover{color:var(--primary);border-color:var(--primary)}
.lve-month-nav .lbl{font-size:13px;font-weight:700;color:var(--ink);padding:0 12px;font-family:'Gilroy',var(--font)}
.lve-cal{margin:14px 24px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.lve-cal-hd{display:grid;grid-template-columns:repeat(7,1fr);background:#FAFBFC;border-bottom:1px solid var(--line)}
