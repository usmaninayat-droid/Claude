.lve-cal-hd div{padding:10px 12px;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;text-align:left}
.lve-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:110px}
.lve-cal-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden;position:relative;background:#fff}
.lve-cal-day:nth-child(7n){border-right:none}
.lve-cal-day.out{background:#FAFBFC;color:var(--ink-3)}
.lve-cal-day.holiday{background:#FEF3E6}
.lve-cal-day.today .dnum{background:var(--primary);color:#fff;padding:2px 7px;border-radius:var(--radius-full);font-size:11px}
.lve-cal-day .dnum{font-size:12px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font)}
.lve-cal-day.out .dnum{color:var(--ink-3)}
.lve-cal-day .hol{font-size:9.5px;color:#B54708;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.2;margin-top:-2px}
.lve-cal-chip{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:var(--radius-sm);
              font-size:9.5px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-family:'Gilroy',var(--font)}
.lve-cal-chip.annual{background:var(--blue-100);color:var(--blue-500)}
.lve-cal-chip.sick{background:var(--red-100);color:var(--red-500)}
.lve-cal-chip.casual{background:var(--amber-100);color:#B54708}
.lve-cal-chip.unpaid{background:#F2F4F7;color:var(--ink-2)}
.lve-cal-chip.more{background:#EEF2F6;color:var(--ink-2);text-align:center;justify-content:center}
.lve-cal-legend{display:flex;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-2)}
.lve-cal-legend span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.lve-cal-legend .sw{width:12px;height:12px;border-radius:2px;display:inline-block}

/* View toggle (List | Kanban) */
.lve-view-toggle{display:inline-flex;background:#F2F4F7;border-radius:var(--radius);padding:3px}
.lve-view-toggle button{padding:0 12px;height:26px;border:none;background:transparent;border-radius:var(--radius-sm);
                        font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:'Gilroy',var(--font);
                        display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.lve-view-toggle button.active{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.lve-view-toggle button i{font-size:10px}

/* Kanban board — Operations Center reference (rounded columns · top accent · rich cards) */
.lve-kb-toolbar{display:flex;align-items:center;gap:10px;margin:16px 24px;background:#fff;border:1px solid var(--line);
                border-radius:var(--radius-lg);padding:10px 12px;box-shadow:var(--shadow-1);flex-wrap:wrap}
.lve-kb-toolbar .search{position:relative;flex:1;min-width:220px;max-width:380px}
.lve-kb-toolbar .search input{width:100%;height:34px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:var(--radius-md);
                              font-size:12.5px;color:var(--ink);font-family:'Gilroy',var(--font);background:#F7F8FA}
.lve-kb-toolbar .search input:focus{outline:2px solid var(--primary-lightest);outline-offset:-1px;border-color:var(--primary);background:#fff}
.lve-kb-toolbar .search::before{content:'\f002';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:12px;top:50%;
                                transform:translateY(-50%);color:var(--ink-3);font-size:11px}
.lve-kb-toolbar .icon-btn{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--line);background:#fff;
                          color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.lve-kb-toolbar .icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.lve-kb-toolbar .chip-drop{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);
                            border-radius:var(--radius-full);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-2);
                            cursor:pointer;font-family:'Gilroy',var(--font)}
.lve-kb-toolbar .chip-drop i{color:var(--ink-3);font-size:11px}
.lve-kb-toolbar .chip-drop:hover{border-color:var(--primary);color:var(--primary)}
.lve-kb-toolbar .chip-drop:hover i{color:var(--primary)}
.lve-kb-toolbar .spacer{flex:1}
.lve-kb-toolbar .export-btn{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--line);background:#fff;
                            color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px}

/* View-toggle tab strip (Kanban View × / List View +) — reference top pattern */
.lve-view-tabs{display:flex;align-items:center;gap:6px;margin:16px 24px 0;flex-wrap:wrap}
.lve-view-tabs .vt{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border:1px solid var(--line);
                   border-radius:var(--radius-md);font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;
                   font-family:'Gilroy',var(--font);box-shadow:var(--shadow-1);transition:all .12s}
.lve-view-tabs .vt:hover{color:var(--primary);border-color:var(--primary)}
.lve-view-tabs .vt.active{color:var(--ink);background:#fff}
.lve-view-tabs .vt.active .x{color:var(--ink-3);font-size:10px}
.lve-view-tabs .vt .x{color:var(--ink-3);font-size:10px}
.lve-view-tabs .vt i{color:var(--ink-3);font-size:11px}
.lve-view-tabs .vt.active i{color:var(--primary)}
.lve-view-tabs .add{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--line);background:#fff;
                    color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:14px;
                    box-shadow:var(--shadow-1)}
.lve-view-tabs .op-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--ink);color:#fff;
                         border-radius:var(--radius-md);font-size:12.5px;font-weight:700;font-family:'Gilroy',var(--font);
                         margin-right:6px;box-shadow:var(--shadow-1)}

.lve-kb{margin:0 24px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lve-kb-col{background:#FBFBFC;border:1px solid var(--line);border-radius:var(--radius-lg);padding:0;
            display:flex;flex-direction:column;min-height:500px;overflow:hidden;position:relative}
.lve-kb-col::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--line-strong)}
.lve-kb-col.pending::before,  .lve-kb-col.requested::before {background:var(--blue-500)}
.lve-kb-col.endorsed::before, .lve-kb-col.review::before   {background:var(--amber-500)}
.lve-kb-col.approved::before  {background:var(--green-500)}
.lve-kb-col.rejected::before  {background:var(--red-500)}

.lve-kb-col-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
.lve-kb-col-hd .lbl{font-size:14px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font);letter-spacing:-0.01em}
.lve-kb-col-hd .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 8px;
                    border-radius:var(--radius-full);font-size:11.5px;font-weight:800;font-family:'Gilroy',var(--font);letter-spacing:.02em}
.lve-kb-col.pending  .lve-kb-col-hd .cnt, .lve-kb-col.requested .lve-kb-col-hd .cnt {background:var(--blue-100);color:var(--blue-500)}
.lve-kb-col.endorsed .lve-kb-col-hd .cnt, .lve-kb-col.review    .lve-kb-col-hd .cnt {background:var(--amber-100);color:#B54708}
.lve-kb-col.approved .lve-kb-col-hd .cnt {background:var(--green-100);color:var(--green-500)}
.lve-kb-col.rejected .lve-kb-col-hd .cnt {background:var(--red-100);color:var(--red-500)}
.lve-kb-cards{padding:4px 12px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}

.lve-kb-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 14px 10px;
             box-shadow:0 1px 2px rgba(16,24,40,.04);cursor:pointer;
             display:flex;flex-direction:column;gap:10px;transition:box-shadow .12s,transform .12s}
.lve-kb-card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px);border-color:var(--line-strong)}
.lve-kb-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lve-kb-card .idpill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#F2F4F7;border-radius:var(--radius-sm);
                     font-size:10.5px;color:var(--ink-2);font-weight:700;font-family:'Gilroy',var(--font);letter-spacing:.02em}
.lve-kb-card .idpill i{color:var(--ink-3);font-size:9px}
.lve-kb-card .conflict-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;background:var(--red-100);
                             color:var(--red-500);font-size:10px;font-weight:800;border-radius:var(--radius-sm);
                             text-transform:uppercase;letter-spacing:.05em;font-family:'Gilroy',var(--font)}
.lve-kb-card .conflict-badge i{font-size:9px}
.lve-kb-card .title{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35;font-family:'Gilroy',var(--font);letter-spacing:-0.01em}
.lve-kb-card .rows{display:flex;flex-direction:column;gap:5px}
.lve-kb-card .rows .r{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:600;font-family:'Gilroy',var(--font)}
.lve-kb-card .rows .r i{color:var(--ink-3);font-size:11px;width:12px;text-align:center}
.lve-kb-card .foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line);margin-top:2px}
.lve-kb-card .foot .av{width:26px;height:26px;border-radius:var(--radius-full);color:#fff;font-weight:700;font-size:10px;
                       display:flex;align-items:center;justify-content:center;flex:none;font-family:'Gilroy',var(--font)}
.lve-kb-card .foot .end{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.lve-kb-card .foot .end i{color:var(--ink-3);font-size:10px}

.lve-kb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 12px;
              color:var(--ink-3);font-size:11.5px;text-align:center;line-height:1.5;flex:1}
.lve-kb-empty i{font-size:22px;color:var(--line-strong);margin-bottom:6px}

/* ============================================================================
   TOOLTIPS · global · data-tip="..." attribute drives a hover pill
   Position variants: data-tip-pos="top|bottom|left|right" (default: top)
   ============================================================================ */
[data-tip]{position:relative}
[data-tip]::before, [data-tip]::after{opacity:0;pointer-events:none;transition:opacity .12s ease-out .18s;position:absolute;z-index:200}
[data-tip]::after{
  content:attr(data-tip);
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;
  padding:6px 9px;border-radius:var(--radius-sm);white-space:nowrap;
  box-shadow:var(--shadow-2);font-family:'Gilroy',var(--font);letter-spacing:.01em;line-height:1.35;
  max-width:280px;white-space:normal;text-align:center;
}
[data-tip]::before{
  content:'';width:0;height:0;border:5px solid transparent;
}
/* default: above */
[data-tip]::after{left:50%;bottom:calc(100% + 8px);transform:translateX(-50%)}
[data-tip]::before{left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);border-top-color:var(--ink)}
[data-tip]:hover::before, [data-tip]:hover::after, [data-tip]:focus-visible::before, [data-tip]:focus-visible::after{opacity:1}

[data-tip-pos="bottom"]::after{bottom:auto;top:calc(100% + 8px)}
[data-tip-pos="bottom"]::before{bottom:auto;top:calc(100% + 3px);border-top-color:transparent;border-bottom-color:var(--ink)}
[data-tip-pos="right"]::after{left:calc(100% + 8px);bottom:50%;transform:translateY(50%)}
[data-tip-pos="right"]::before{left:calc(100% + 3px);bottom:50%;transform:translateY(50%);border-top-color:transparent;border-right-color:var(--ink)}
[data-tip-pos="left"]::after{right:calc(100% + 8px);left:auto;bottom:50%;transform:translateY(50%)}
[data-tip-pos="left"]::before{right:calc(100% + 3px);left:auto;bottom:50%;transform:translateY(50%);border-top-color:transparent;border-left-color:var(--ink)}

/* Larger content variant (multi-line explanations) */
[data-tip-size="lg"]::after{max-width:320px;padding:9px 12px;font-size:11.5px;text-align:left;line-height:1.55;font-weight:500}
[data-tip-size="lg"]::after strong{font-weight:700;color:#fff}

/* Prevent tooltip from clipping inside overflow parents on tables */
.lve-panel table{overflow:visible}
.lve-panel{overflow:visible}

/* ============================================================================
   LEAVE DETAIL PAGE — Tadweer "Issues Reported" pattern (Figma reference)
   Split view: left = metadata + sections; right = timeline + related + composer.
   Replaces the earlier modal-based trail with a full-page inspection surface.
   ============================================================================ */
.lve-detail{margin:-24px -28px -60px;min-height:100vh;background:#F7F8FA;font-family:'Gilroy',var(--font);display:flex;flex-direction:column}
.lve-detail-tabs{background:#F1F3F5;border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:flex-end;gap:6px;min-height:44px}
.lve-detail-tab{background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0;
                padding:6px 14px 8px;display:flex;align-items:center;gap:9px;min-width:180px;cursor:pointer;position:relative;top:1px}
.lve-detail-tab.inactive{background:#E9ECEF;opacity:.7}
.lve-detail-tab .close{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--red-500);color:#fff;
                       align-items:center;justify-content:center;font-size:8px;flex:none}
.lve-detail-tab.inactive .close{background:var(--green-500)}
.lve-detail-tab .meta{display:flex;flex-direction:column;line-height:1.2}
.lve-detail-tab .meta .sub{font-size:9px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lve-detail-tab .meta .id{font-size:12px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font)}

.lve-detail-body{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
.lve-detail-main{overflow-y:auto;padding:28px 32px 40px;background:#fff}
.lve-detail-side{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}

/* Detail header row */
.lve-detail-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.lve-detail-hd-l{flex:1;min-width:0}
.lve-detail-idrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lve-detail-idrow .idpill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;background:#F2F4F7;border:1px solid var(--line);
                          border-radius:var(--radius-md);font-size:12px;font-weight:700;color:var(--ink-2);font-family:'Gilroy',var(--font)}
.lve-detail-idrow .idpill i{color:var(--ink-3);font-size:11px}
.lve-detail-idrow .idbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;background:#fff;border:1px solid var(--line-strong);
                            border-radius:var(--radius-md);font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;text-transform:uppercase}
.lve-detail-title{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;font-family:'Gilroy',var(--font);line-height:1.2}
.lve-detail-hd-r{display:flex;align-items:center;gap:12px;flex:none}
.lve-status-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-md);
                  font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:'Gilroy',var(--font)}
.lve-status-badge.pending{background:var(--amber-500);color:#fff}
.lve-status-badge.endorsed{background:var(--blue-500);color:#fff}
.lve-status-badge.approved{background:var(--green-500);color:#fff}
.lve-status-badge.rejected{background:var(--red-500);color:#fff}
.lve-detail-hd-r .collapse{width:32px;height:32px;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:#fff;
                            color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.lve-detail-hd-r .collapse:hover{color:var(--primary);border-color:var(--primary)}

/* Metadata grid */
.lve-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 40px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.lve-meta{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.lve-meta .k{font-size:11.5px;color:var(--ink-3);font-weight:600}
.lve-meta .v{font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.lve-meta .v .av{width:24px;height:24px;border-radius:var(--radius-full);color:#fff;font-weight:700;font-size:10px;
                 display:flex;align-items:center;justify-content:center;flex:none;font-family:'Gilroy',var(--font)}
.lve-meta .v .link{color:var(--primary);display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.lve-meta .v .link i{font-size:10px}

/* Impact strip (replaces the location map — leave-context equivalent) */
.lve-impact-card{background:#FAFBFC;border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:22px}
.lve-impact-card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.lve-impact-card .hd h4{font-size:13px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font)}
.lve-impact-card .hd .lbl{font-size:11px;color:var(--ink-3);font-weight:600}
.lve-impact-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.lve-impact-day{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 8px;text-align:center;line-height:1.35;position:relative}
.lve-impact-day .d{font-size:9.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.lve-impact-day .n{font-size:15px;font-weight:700;color:var(--ink);margin-top:2px;font-family:'Gilroy',var(--font)}
.lve-impact-day .badge{margin-top:6px;padding:2px 6px;border-radius:var(--radius-sm);font-size:9px;font-weight:700;letter-spacing:.03em}
.lve-impact-day.affected{background:var(--red-100);border-color:#FDA29B}
.lve-impact-day.affected .badge{background:var(--red-500);color:#fff}
.lve-impact-day.holiday{background:#FEF3E6;border-color:#FDB022}
.lve-impact-day.holiday .badge{background:var(--amber-500);color:#fff}
.lve-impact-day.off{background:#F2F4F7}
.lve-impact-day.off .badge{background:#F2F4F7;color:var(--ink-3)}

/* Collapsible sections */
.lve-section{margin-bottom:22px}
.lve-section-hd{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line);cursor:pointer}
.lve-section-hd .caret{color:var(--ink-3);transition:transform .15s}
.lve-section.collapsed .caret{transform:rotate(-90deg)}
.lve-section-hd h3{font-size:14px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font)}
.lve-section-body{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px}
.lve-section.collapsed .lve-section-body{display:none}
.lve-section-body .row-item{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.lve-section-body .row-item .k{font-size:11.5px;color:var(--ink-3);font-weight:600}
.lve-section-body .row-item .v{font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.lve-section-body .row-item .v i{color:var(--ink-3);font-size:12px}

/* Notes textarea (read-only display of the submitted note) */
.lve-note-block{margin-bottom:22px}
.lve-note-block h4{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.lve-note-block .note{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}

/* Attachments row */
.lve-atts h4{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.lve-atts-row{display:flex;gap:12px;flex-wrap:wrap}
.lve-att-tile{width:120px;height:88px;border-radius:var(--radius-md);border:1px solid var(--line);background:#F2F4F7;
              display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--ink-2);cursor:pointer;transition:all .12s}
.lve-att-tile:hover{border-color:var(--primary);background:var(--primary-lightest);color:var(--primary)}
.lve-att-tile i{font-size:22px}
.lve-att-tile .nm{font-size:10px;font-weight:600}

/* Right sidebar — sticky action bar + tabs + timeline + composer */
.lve-side-action{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;background:#FAFBFC}
.lve-side-action .btn{flex:1;height:36px;border-radius:var(--radius-md);font-size:12.5px;font-weight:700;cursor:pointer;
                      display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Gilroy',var(--font);border:1px solid transparent;transition:all .12s}
.lve-side-action .btn.reject{background:#fff;border-color:#F09595;color:#912018}
.lve-side-action .btn.reject:hover{background:var(--red-100)}
.lve-side-action .btn.approve{background:var(--primary);color:#fff}
.lve-side-action .btn.approve:hover{background:var(--primary-hover)}

.lve-side-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px;background:#fff}
.lve-side-tabs .tab{padding:14px 4px 12px;margin-right:24px;font-size:13px;font-weight:600;color:var(--ink-3);
                    background:transparent;border:none;cursor:pointer;position:relative;font-family:'Gilroy',var(--font)}
.lve-side-tabs .tab.active{color:var(--primary)}
.lve-side-tabs .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}
.lve-side-tabs .tab .cnt{background:#F2F4F7;color:var(--ink-2);font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:5px}

.lve-side-body{flex:1;overflow-y:auto;padding:18px}
.lve-day-hd{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center;padding:6px 0;letter-spacing:.03em}

/* Timeline activity items (compact, like the reference "9:49 am · REPORTED ISSUE") */
.lve-tl-item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line);align-items:flex-start}
.lve-tl-item:last-child{border-bottom:none}
.lve-tl-icon{width:26px;height:26px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;
             flex:none;font-size:11px;background:#F2F4F7;color:var(--ink-3);font-weight:700}
.lve-tl-icon.done{background:var(--green-500);color:#fff}
.lve-tl-icon.active{background:#fff;border:2px solid var(--primary);color:var(--primary)}
.lve-tl-body{flex:1;min-width:0}
.lve-tl-actor{font-size:11px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
.lve-tl-actor .txt{color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0;margin-left:4px}
.lve-tl-name{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.lve-tl-note{margin-top:6px;padding:8px 10px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:11.5px;color:var(--ink-2);line-height:1.5}
.lve-tl-time{font-size:10.5px;color:var(--ink-3);flex:none;font-weight:500;padding-top:2px}

/* Related requests list */
.lve-rel-row{display:flex;gap:10px;padding:12px 4px;border-bottom:1px dashed var(--line);align-items:center;cursor:pointer;transition:background .12s}
.lve-rel-row:hover{background:#FAFBFC}
.lve-rel-row:last-child{border-bottom:none}
.lve-rel-row .av{width:28px;height:28px;border-radius:var(--radius-full);color:#fff;font-weight:700;font-size:10px;
                 display:flex;align-items:center;justify-content:center;flex:none;font-family:'Gilroy',var(--font)}
.lve-rel-row .info{flex:1;min-width:0}
.lve-rel-row .nm{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3}
.lve-rel-row .meta{font-size:10.5px;color:var(--ink-3);margin-top:1px}

/* Comment composer */
.lve-composer{border-top:1px solid var(--line);padding:14px 18px;background:#fff;display:flex;gap:8px;align-items:center}
.lve-composer input{flex:1;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius-full);
                    background:#F7F8FA;font-size:13px;font-family:'Gilroy',var(--font)}
.lve-composer input:focus{outline:2px solid var(--primary-lightest);outline-offset:-1px;border-color:var(--primary);background:#fff}
.lve-composer .attach{width:38px;height:38px;border-radius:var(--radius-full);background:transparent;border:1px solid var(--line);
                      color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.lve-composer .attach:hover{color:var(--primary);border-color:var(--primary)}
.lve-composer .send{width:38px;height:38px;border-radius:var(--radius-md);background:var(--primary);color:#fff;border:none;cursor:pointer;
                    display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.lve-composer .send:hover{background:var(--primary-hover)}

/* ============================================================================
   NEW REQUEST DRAWER — right-side flyout with stepped form (reference pattern)
   ============================================================================ */
.lve-drawer-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:120;
                     opacity:0;pointer-events:none;transition:opacity .18s ease-out}
.lve-drawer-backdrop.open{opacity:1;pointer-events:auto}
.lve-drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,92vw);background:#fff;z-index:130;
            box-shadow:-24px 0 48px -12px rgba(16,24,40,.18);display:flex;flex-direction:column;
            transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.3,1);font-family:'Gilroy',var(--font)}
.lve-drawer.open{transform:translateX(0)}

.lve-drawer-hd{padding:28px 40px 0;position:relative}
.lve-drawer-hd h2{font-size:22px;font-weight:700;color:var(--ink);font-family:'Gilroy',var(--font);letter-spacing:-0.01em}
.lve-drawer-hd .sub{font-size:14px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.lve-drawer-close{position:absolute;top:24px;right:28px;width:32px;height:32px;border-radius:var(--radius-md);
                   background:transparent;border:none;color:var(--ink-2);cursor:pointer;
                   display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s}
.lve-drawer-close:hover{background:var(--surface-2);color:var(--red-500)}

/* Stepper — boxed active tab, underline separator */
.lve-stepper{display:flex;align-items:center;gap:8px;padding:24px 40px 0;position:relative}
.lve-stepper::after{content:'';position:absolute;left:40px;right:40px;bottom:0;height:1px;background:var(--line)}
.lve-stepper .step{padding:9px 14px;border-radius:var(--radius-md);font-size:14px;font-weight:600;color:var(--ink-3);
                   background:transparent;border:1.5px solid transparent;cursor:pointer;font-family:'Gilroy',var(--font);
                   position:relative;z-index:1;transition:all .12s;letter-spacing:-0.01em}
.lve-stepper .step:hover:not(.active):not(.done){color:var(--ink-2)}
.lve-stepper .step.done{color:var(--ink-2);font-weight:600}
.lve-stepper .step.active{color:var(--primary);border-color:var(--primary);background:#fff;font-weight:700}

.lve-drawer-body{flex:1;overflow-y:auto;padding:28px 40px 40px}
.lve-drawer-body h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:20px;letter-spacing:-0.01em}

/* Form field cards — rounded outlined containers */
.lve-fld{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:14px;transition:border-color .12s}
.lve-fld:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-lightest)}
.lve-fld .lbl{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-family:'Gilroy',var(--font)}
.lve-fld .lbl .req{color:var(--red-500);margin-left:2px}
.lve-fld input, .lve-fld select, .lve-fld textarea{width:100%;border:none;background:transparent;padding:6px 0 0;
                                                    font-size:15px;color:var(--ink);font-family:'Gilroy',var(--font);outline:none;font-weight:500}
.lve-fld input::placeholder, .lve-fld textarea::placeholder{color:#98A2B3}
.lve-fld.select-fld{position:relative;cursor:pointer}
.lve-fld.select-fld::after{content:'\f078';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:18px;top:50%;
                            transform:translateY(-50%);color:var(--ink-3);font-size:11px;pointer-events:none}
.lve-fld.icon-fld input{padding-left:26px}
.lve-fld.icon-fld .fld-icon{position:absolute;left:18px;top:calc(50% + 4px);color:var(--ink-3);font-size:14px;pointer-events:none}
.lve-fld.icon-fld{position:relative}
.lve-fld.date-fld::after{content:'\f078';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:18px;top:50%;
                          transform:translateY(-50%);color:var(--ink-3);font-size:11px;pointer-events:none}
.lve-fld.date-fld{position:relative;cursor:pointer}
.lve-fld.date-fld .fld-icon{position:absolute;left:18px;top:calc(50% + 4px);color:var(--ink-3);font-size:13px}
.lve-fld.date-fld input{padding-left:26px}
.lve-fld textarea{resize:vertical;min-height:80px;line-height:1.5}
.lve-fld-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Impact preview banner inside drawer */
.lve-drawer-impact{background:#FEF3E6;border:1.5px solid #FDB022;border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:14px;
                   display:flex;gap:12px;font-size:13px;color:#7A2E0E;line-height:1.6}
.lve-drawer-impact i{color:var(--amber-500);font-size:15px;margin-top:2px;flex:none}
.lve-drawer-impact strong{color:#7A2E0E;font-weight:700}

/* Balance card inside drawer */
.lve-drawer-bal{background:#F7F8FA;border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:14px}
.lve-drawer-bal h4{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

/* Sticky footer */
.lve-drawer-ft{padding:18px 40px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}
.lve-drawer-ft .cancel{background:transparent;border:none;color:var(--red-500);font-size:14px;font-weight:600;cursor:pointer;padding:10px 4px;font-family:'Gilroy',var(--font)}
.lve-drawer-ft .cancel:hover{color:#912018}
.lve-drawer-ft .actions{display:flex;gap:10px}
.lve-drawer-ft .back{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink-2);padding:11px 22px;border-radius:var(--radius-md);
                     font-size:14px;font-weight:700;cursor:pointer;font-family:'Gilroy',var(--font)}
.lve-drawer-ft .back:hover{border-color:var(--primary);color:var(--primary)}
.lve-drawer-ft .proceed{background:var(--primary);border:none;color:#fff;padding:11px 32px;border-radius:var(--radius-md);
                        font-size:14px;font-weight:700;cursor:pointer;font-family:'Gilroy',var(--font)}
.lve-drawer-ft .proceed:hover{background:var(--primary-hover)}
.lve-drawer-ft .proceed.disabled{background:#99CDF3;cursor:not-allowed}
.lve-drawer-ft .proceed.disabled:hover{background:#99CDF3}

/* ============================================================================
   EXITS (LVE-05) + ENCASHMENT (LVE-06)
   ============================================================================ */
/* Clearance progress dots (IT · HR · Camp · Assets · Finance) */
.clr-dots{display:inline-flex;gap:4px;align-items:center}
.clr-dot{width:22px;height:22px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;
         font-size:9px;font-weight:700;font-family:'Gilroy',var(--font);border:1.5px solid var(--line-strong);
         background:#fff;color:var(--ink-3);position:relative}
.clr-dot.done{background:var(--green-500);border-color:var(--green-500);color:#fff}
.clr-dot.pending{background:#FEF3E6;border-color:var(--amber-500);color:var(--amber-500)}
.clr-dot.na{opacity:.4}
.clr-dot i{font-size:9px}

/* Exit status pills */
.ex-stat{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-full);
         font-size:11px;font-weight:700;font-family:'Gilroy',var(--font)}
.ex-stat.notice{background:var(--blue-100);color:var(--blue-500)}
.ex-stat.clearance{background:var(--amber-100);color:#B54708}
.ex-stat.settlement{background:#EDE9FE;color:#7C3AED}
.ex-stat.complete{background:var(--green-100);color:var(--green-500)}
.ex-stat.on-hold{background:var(--red-100);color:var(--red-500)}

/* Exit reason chip */
.ex-reason{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);
           font-size:10.5px;font-weight:700;letter-spacing:.02em}
.ex-reason.resignation{background:#F2F4F7;color:var(--ink-2)}
.ex-reason.termination{background:var(--red-100);color:var(--red-500)}
.ex-reason.contract-end{background:var(--blue-100);color:var(--blue-500)}
.ex-reason.retirement{background:#DCFCE7;color:#166534}

/* Countdown to last working day */
.lwd-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:var(--radius-md);
          font-size:10.5px;font-weight:700;font-family:'Gilroy',var(--font)}
.lwd-chip.far{background:#F2F4F7;color:var(--ink-2)}
.lwd-chip.near{background:var(--amber-100);color:#B54708}
.lwd-chip.today{background:var(--red-500);color:#fff}
.lwd-chip.past{background:var(--ink);color:#fff}

/* Currency amount cell */
.amt{font-family:'Gilroy',var(--font);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.amt .cur{color:var(--ink-3);font-weight:600;font-size:11px;margin-right:2px}

/* Encashment status pills */
.enc-stat{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-full);
          font-size:11px;font-weight:700;font-family:'Gilroy',var(--font)}
.enc-stat.pending-calc{background:#F2F4F7;color:var(--ink-2)}
.enc-stat.ready{background:var(--blue-100);color:var(--blue-500)}
.enc-stat.in-payroll{background:#EDE9FE;color:#7C3AED}
.enc-stat.paid{background:var(--green-100);color:var(--green-500)}
.enc-stat.held{background:var(--red-100);color:var(--red-500)}

/* ============================================================================
   SHIFT CONFIGURATION SCREEN — pixel-match to Figma node 2073:33843 (FAMS Blue)
   ============================================================================ */
@font-face{font-family:'Gilroy';font-weight:300;font-style:normal;src:url('./contract-management/fonts/Gilroy-Light.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:400;font-style:normal;src:url('./contract-management/fonts/Gilroy-Regular.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:500;font-style:normal;src:url('./contract-management/fonts/Gilroy-Medium.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:600;font-style:normal;src:url('./contract-management/fonts/Gilroy-Semibold.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:700;font-style:normal;src:url('./contract-management/fonts/Gilroy-Bold.otf') format('opentype')}

.shift-screen{display:grid;grid-template-columns:274px 1fr;gap:0;margin:-24px -28px -60px;
              min-height:100vh;background:#fff;position:relative;font-family:'Gilroy',var(--font)}

/* Left sub-nav — 274px, "Settings" header + 2 groups */
.shift-nav{border-right:1px solid var(--line-strong);padding:32px 28px;display:flex;flex-direction:column;gap:32px;overflow-y:auto}
.shift-nav .head{display:flex;flex-direction:column;gap:12px}
.shift-nav .back{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-3);font-weight:500;cursor:pointer;background:none;border:none;padding:0}
.shift-nav .back i{font-size:8px}
.shift-nav .brand-row{display:flex;align-items:center;gap:8px}
.shift-nav .brand-icn{width:28px;height:28px;border-radius:2px;background:rgba(138,190,236,.40);display:flex;align-items:center;justify-content:center;flex:none}
.shift-nav .brand-icn img{width:20px;height:20px;display:block;object-fit:contain}
.settings-group{display:flex;flex-direction:column;gap:0}
.settings-group .group-label{font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 0;font-family:'Gilroy',var(--font)}
.settings-nav-item{display:flex;align-items:center;gap:12px;padding:12px;height:40px;border-radius:4px;font-size:14px;color:#475467;font-weight:400;cursor:pointer;background:transparent;border:none;text-align:left;font-family:'Gilroy',var(--font);white-space:nowrap;line-height:1}
.settings-nav-item:hover{background:var(--surface-2)}
.settings-nav-item.active{background:var(--fams-50);color:#000;font-weight:500}
.settings-nav-item img{width:16px;height:16px;display:block;flex:none;object-fit:contain}

/* Right main pane */
.shift-main{padding:20px 28px 40px;position:relative;min-width:0}
.shift-crumb{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--ink-3);font-weight:500;font-family:'Gilroy',var(--font);margin-bottom:44px}
.shift-crumb i{font-size:7px;color:var(--ink-3)}
.shift-search{position:absolute;top:20px;right:28px;width:367px;height:32px;border:1px solid var(--line-strong);border-radius:4px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
.shift-search i{color:var(--ink-3);font-size:12px}
.shift-search input{border:none;outline:none;background:transparent;font-size:10px;flex:1;color:var(--ink);font-family:'Gilroy',var(--font);font-weight:500}
.shift-search input::placeholder{color:var(--ink-3);font-size:10px}
.shift-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}
.shift-header h1{font-size:24px;font-weight:700;color:#000;margin:0 0 4px;line-height:30px;font-family:'Gilroy',var(--font)}
.shift-header .subtitle{font-size:14px;color:#98A2B3;font-weight:300;max-width:773px;line-height:normal;font-family:'Gilroy',var(--font)}
.configure-btn{background:var(--primary);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);font-family:'Gilroy',var(--font);flex:none}
.configure-btn:hover{background:var(--primary-hover)}
.configure-btn i{font-size:14px}

.shift-list{display:flex;flex-direction:column;gap:16px}
.shift-row{background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:12px 20px;display:flex;align-items:center;gap:20px}
.shift-cell{display:flex;flex-direction:column;gap:4px;min-width:0;flex:none}
.shift-cell .lbl{font-size:11px;color:var(--ink-3);font-weight:500;font-family:'Gilroy',var(--font);line-height:normal;text-transform:none;letter-spacing:0}
.shift-cell .val{font-size:14px;color:#000;font-weight:500;text-transform:uppercase;font-family:'Gilroy',var(--font);line-height:normal;white-space:nowrap;letter-spacing:.02em}
.shift-cell.name{flex:0 0 160px}
.shift-cell.name .val{text-transform:none;letter-spacing:0}
.name-with-icon{display:flex;align-items:center;gap:8px}
.name-with-icon img{width:18px;height:18px;object-fit:contain;flex:none}
.shift-cell.sub-orgs-cell{flex:1 1 auto;min-width:200px}
.sub-orgs-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill-sub-org{display:inline-block;padding:3px 10px;border-radius:4px;background:var(--primary-lightest);color:var(--primary-hover);font-size:11.5px;font-weight:600;font-family:'Gilroy',var(--font);letter-spacing:.02em;white-space:nowrap;line-height:16px;border:1px solid rgba(34,200,130,.2)}
.pill-add{width:22px;height:22px;border-radius:4px;background:var(--primary-lightest);color:var(--primary);border:1px dashed rgba(34,200,130,.4);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:10px;padding:0}
.pill-add:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.date-val{color:#000;font-weight:500;text-transform:none;letter-spacing:0}

/* Varies-value — first day's value shown truncated with hover popover for full per-day breakdown */
.time-cell,.brk-cell{position:relative}
.varies-value{display:inline-flex;align-items:baseline;gap:2px;cursor:help;position:relative;outline:none}
.varies-value .varies-more{color:var(--ink-3);font-weight:700;font-size:13px;letter-spacing:0;line-height:1}
.varies-pop{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:12px 14px;min-width:280px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s;z-index:40;pointer-events:none}
.varies-value:hover .varies-pop,
.varies-value:focus .varies-pop{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.varies-pop .vp-head{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-family:'Gilroy',var(--font)}
.varies-pop table{width:100%;border-collapse:collapse;font-family:'Gilroy',var(--font)}
.varies-pop td{padding:5px 0;font-size:12.5px;color:var(--ink);border:none;text-transform:none;letter-spacing:0;font-weight:500}
.varies-pop .td-day{font-weight:700;color:#000;width:44px;letter-spacing:.02em}
.varies-pop .td-time{color:var(--ink)}
.varies-pop .td-brk{color:var(--ink-3);text-align:right;font-size:11.5px}
.shift-toggle-cell{display:flex;align-items:center;flex:none;margin-left:auto}
.shift-toggle{width:36px;height:20px;border-radius:12px;background:var(--primary);padding:2px;display:inline-flex;align-items:center;justify-content:flex-end;cursor:pointer;border:none;transition:background .15s}
.shift-toggle.off{background:#EAECF0;justify-content:flex-start}
.shift-toggle .knob{width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(16,24,40,.15)}

/* Right sidesheet — Configure New Shift */
.sheet-scrim{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-scrim.open{opacity:1;pointer-events:auto}
.sheet-close{position:fixed;top:24px;right:876px;width:40px;height:40px;background:#fff;border-radius:50%;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(16,24,40,.2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:16px;z-index:102;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-close.open{opacity:1;pointer-events:auto}
.sidesheet{position:fixed;top:0;right:0;bottom:0;width:860px;background:#fff;z-index:101;transform:translateX(100%);transition:transform .28s ease-out;display:flex;flex-direction:column;font-family:'Gilroy',var(--font)}
.sidesheet.open{transform:none}
.sheet-head{padding:32px 40px 16px}
.sheet-head h2{font-size:24px;font-weight:700;color:#000;margin:0 0 4px;font-family:'Gilroy',var(--font)}
.sheet-head p{font-size:14px;color:var(--ink-3);font-weight:500;margin:0;font-family:'Gilroy',var(--font)}
.sheet-tabs{display:flex;gap:32px;border-bottom:1px solid var(--line);padding:0 40px}
.sheet-tab{padding:12px 0;font-size:14px;color:var(--ink-3);font-weight:500;cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Gilroy',var(--font)}
.sheet-tab:hover{color:var(--fams)}
.sheet-tab.active{color:var(--fams);font-weight:700;border-bottom-color:var(--fams)}
.sheet-body{flex:1;padding:28px 40px 32px;overflow-y:auto}
.sheet-section h3{font-size:18px;font-weight:700;color:#000;margin:0 0 20px;font-family:'Gilroy',var(--font)}
.sheet-row{display:flex;gap:24px;margin-bottom:16px}
.sheet-field{flex:1;position:relative;min-width:0}
.sheet-field.narrow{flex:0 0 106px}
.sheet-field .picker-label{font-size:11px;font-weight:500;color:var(--ink-2);font-family:'Gilroy',var(--font);display:block;margin-bottom:8px}
/* Design-system input — label INSIDE the box, tiny grey caption above the value.
   Matches Figma frame 2073:34022 (Configure New Shift → Basic Info) */
.ds-input{background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:8px 12px;min-height:54px;
          display:flex;flex-direction:column;gap:4px;justify-content:center;position:relative;transition:border-color .15s,box-shadow .15s;font-family:'Gilroy',var(--font)}
.ds-input:focus-within{border-color:var(--fams);box-shadow:0 0 0 2px var(--fams-50)}
.ds-input .ds-label{font-family:'Gilroy',var(--font);font-weight:600;font-size:10px;color:#98A2B3;line-height:normal;text-transform:none;letter-spacing:0}
.ds-input input,.ds-input textarea,.ds-input select{font-family:'Gilroy',var(--font);font-weight:500;font-size:14px;color:#000;
                                                     line-height:normal;border:none;outline:none;padding:0;background:transparent;width:100%;resize:none}
.ds-input textarea{min-height:96px;resize:vertical;font-family:'Gilroy',var(--font)}
.ds-input.has-pin{padding-left:34px}
.ds-input .pin{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.ds-input .stepper{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;color:var(--ink-3);font-size:9px;gap:2px;cursor:pointer}
.ds-input.textarea{min-height:auto;padding:12px}
.ds-input.textarea .ds-label{margin-bottom:2px}
.ds-input input:disabled,.ds-input select:disabled{color:var(--ink-2);cursor:not-allowed;-webkit-text-fill-color:var(--ink-2);opacity:1}
.ds-input.disabled{background:#F9FAFB}
.ds-input select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='7' viewBox='0 0 12 7'><path d='M1 1l5 5 5-5' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right center;padding-right:20px}
.sheet-foot{padding:20px 40px;border-top:1px solid var(--line);background:#fff}
.sheet-save{width:100%;background:var(--fams);color:#fff;padding:14px;border-radius:4px;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:'Gilroy',var(--font)}
.sheet-save:hover{background:var(--fams-hover)}
.sheet-input-wrap select{width:100%;padding:11px 12px;border:none;outline:none;font-size:14px;color:#000;font-family:'Gilroy',var(--font);background:transparent;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='7' viewBox='0 0 12 7'><path d='M1 1l5 5 5-5' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
.sheet-input-wrap input:disabled{color:var(--ink-2);background:#F9FAFB;cursor:not-allowed}
.scope-hint{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--fams-50);border-radius:4px;font-size:12.5px;color:var(--ink-2);font-family:'Gilroy',var(--font);margin:-4px 0 16px;line-height:1.5}
.scope-hint i{color:var(--fams);font-size:14px;margin-top:2px}
.lbl-hint{color:var(--ink-3);font-weight:400}
/* ---- Schedule form (finalized) ---- */
.section-heading{font-size:16px;font-weight:600;color:#000;margin:28px 0 14px;font-family:'Gilroy',var(--font);letter-spacing:0}
.section-heading:first-child{margin-top:0}

.sheet-field.narrow-icon{flex:0 0 54px}
.ds-shift-icon{width:54px;height:54px;border:1px solid var(--line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;position:relative;padding:6px;transition:border-color .15s,box-shadow .15s}
.ds-shift-icon:hover{border-color:var(--fams);box-shadow:0 0 0 2px var(--fams-50)}
.ds-shift-icon img{width:24px;height:24px;object-fit:contain}
.ds-shift-icon::after{content:"\f078";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;bottom:4px;right:5px;font-size:7px;color:var(--ink-3)}

.freq-hint{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--fams-50);border-left:3px solid var(--fams);border-radius:4px;font-size:13px;color:var(--ink);font-family:'Gilroy',var(--font);margin-bottom:16px;line-height:1.5;font-weight:400}
.freq-hint i{color:var(--fams);font-size:14px;margin-top:2px;flex:none}
.freq-hint strong{font-weight:600}
.days-label{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:10px;font-family:'Gilroy',var(--font);text-transform:uppercase;letter-spacing:.04em}

.day-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.day-check{display:flex;align-items:center;gap:8px;width:80px;flex:none}
.day-check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--fams);cursor:pointer;margin:0;flex:none}
.day-check label{font-size:14px;font-weight:500;color:#000;cursor:pointer;font-family:'Gilroy',var(--font)}
.day-row.inactive .day-check label{color:var(--ink-3)}

.time-fields{display:flex;gap:12px;flex:1;min-width:0}
.time-fields.solo{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.time-fields > .ds-input{flex:1;min-width:0;min-height:auto;height:54px;padding:8px 32px 8px 12px;position:relative}
.day-row.inactive .time-fields > .ds-input{opacity:.5}
.time-fields > .ds-input input:disabled{cursor:not-allowed}

.ds-input .clear-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:transparent;color:var(--ink-3);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:10px;padding:0;opacity:0;transition:opacity .12s}
.ds-input:hover .clear-x{display:flex;opacity:1}
.ds-input .clear-x:hover{background:rgba(240,68,56,.1);color:#F04438}
.ds-input.readonly{background:linear-gradient(135deg,var(--fams-50) 0%,#F0F7FE 100%);pointer-events:none;border-color:#C9DDF3}
.ds-input.readonly .ds-label{color:var(--fams)}
.ds-input.readonly .wh-val{font-size:15px;font-weight:600;color:var(--fams);font-family:'Gilroy',var(--font);line-height:normal;display:flex;align-items:center;gap:6px}
.ds-input.readonly .wh-val::before{content:"\f017";font-family:"Font Awesome 6 Free";font-weight:400;font-size:12px;opacity:.7}
/* Hide native time picker icon in Chrome/Edge — we already have the label pattern */
input[type=time]::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer;filter:invert(60%)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;width:20px;cursor:pointer}

.week-block{margin-bottom:24px;padding:16px;background:#F9FAFB;border:1px solid var(--line);border-radius:6px}
.week-block:last-child{margin-bottom:0}
.week-header{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#000;margin-bottom:14px;font-family:'Gilroy',var(--font)}
.week-badge{width:26px;height:26px;border-radius:6px;background:var(--fams);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.week-badge.b{background:#7C3AED}

.date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.date-cell{height:38px;border:1px solid var(--line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--ink);font-family:'Gilroy',var(--font);padding:0;transition:all .12s}
.date-cell:hover{border-color:var(--fams);background:var(--fams-50)}
.date-cell.selected{background:var(--fams);color:#fff;border-color:var(--fams);font-weight:600}
.date-cell.wide{grid-column:span 4;font-size:12px}

.custom-date-row{display:flex;align-items:center;gap:12px;padding:14px;background:#F9FAFB;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.cdr-date{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#000;width:150px;flex:none;font-family:'Gilroy',var(--font)}
.cdr-date i{color:var(--fams);font-size:12px}
.row-remove{background:#fff;border:1px solid var(--line-strong);color:#F04438;width:38px;height:38px;border-radius:4px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.row-remove:hover{background:#FEECEC;border-color:#F04438}
.btn-add-date{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:transparent;border:1px dashed var(--line-strong);border-radius:4px;color:var(--fams);font-weight:600;font-size:13px;cursor:pointer;font-family:'Gilroy',var(--font);margin-top:4px}
.btn-add-date:hover{background:var(--fams-50);border-color:var(--fams)}

/* Custom recurrence controls — Google Calendar-style compact panel */
.custom-freq-block{padding:20px;border:1px solid var(--line);border-radius:6px;background:#F9FAFB;display:flex;flex-direction:column;gap:20px}
.cfb-inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cfb-inline-label{font-size:14px;color:var(--ink);font-weight:500;font-family:'Gilroy',var(--font)}
.repeat-every{display:flex;gap:12px;align-items:center}
.repeat-every > .ds-input{min-height:44px;height:44px}
.ds-input.narrow-num{flex:0 0 72px}
.ds-input.narrow-num input{text-align:center;font-weight:600;padding-right:0}
.day-toggles{display:flex;gap:8px;flex-wrap:wrap}
.day-toggle{width:38px;height:38px;border:1px solid var(--line-strong);border-radius:50%;background:#fff;font-family:'Gilroy',var(--font);font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:all .12s;
            display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0}
.day-toggle:hover{border-color:var(--fams);color:var(--fams)}
.day-toggle.selected{background:var(--fams);color:#fff;border-color:var(--fams)}
.ends-row{display:flex;flex-direction:column;gap:8px}
.radio-row{display:flex;align-items:center;gap:8px;font-size:14px;font-family:'Gilroy',var(--font);color:var(--ink);cursor:pointer}
.radio-row input[type=radio]{accent-color:var(--fams);width:16px;height:16px}
.mini-date,.mini-num{padding:6px 10px;border:1px solid var(--line-strong);border-radius:4px;font-family:'Gilroy',var(--font);font-size:13px;color:var(--ink);background:#fff}
.mini-num{width:64px;text-align:center}
.mini-date{width:150px}

.icon-picker{display:flex;gap:10px}
.icon-swatch{width:44px;height:44px;border-radius:4px;border:1px solid var(--line-strong);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;padding:0}
.icon-swatch:hover{border-color:var(--fams)}
.icon-swatch.selected{border-color:var(--fams);background:var(--fams-50);box-shadow:0 0 0 2px rgba(0,114,214,.15)}
.icon-swatch img{width:22px;height:22px;object-fit:contain;display:block}
/* ============================================================================
   FIGMA TOP NAV — Tadweer node 554:20353 ("Inspector Shifts" → ours: Drivers & Shifts)
   Bar h48 · bg var(--ds-bg) · border-bottom var(--ds-gray-300) · gap-32 · px-32.
   ============================================================================ */
.fcal-hd-bar{height:48px;background:var(--ds-bg);border-bottom:1px solid var(--ds-gray-300);display:flex;align-items:center;gap:32px;padding:0 32px}
.fcal-hd-title{font-family:'Gilroy',var(--font);font-weight:600;font-size:16px;line-height:18px;color:var(--ds-fg);white-space:nowrap}
.fcal-hd-tabs{display:flex;align-items:center;gap:8px}
.fcal-hd-tabrow{display:flex;align-items:stretch;gap:0}
.fcal-hd-tab{height:48px;padding:0 12px;background:#fff;border:none;border-right:1px solid var(--ds-border);display:flex;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.fcal-hd-tab.is-active{background:transparent;border-left:1px solid var(--ds-border)}
.fcal-hd-info{display:flex;align-items:center;gap:8px}
.fcal-hd-ic{width:12px;height:12px;flex:0 0 12px;display:flex;align-items:center;justify-content:center}
.fcal-hd-ic img{width:12px;height:12px;display:block;object-fit:contain}
.fcal-hd-lbl{font-family:'Gilroy',var(--font);font-weight:600;font-size:12px;color:var(--ds-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px}
.fcal-hd-plus{width:16px;height:16px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fcal-hd-plus img{width:16px;height:16px;display:block}
.fcal-hd-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.fcal-hd-btn.ros-secondary-btn,.fcal-hd-btn.ros-primary-btn{height:34px}

/* ============================================================================
   FIGMA CALENDAR VIEW — Tadweer "Shift Scheduling ( Calendar View )"
   Source: Figma node 554:20313 (Tadweer – April Release), Weekly frame 554:20314.
   Layout/spec ported 1:1; the DATA is this prototype's roster domain.
   Geometry from Figma: left column 264px · day cell 48px header · row 154px ·
   borders #d0d5dd · empty cell #f9fafb · chip card #fff / #eaecf0 r6 p10 gap8.
   ============================================================================ */
.fcal-wrap{margin:0 24px 16px}

/* — toolbar row 1 · search + filter — */
.fcal-tools{display:flex;align-items:center;justify-content:space-between;margin:0 24px 16px}
.fcal-tools-l{display:flex;gap:12px;align-items:flex-start}
.fcal-search{position:relative;width:367px;height:40px}
.fcal-search input{width:100%;height:40px;border:1px solid var(--ds-gray-300);border-radius:4px;padding:0 10px 0 34px;font-family:'Gilroy',var(--font);font-size:12px;font-weight:500;color:var(--ds-fg);background:#fff;outline:none}
.fcal-search input::placeholder{color:var(--ds-gray-400);font-weight:500}
.fcal-search img{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none}
.fcal-filter{width:40px;height:40px;border:1px solid var(--ds-gray-300);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fcal-filter img{width:16px;height:16px}

/* — toolbar row 2 · segmented + date navigator — */
.fcal-row2{display:flex;align-items:center;justify-content:space-between;margin:0 24px 16px}
.fcal-row2-l{display:flex;gap:18px;align-items:center}
.fcal-seg{background:#edf0f2;height:40px;display:flex;align-items:center;justify-content:center;padding:2px 1px;border-radius:4px}
.fcal-seg button{height:38px;width:82px;border:none;background:none;border-radius:4px;font-family:'Gilroy',var(--font);font-size:15px;font-weight:500;color:var(--ds-primary);line-height:1.4;cursor:pointer;padding:0 16px;white-space:nowrap}
.fcal-seg button.active{background:#fff;border:1px solid var(--ds-gray-300);font-weight:600;color:var(--ds-fg)}
.fcal-datenav{display:flex;gap:6px;align-items:center}
.fcal-datenav .chev{width:20px;height:20px;flex:none}
.fcal-datenav .lbl{display:flex;gap:2px;align-items:center;font-family:'Gilroy',var(--font);font-weight:600;line-height:1.4}
.fcal-datenav .lbl .range{font-size:18px;color:var(--ds-fg)}
.fcal-datenav .lbl .sub{font-size:12px;color:var(--ds-gray-400)}

/* — KPI cards — */
.fcal-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 24px 16px}
.fcal-kpi{background:#fff;border:1px solid var(--ds-gray-300);border-radius:5px;padding:16px;display:flex;gap:12px;align-items:center;overflow:hidden}
.fcal-kpi .av{border-radius:30px;padding:14px;display:flex;align-items:center;flex:none}
.fcal-kpi .av img{width:20px;height:20px;display:block}
.fcal-kpi .txt{display:flex;flex-direction:column;align-items:flex-start;flex:1 0 0;min-width:0}
.fcal-kpi .txt .l{font-family:'Gilroy',var(--font);font-weight:500;font-size:14px;line-height:20px;color:var(--ds-gray-600)}
.fcal-kpi .txt .v{font-family:'Gilroy',var(--font);font-weight:600;font-size:26px;line-height:28px;color:var(--ds-fg)}

/* — the grid: frozen driver column + scrollable calendar — */
.fcal-grid{display:flex;align-items:flex-start;background:#fff;border:1px solid var(--ds-gray-300);border-radius:5px;overflow:hidden;margin:0 24px 16px}
.fcal-left{width:264px;flex:none;display:flex;flex-direction:column}
.fcal-left-hd{height:48px;border-bottom:1px solid var(--ds-gray-300);border-right:1px solid var(--ds-gray-300);display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px}
.fcal-left-hd span{flex:1 0 0;font-family:'Gilroy',var(--font);font-weight:700;font-size:12px;letter-spacing:.96px;text-transform:uppercase;color:var(--ds-fg);opacity:.7}
.fcal-left-body{flex:1 0 0;border-right:1px solid var(--ds-gray-300);display:flex;flex-direction:column}

/* driver card — Figma "Inspectors" cell, h154 p12 gap8 */
.fcal-emp{height:154px;border-bottom:1px solid var(--ds-gray-300);display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}
.fcal-emp-top{display:flex;gap:6px;align-items:flex-start;min-height:32px;flex:none}
.fcal-emp-av{width:32px;height:32px;border-radius:32px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Gilroy',var(--font);font-weight:700;font-size:12px}
.fcal-emp-id{display:flex;flex-direction:column;justify-content:center;font-family:'Gilroy',var(--font);font-weight:600}
.fcal-emp-id .n{font-size:14px;line-height:17px;color:var(--ds-fg)}
.fcal-emp-id .r{font-size:12px;line-height:14px;color:var(--ds-gray-400)}
.fcal-emp-pill{display:inline-flex;align-items:center;justify-content:center;padding:4px;border-radius:4px;font-family:'Gilroy',var(--font);font-weight:600;font-size:10px;line-height:12px;text-transform:uppercase;white-space:nowrap;align-self:flex-start;flex:none}
.fcal-emp-pill.good{background:#ecfdf3;color:var(--ds-success)}
.fcal-emp-pill.warn{background:#fef3e6;color:var(--ds-warning)}
.fcal-emp-pill.bad {background:#fef3f2;color:var(--ds-error)}
.fcal-emp-metric{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:14px;flex:none}
.fcal-emp-metric .k{font-family:'Gilroy',var(--font);font-weight:700;font-size:10px;line-height:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ds-gray-400);opacity:.7;white-space:nowrap}
.fcal-emp-metric .vwrap{display:flex;gap:10px;align-items:center;width:110px}
.fcal-emp-metric .bar{flex:1 0 0;min-width:0;height:8px;border-radius:18px;background:#ececec;position:relative;overflow:hidden}
.fcal-emp-metric .bar i{position:absolute;inset:0 auto 0 0;border-radius:18px;background:var(--ds-success);display:block}
.fcal-emp-metric .v{display:flex;gap:4px;align-items:center;font-family:'Gilroy',var(--font);font-weight:500;font-size:12px;line-height:14px;color:var(--ds-fg);white-space:nowrap}
.fcal-emp-metric .v img{width:12px;height:12px;display:block}

/* calendar side */
.fcal-cal{flex:1 0 0;min-width:0;overflow-x:auto}
.fcal-cal-inner{min-width:1050px}
.fcal-days{display:flex;align-items:flex-start;border-bottom:1px solid var(--ds-gray-300)}
.fcal-day{flex:1 0 0;min-width:0;height:48px;border-right:1px solid var(--ds-gray-300);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;box-sizing:border-box}
.fcal-day .in{display:flex;gap:6px;align-items:center;text-align:center;white-space:nowrap}
.fcal-day .wd{font-family:'Gilroy',var(--font);font-weight:500;font-size:12px;line-height:1.4;color:var(--ds-gray-400)}
.fcal-day.today .wd{color:var(--ds-primary)}
.fcal-day .nu{font-family:'Gilroy',var(--font);font-weight:600;font-size:16px;line-height:1.4;color:var(--ds-fg)}
.fcal-body{display:flex;align-items:flex-start}
.fcal-col{flex:1 0 0;min-width:0;display:flex;flex-direction:column}

/* a day cell — Figma "Card": bg var(--ds-bg), h154, p10, gap6 */
.fcal-cell{height:154px;box-sizing:border-box;background:var(--ds-bg);border-bottom:1px solid var(--ds-gray-300);border-right:1px solid var(--ds-gray-300);display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:flex-start;padding:10px}
.fcal-cell>.fcal-chip{flex:1 0 auto;height:100%;align-self:stretch}
/* chip card — Figma "modal": white, border var(--ds-border), r6, p10, wrap gap8 */
.fcal-chip{width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--ds-border);border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:8px;overflow:hidden}
.fcal-chip-item{display:flex;gap:4px;align-items:center;overflow:hidden;flex:none;max-width:100%}
.fcal-chip-item img,.fcal-chip-item i{width:12px;height:12px;font-size:12px;line-height:12px;display:block;flex:none;color:var(--ds-gray-400,#98a2b3);text-align:center}
.fcal-chip-item span{font-family:'Gilroy',var(--font);font-weight:500;font-size:12px;line-height:14px;color:var(--ds-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* status badge — Figma spec for shift badges (morning/afternoon/night): soft tinted bg, r2px, p4-8, 12px SemiBold colored (NOT white) normal-case icon+label */
.fcal-badge{height:22px;box-sizing:border-box;display:flex;gap:4px;align-items:center;padding:5px 6px;border-radius:3px;flex:none;font-family:'Gilroy',var(--font);font-weight:600;font-size:12px;letter-spacing:0;text-transform:none;color:#fff;white-space:nowrap;overflow:hidden}
.fcal-badge img{width:14px;height:14px;display:block;flex:none}
/* shift variants: new Figma spec */
.fcal-badge.morning  {background:rgba(255,191,0,.1);border-radius:2px;padding:4px 8px;color:#FFBF00}
.fcal-badge.afternoon{background:rgba(255,110,0,.1);border-radius:2px;padding:4px 8px;color:#FF6E00}
.fcal-badge.night    {background:rgba(0,81,152,.1);border-radius:2px;padding:4px 8px;color:#005198}
/* non-shift variants: keep original white text uppercase style */
.fcal-badge.off      {background:var(--ds-gray-400);text-transform:uppercase;letter-spacing:.48px;color:#fff}
.fcal-badge.docblock {background:var(--ds-error);text-transform:uppercase;letter-spacing:.48px;color:#fff}
.fcal-badge.dayseven {background:var(--ds-error-dark);text-transform:uppercase;letter-spacing:.48px;color:#fff}

/* ---- Official 15-status set — Figma Launch Pad node 6809:7117. Geometry verbatim from Figma
   (matches the pre-existing .fcal-badge.solid pattern); colours assigned by severity family
   pending designer theming (see status-spec.md). Single source of colour per status; labels
   live in the FCAL_STATUS_LABELS map in JS (fcalStatus()). */
.fcal-st{height:22px;box-sizing:border-box;display:inline-flex;gap:6px;align-items:center;padding:5px 6px;border-radius:3px;flex:none;overflow:hidden;font-family:'Gilroy',var(--font);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.48px;color:#fff;white-space:nowrap}
.fcal-st.active      {background:var(--ds-success)}
.fcal-st.inactive    {background:var(--ds-gray-400)}
.fcal-st.resigning   {background:var(--ds-warning)}
.fcal-st.resigned    {background:var(--ds-gray-600)}
.fcal-st.terminated  {background:var(--ds-error-dark)}
.fcal-st.docblock    {background:var(--ds-error)}
.fcal-st.certblock   {background:var(--ds-error)}
.fcal-st.otpending   {background:var(--ds-warning)}
.fcal-st.onleave     {background:var(--ds-fams)}
.fcal-st.leavereq    {background:var(--ds-blue-light)}
.fcal-st.rostergap   {background:var(--ds-error)}
.fcal-st.holiday     {background:var(--ds-purple)}
.fcal-st.dayseven    {background:var(--ds-error-dark)}
.fcal-st.doubleassign{background:var(--ds-error)}
.fcal-st.absent      {background:var(--ds-error-dark)}

/* — ROS-01: LOT selector (toolbar row 1) — */
.fcal-lot{height:40px;border:1px solid var(--ds-gray-300);border-radius:4px;background:#fff;padding:0 10px;font-family:'Gilroy',var(--font);font-size:12px;font-weight:500;color:var(--ds-fg);outline:none;cursor:pointer;min-width:170px}
.fcal-empty-state{width:100%;padding:64px 24px;text-align:center;font-family:'Gilroy',var(--font);color:var(--ds-gray-400);font-size:14px;font-weight:500}

/* — ROS-02: drag & drop reassignment — */
.fcal-cell{position:relative;transition:background .15s,box-shadow .15s}
.fcal-cell.dragging-source{opacity:.4}
.fcal-cell.drop-valid{box-shadow:inset 0 0 0 2px var(--ds-primary);background:#ecfdf3}
.fcal-cell.drop-invalid{box-shadow:inset 0 0 0 2px var(--ds-error);background:#fef3f2}
.fcal-cell.drop-invalid::after{content:'';position:absolute;inset:3px;border:1.5px dashed var(--ds-error);border-radius:4px;pointer-events:none}
.fcal-chip{cursor:grab;transition:transform .15s,opacity .15s,box-shadow .15s}
.fcal-chip:active{cursor:grabbing}
.fcal-chip-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.9;box-shadow:0 8px 24px rgba(16,24,40,.18);transform:scale(1.02)}
.fcal-badge.ot-tag{background:var(--ds-warning);margin-left:4px}
.fcal-undo-pill{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ds-fg);color:#fff;font-family:'Gilroy',var(--font);font-size:13px;font-weight:600;padding:10px 18px;border-radius:24px;display:flex;gap:12px;align-items:center;z-index:9999;box-shadow:0 8px 24px rgba(16,24,40,.28)}
.fcal-undo-pill button{background:var(--ds-primary);color:var(--ds-fg);border:none;border-radius:16px;padding:6px 14px;font-family:'Gilroy',var(--font);font-weight:700;font-size:12px;cursor:pointer}

/* ---- ROS-04: Daily job assignment view — hour timeline ---- */
.fcal-d-hdrow{display:flex;width:100%}
.fcal-d-hour{flex:1 0 0;min-width:0;height:48px;border-right:1px solid var(--ds-gray-300);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.fcal-d-hour .wd{font-family:'Gilroy',var(--font);font-weight:500;font-size:12px;line-height:1.4;color:var(--ds-gray-400);white-space:nowrap}
.fcal-d-body{display:flex;flex-direction:column;width:100%}
.fcal-d-row{position:relative;height:154px;border-bottom:1px solid var(--ds-gray-300);background:var(--ds-bg);box-sizing:border-box}
.fcal-d-row:last-child{border-bottom:none}
.fcal-d-gridlines{position:absolute;inset:0;display:flex;pointer-events:none}
.fcal-d-gridlines i{flex:1 0 0;min-width:0;border-right:1px solid var(--ds-border)}
.fcal-d-gridlines i:last-child{border-right:none}
.fcal-d-bar{position:absolute;top:50%;transform:translateY(-50%);height:64px;box-sizing:border-box;background:#fff;border:1px solid var(--ds-border);border-radius:6px;padding:0 10px;display:flex;gap:8px;align-items:center;overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
.fcal-d-bar:hover{box-shadow:0 4px 14px rgba(16,24,40,.12)}
.fcal-d-off{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-family:'Gilroy',var(--font);font-size:13px;color:var(--ds-gray-400)}
.fcal-d-blocked{position:absolute;top:50%;left:8px;right:8px;transform:translateY(-50%);height:64px;box-sizing:border-box;border:1.5px dashed var(--ds-error);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(240,68,56,.04)}
.fcal-d-cont{font-family:'Gilroy',var(--font);font-size:10px;font-weight:600;color:var(--ds-gray-400);white-space:nowrap}
.fcal-d-sent{font-family:'Gilroy',var(--font);font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ds-success);white-space:nowrap}
.fcal-job-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:start}
.fcal-job-l{font-family:'Gilroy',var(--font);font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ds-gray-400);white-space:nowrap;padding-top:1px}
.fcal-job-v{font-family:'Gilroy',var(--font);font-size:13px;color:var(--ds-fg)}

/* ---- ROS-06: headcount planner + 14-day coverage heat map ---- */
.fcal-pub-tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:3px;font-family:'Gilroy',var(--font);font-weight:700;font-size:10px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.fcal-pub-tag.draft{background:#f2f4f7;color:var(--ds-gray-600)}
.fcal-pub-tag.published{background:#ecfdf3;color:var(--ds-success)}
.fcal-pub-tag.pending{background:#fef0c7;color:#b54708}
.ros-primary-btn.pub-dot{position:relative}
.ros-primary-btn.pub-dot::after{content:'';position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--ds-warning);border:1.5px solid #fff}

/* Focus-visible rings — DS --ds-ring (Tadweer #DCFAE6), roster-scoped interactive elements */
.fcal-lot:focus-visible,
.fcal-seg button:focus-visible,
.fcal-search input:focus-visible,
.fcal-filter:focus-visible,
.fcal-chip:focus-visible,
.fcal-d-bar:focus-visible,
.ros-primary-btn:focus-visible,
.ros-secondary-btn:focus-visible{
  outline:2px solid var(--ds-ring);
  outline-offset:2px;
}

/* ROS-04: weekly-cell chips sit inside .fcal-cal (overflow-x:auto, which forces overflow-y to
   auto too), so the global [data-tip]::after pseudo-tooltip gets clipped for chips near the
   grid edges — verified: a left-column chip's tooltip box measured ~65px past .fcal-cal's left
   edge. Chips opt out of the CSS pseudo-tooltip and use a position:fixed pill instead (same
   precedent as .fcal-chip-ghost, which already escapes this overflow context for drag), driven
   by fcalChipShowTip/fcalChipHideTip below. Styled to match [data-tip]::after exactly. */
.fcal-chip[data-tip]::before,.fcal-chip[data-tip]::after{display:none}
.fcal-tip-pill{
  position:fixed;z-index:9999;pointer-events:none;
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;
  padding:6px 9px;border-radius:var(--radius-sm);box-shadow:var(--shadow-2);
  font-family:'Gilroy',var(--font);letter-spacing:.01em;line-height:1.35;
  max-width:280px;text-align:center;opacity:0;transition:opacity .12s ease-out;
}
.fcal-tip-pill.show{opacity:1}
</style>

/* ================ ROUTER ================ */
const routes = {};
function route(id, fn, title, crumb){ routes[id] = {fn, title, crumb} }
function go(id){
  const r = routes[id] || routes.summary;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.route===id));
  const fs = document.getElementById('footSettings'); if (fs) fs.classList.toggle('active', id==='shift');
  const pt = document.getElementById('pageTitle'); if (pt) pt.textContent = r.title;
  const pc = document.getElementById('pageCrumb'); if (pc) pc.textContent = r.crumb;
  document.getElementById('main').innerHTML = r.fn();
  document.getElementById('main').scrollTop = 0;
  location.hash = '#/' + id;
}
document.addEventListener('click', e=>{
  const b = e.target.closest('.nav-item');
  if (b) go(b.dataset.route);
});

function toggleTheme(){
  const c = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', c==='dark'?'light':'dark');
}
function toast(msg, kind){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function modal(html){
  document.getElementById('modalHost').innerHTML = `<div class="modal-scrim" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }

/* ---- Listing summarizers ---- */
const DAY_ORDER = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
function formatDaysList(activeDays){
  const idx = activeDays.map(d => DAY_ORDER.indexOf(d)).sort((a,b)=>a-b);
  if (idx.length === 0) return '—';
  if (idx.length === 7) return 'MON - SUN';
  if (idx.length === 5 && idx[0] === 0 && idx[4] === 4) return 'MON - FRI';
  const isCont = idx.every((v,i) => i === 0 || v === idx[i-1] + 1);
  if (isCont) return `${DAY_ORDER[idx[0]]} - ${DAY_ORDER[idx[idx.length-1]]}`;
  return idx.map(i => DAY_ORDER[i]).join(', ');
}
function summarizeSchedule(sh){
  const active = sh.schedule.filter(d => d.on);
  const daysStr = formatDaysList(active.map(d => d.day));
  const startsUniq = new Set(active.map(d => d.start));
  const endsUniq = new Set(active.map(d => d.end));
  const brksUniq = new Set(active.map(d => d.brk));
  const timeConsistent = startsUniq.size === 1 && endsUniq.size === 1;
  const brkConsistent = brksUniq.size === 1;
  return {
    days: daysStr,
    time: timeConsistent ? `${active[0].start} - ${active[0].end}` : null,
    brk:  brkConsistent  ? active[0].brk : null,
    active
  };
}
function scheduleTooltip(active){
  const rows = active.map(d => `<tr><td class="td-day">${d.day}</td><td class="td-time">${d.start} – ${d.end}</td><td class="td-brk">${d.brk} break</td></tr>`).join('');
  return `<div class="varies-pop"><div class="vp-head">Per-day schedule</div><table>${rows}</table></div>`;
}

/* ---- Interactive behaviour ---- */
function parseTime(v){
  if (!v) return null;
  const m = v.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1])*60 + parseInt(m[2]);
}
function parseBreak(v){
  if (!v) return 0;
  const m = v.match(/^([\d.]+)\s*(hour|min)/i);
  if (!m) return 0;
  return m[2].toLowerCase()==='hour' ? Math.round(parseFloat(m[1])*60) : parseInt(m[1]);
}
function computeWorkingHours(start, end, brk){
  const s = parseTime(start), e = parseTime(end);
  if (s === null || e === null) return '—';
  let diff = e - s;
  if (diff <= 0) diff += 24*60; // overnight
  diff -= parseBreak(brk);
  if (diff <= 0) return '—';
  const h = Math.floor(diff/60), m = diff%60;
  return m === 0 ? `${h} hour${h===1?'':'s'}` : `${h}h ${m}m`;
}
function containerFor(el){
  const tf = el.closest('.time-fields');
  if (!tf) return null;
  if (tf.classList.contains('solo')) return tf;
  return el.closest('.day-row, .custom-date-row');
}
function recomputeWH(container){
  if (!container) return;
  const s = container.querySelector('[data-t="start"]')?.value || '';
  const e = container.querySelector('[data-t="end"]')?.value || '';
  const b = container.querySelector('[data-t="break"]')?.value || '';
  const whEl = container.querySelector('.wh-val');
  if (whEl) whEl.textContent = computeWorkingHours(s, e, b);
}

  recomputeWH(containerFor(e.target));
});

  }
});
