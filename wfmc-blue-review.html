/* Training tab — computed live from TRAININGS + EMP_TRAIN + ROLE_REQUIREMENTS + SKILL_UNLOCKS.
   Matches BRD §7.7 (FR-TRN): catalogue (TRN-01), competency matrix + score (TRN-04),
   safety-critical expiry flags dispatch (TRN-05), TBT delivery log (TRN-12).
   TBT calendar / session scheduling are module-level, not per-employee. */

function pad2(n){ return n < 10 ? '0' + n : String(n); }

/* Classify certificate state — returns 'valid' | 'expiring' | 'expired' | 'missing'.
   Expiring threshold matches the doc-expiry alerts contract (30 days). */
function trnStatus(rec){
  if (!rec) return 'missing';
  if (rec.status === 'exp') return 'expired';
  if (typeof rec.daysLeft === 'number' && rec.daysLeft < 0) return 'expired';
  if (typeof rec.daysLeft === 'number' && rec.daysLeft <= 30) return 'expiring';
  return 'valid';
}

/* Compute per-employee training rollup: required course list w/ state, competency score,
   held skills, additional (non-required) certs and dispatch-block flag (TRN-05). */
function computeTrainingRollup(e){
  const emp = EMP_TRAIN[e.id] || {};
  const requiredCodes = ROLE_REQUIREMENTS[e.role] || [];
  const required = requiredCodes.map(code => {
    const tr = TRAININGS.find(t => t.code === code);
    const rec = emp[code];
    return { ...tr, rec, state: trnStatus(rec) };
  });
  const additionalCerts = Object.keys(emp)
    .filter(c => !requiredCodes.includes(c))
    .map(c => ({ ...TRAININGS.find(t=>t.code===c), rec: emp[c], state: trnStatus(emp[c]) }));

  const validCount    = required.filter(r => r.state === 'valid').length;
  const expiringCount = required.filter(r => r.state === 'expiring').length;
  const expiredCount  = required.filter(r => r.state === 'expired').length;
  const missingCount  = required.filter(r => r.state === 'missing').length;
  const total = required.length;
  const score = total ? Math.round(((validCount + expiringCount * 0.5) / total) * 100) : 0;

  // Dispatch block per TRN-05: any safety-critical required course expired or missing.
  const blockingCourses = required.filter(r => r.safety && (r.state === 'expired' || r.state === 'missing'));

  // Skills derived from actually-held (valid or expiring) courses.
  const heldCourses = new Set([...required, ...additionalCerts]
    .filter(r => r.state === 'valid' || r.state === 'expiring')
    .map(r => r.code));
  const categories = [...new Set(SKILL_UNLOCKS.map(s => s.category))];
  const skillMatrix = categories.map(cat => ({
    category: cat,
    items: SKILL_UNLOCKS.filter(s => s.category === cat)
      .map(s => ({ ...s, held: s.courses.some(c => heldCourses.has(c)) }))
  }));

  return {
    total, validCount, expiringCount, expiredCount, missingCount,
    score, blockingCourses,
    required, additional: additionalCerts, skillMatrix,
  };
}

function courseRowHtml(r){
  const meta = r.rec
    ? `<span class="tr-code">${r.code}</span> · ${r.safety?'Safety-critical · ':''}Completed ${r.rec.completed}${r.rec.expires && r.rec.expires !== '—' ? ' · Expires '+r.rec.expires : ''}${typeof r.rec.daysLeft==='number' ? ' · '+(r.rec.daysLeft<0?`${-r.rec.daysLeft}d overdue`:`${r.rec.daysLeft}d left`) : ''}`
    : `<span class="tr-code">${r.code}</span> · ${r.safety?'Safety-critical · ':''}Validity ${r.validity} mo`;
  if (r.state === 'missing') return `
    <div class="tr-course-row missing">
      <div class="tr-course-icn miss"><i class="fa-solid fa-xmark"></i></div>
      <div class="tr-course-body"><div class="tr-course-title">${r.title}</div><div class="tr-course-meta">${meta}</div></div>

      <div class="tr-course-body"><div class="tr-course-title">${r.title}</div><div class="tr-course-meta">${meta}</div></div>

route('alerts', ()=>{
  const today = new Date('2026-08-12');
  const buckets = {d90:[],d60:[],d30:[],d7:[],exp:[]};
  EMPS.forEach(e=>{
    ['licExp','eidExp','ppExp'].forEach(k=>{
      if (e[k]==='—') return;
      const d = new Date(e[k]);
      const days = Math.round((d-today)/86400000);
      const doc = k==='licExp'?'Driving Licence':(k==='eidExp'?'Emirates ID':'Passport');
      const item = {emp:e, days, doc, exp:e[k]};
      if (days<0) buckets.exp.push(item);
      else if (days<=7) buckets.d7.push(item);
      else if (days<=30) buckets.d30.push(item);
      else if (days<=60) buckets.d60.push(item);
      else if (days<=90) buckets.d90.push(item);
    });
  });
  const bk = (id, cls, label, sub, items)=>`

/* ---- ROS-04: fixed-position hover/focus tooltip for weekly-cell chips ----
   .fcal-cal has overflow-x:auto, which forces overflow-y to auto too, clipping any absolutely
   positioned tooltip that escapes the row/cell (measured/confirmed for left-column chips).
   position:fixed sidesteps that overflow context entirely (same trick as .fcal-chip-ghost during
   drag), so we position this pill from getBoundingClientRect on pointerenter/focus and tear it
   down on pointerleave/blur. Never intercepts pointer events (pointer-events:none), so it can't
   swallow the drag's pointerdown. */
let fcalTipEl = null;
function fcalChipShowTip(ev){
  const chip = ev.currentTarget;
  const text = chip.getAttribute('data-tip');
  if (!text) return;
  if (!fcalTipEl){ fcalTipEl = document.createElement('div'); fcalTipEl.className = 'fcal-tip-pill'; document.body.appendChild(fcalTipEl); }
  fcalTipEl.textContent = text;
  fcalTipEl.classList.remove('show');
  const r = chip.getBoundingClientRect();
  const pos = chip.getAttribute('data-tip-pos') || 'top';
  requestAnimationFrame(()=>{
    if (!fcalTipEl) return;
    const tw = fcalTipEl.offsetWidth, th = fcalTipEl.offsetHeight;
    let top = pos==='bottom' ? r.bottom + 8 : r.top - 8 - th;
    let left = r.left + r.width/2 - tw/2;
    left = Math.max(6, Math.min(left, window.innerWidth - tw - 6));
    top = Math.max(6, Math.min(top, window.innerHeight - th - 6));
    fcalTipEl.style.left = left+'px';
    fcalTipEl.style.top = top+'px';
    fcalTipEl.classList.add('show');
  });
}
function fcalChipHideTip(){ if (fcalTipEl) fcalTipEl.classList.remove('show'); }

/* ---- ROS-02: pointer-based drag & drop for shift chips (+ keyboard/modal fallback) ---- */
let fcalDrag = null;
function fcalWorkingKind(k){ return k==='S-M'||k==='S-A'||k==='S-N'||k==='warn'; }
function fcalChipPointerDown(ev, emp, day){
  if (ev.button!==undefined && ev.button!==0) return;
  const chipEl = ev.currentTarget;
  const cellEl = chipEl.closest('.fcal-cell');
  fcalDrag = {emp, day, startX:ev.clientX, startY:ev.clientY, chipEl, cellEl, dragging:false, ghost:null};
  document.addEventListener('pointermove', fcalPointerMove);
  document.addEventListener('pointerup', fcalPointerUp, {once:true});
}
function fcalPointerMove(ev){
  if (!fcalDrag) return;
  const dx = ev.clientX-fcalDrag.startX, dy = ev.clientY-fcalDrag.startY;
  if (!fcalDrag.dragging){
    if (Math.hypot(dx,dy) < 6) return;
    fcalDrag.dragging = true;
    fcalChipHideTip();
    const rect = fcalDrag.chipEl.getBoundingClientRect();
    const ghost = fcalDrag.chipEl.cloneNode(true);
    ghost.className = 'fcal-chip fcal-chip-ghost';
    ghost.style.width = rect.width+'px';
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left+'px';
    ghost.style.top = rect.top+'px';
    document.body.appendChild(ghost);
    fcalDrag.ghost = ghost;
    fcalDrag.offX = ev.clientX-rect.left;
    fcalDrag.offY = ev.clientY-rect.top;
    fcalDrag.cellEl.classList.add('dragging-source');
  }
  if (fcalDrag.ghost){
    fcalDrag.ghost.style.left = (ev.clientX-fcalDrag.offX)+'px';
    fcalDrag.ghost.style.top = (ev.clientY-fcalDrag.offY)+'px';
  }
  document.querySelectorAll('.fcal-cell.drop-valid,.fcal-cell.drop-invalid').forEach(c=>c.classList.remove('drop-valid','drop-invalid'));
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const targetCell = el && el.closest ? el.closest('.fcal-cell') : null;
  if (targetCell && targetCell.dataset.emp!==undefined && targetCell!==fcalDrag.cellEl){
    const day = parseInt(targetCell.dataset.day,10);
    const emp = targetCell.dataset.emp;
    const verdict = fcalMoveVerdict(fcalDrag.emp, fcalDrag.day, emp, day);
    targetCell.classList.add(verdict.ok ? 'drop-valid' : 'drop-invalid');
  }
}
function fcalPointerUp(ev){
  document.removeEventListener('pointermove', fcalPointerMove);
  if (!fcalDrag) return;
  const wasDragging = fcalDrag.dragging;
  if (fcalDrag.ghost) fcalDrag.ghost.remove();
  if (fcalDrag.cellEl) fcalDrag.cellEl.classList.remove('dragging-source');
  document.querySelectorAll('.fcal-cell.drop-valid,.fcal-cell.drop-invalid').forEach(c=>c.classList.remove('drop-valid','drop-invalid'));
  if (wasDragging){
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const targetCell = el && el.closest ? el.closest('.fcal-cell') : null;
    if (targetCell && targetCell.dataset.emp!==undefined && targetCell!==fcalDrag.cellEl){
      fcalAttemptMove(fcalDrag.emp, fcalDrag.day, targetCell.dataset.emp, parseInt(targetCell.dataset.day,10));
    }
  }
  fcalDrag = null;
}
// Pure check used both for live hover-highlighting and for the actual drop/modal path.
function fcalMoveVerdict(srcEmp, srcDay, tgtEmp, tgtDay){
  if (srcEmp===tgtEmp && srcDay===tgtDay) return {ok:false, kind:'noop'};
  const tgtRow = rosterLayout && rosterLayout.find(r=>r.emp===tgtEmp);
  if (!tgtRow) return {ok:false, kind:'noop'};
  // Official-status rule: an employee not 'active' (or doc/cert-blocked) cannot be rostered onto at all.
  const tgtEmpObj = EMPS.find(x=>x.id===tgtEmp);
  if (tgtEmpObj && tgtEmpObj.status!=='active' && !tgtEmpObj.status.startsWith('blocked')){
    return {ok:false, kind:'empstatus', status:tgtEmpObj.status};
  }
  const tgtKind = tgtRow.pattern[tgtDay];
  if (fcalWorkingKind(tgtKind)) return {ok:false, kind:'double'};
  if (tgtKind==='blocked')   return {ok:false, kind:'docblocked'};
  if (tgtKind==='block')     return {ok:false, kind:'dayseven'};
  if (tgtKind==='onleave')   return {ok:false, kind:'onleave'};
  if (tgtKind==='holiday')   return {ok:false, kind:'holiday'};
  if (tgtKind==='off')       return {ok:true,  kind:'off'};
  return {ok:true, kind:'empty'};
}
function fcalAttemptMove(srcEmp, srcDay, tgtEmp, tgtDay){
  const v = fcalMoveVerdict(srcEmp, srcDay, tgtEmp, tgtDay);
  const tgtEmpObj = EMPS.find(x=>x.id===tgtEmp);
  const tgtName = tgtEmpObj ? tgtEmpObj.name : tgtEmp;
  const dayName = FCAL_SHORTWK[tgtDay];
  if (v.kind==='noop') return;
  if (v.kind==='empstatus'){ toast(`${tgtName} is ${FCAL_STATUS_LABELS[fcalEmpStatusKey(v.status)]} — cannot be rostered`,'err'); return; }
  if (v.kind==='double'){ toast(`Double assignment blocked — ${tgtName} already has a shift on ${dayName}`,'err'); return; }
  if (v.kind==='docblocked'){ toast('Driver is doc-blocked — TRN-05','err'); return; }
  if (v.kind==='dayseven'){ toast('Day 7 is hard-blocked for this driver — move rejected','err'); return; }
  if (v.kind==='onleave'){ toast(`${tgtName} is on leave on ${dayName} — cannot be rostered`,'err'); return; }
  if (v.kind==='holiday'){ toast(`${dayName} is a public holiday — cannot be rostered`,'err'); return; }
  if (v.kind==='off'){
    modal(`
      <div class="modal" style="max-width:420px">
        <div class="h"><i class="fa-solid fa-triangle-exclamation" style="color:#f79009"></i><h4>Assign on weekly off?</h4><button class="btn ghost" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="b"><p style="color:#475467;font-size:13px;margin:0">This raises an OT approval (ROS-02) for <strong>${tgtName}</strong> on ${dayName}.</p></div>
        <div class="f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="fcalDoMove('${srcEmp}',${srcDay},'${tgtEmp}',${tgtDay},true)">Raise OT approval</button></div>
      </div>`);
    return;
  }
  fcalDoMove(srcEmp, srcDay, tgtEmp, tgtDay, false);
}
function fcalDoMove(srcEmp, srcDay, tgtEmp, tgtDay, ot){
  const srcRow = rosterLayout.find(r=>r.emp===srcEmp);
  const tgtRow = rosterLayout.find(r=>r.emp===tgtEmp);
  if (!srcRow || !tgtRow) return;
  const movedKind = srcRow.pattern[srcDay];
  rosterLastMove = {srcEmp, srcDay, srcKind:movedKind, srcWasOT:rosterOT.has(srcEmp+'|'+srcDay),
                     tgtEmp, tgtDay, tgtKind:tgtRow.pattern[tgtDay], tgtWasOT:rosterOT.has(tgtEmp+'|'+tgtDay)};
  srcRow.pattern[srcDay] = 'empty';
  rosterOT.delete(srcEmp+'|'+srcDay);
  tgtRow.pattern[tgtDay] = movedKind;
  if (ot) rosterOT.add(tgtEmp+'|'+tgtDay); else rosterOT.delete(tgtEmp+'|'+tgtDay);
  rosterDirty = true; // ROS-05: any successful move marks the roster dirty since last publish
  closeModal();
  go('roster');
  toast(ot ? 'Shift moved — OT approval raised' : 'Shift reassigned', 'ok');
  fcalShowUndo();
}
function fcalShowUndo(){
  const old = document.getElementById('fcalUndoPill'); if (old) old.remove();
  if (!rosterLastMove) return;
  const pill = document.createElement('div');
  pill.id = 'fcalUndoPill';
  pill.className = 'fcal-undo-pill';
  pill.innerHTML = `<span>Shift moved</span><button onclick="fcalUndoMove()">Undo</button>`;
  document.body.appendChild(pill);
  setTimeout(()=>{ if (pill.parentNode) pill.remove(); }, 5000);
}
function fcalUndoMove(){
  if (!rosterLastMove) return;
  const m = rosterLastMove;
  const srcRow = rosterLayout.find(r=>r.emp===m.srcEmp);
  const tgtRow = rosterLayout.find(r=>r.emp===m.tgtEmp);
  if (srcRow) srcRow.pattern[m.srcDay] = m.srcKind;
  if (tgtRow) tgtRow.pattern[m.tgtDay] = m.tgtKind;
  m.srcWasOT ? rosterOT.add(m.srcEmp+'|'+m.srcDay) : rosterOT.delete(m.srcEmp+'|'+m.srcDay);
  m.tgtWasOT ? rosterOT.add(m.tgtEmp+'|'+m.tgtDay) : rosterOT.delete(m.tgtEmp+'|'+m.tgtDay);
  rosterLastMove = null;
  const pill = document.getElementById('fcalUndoPill'); if (pill) pill.remove();
  toast('Move undone', 'ok');
  go('roster');
}
// Keyboard / no-drag accessible alternative: click a chip to open a "Move shift" modal.
function fcalOpenMoveModal(emp, day){
  if (!rosterLayout) return;
  const empOpts = rosterLayout.map(r=>{
    const e = EMPS.find(x=>x.id===r.emp);
    return `<option value="${r.emp}"${r.emp===emp?' selected':''}>${e?e.name:r.emp}</option>`;
  }).join('');
  const dayOpts = FCAL_SHORTWK.map((d,i)=>`<option value="${i}"${i===day?' selected':''}>${d}</option>`).join('');
  modal(`
    <div class="modal" style="max-width:420px">
      <div class="h"><i class="fa-solid fa-arrows-up-down-left-right" style="color:var(--blue-500)"></i><h4>Move shift</h4><button class="btn ghost" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="b">
        <div class="field"><label>Driver</label><select id="fcalMoveEmp">${empOpts}</select></div>
        <div class="field"><label>Day</label><select id="fcalMoveDay">${dayOpts}</select></div>
        <div class="hint">Same rules apply as drag-and-drop: double assignment and doc-blocked drivers are rejected; weekly-off targets require OT approval.</div>
      </div>
      <div class="f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="fcalSubmitMoveModal('${emp}',${day})">Move</button></div>
    </div>`);
}
function fcalSubmitMoveModal(srcEmp, srcDay){
  const tgtEmp = document.getElementById('fcalMoveEmp').value;
  const tgtDay = parseInt(document.getElementById('fcalMoveDay').value, 10);
  fcalAttemptMove(srcEmp, srcDay, tgtEmp, tgtDay);
}

route('roster', ()=>{
  const days = ['Mon 11','Tue 12','Wed 13','Thu 14','Fri 15','Sat 16','Sun 17'];
  const shortDays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  // rows: employee × 7 days — seeded once, then hoisted to rosterLayout so drag mutations persist re-renders.
  if (!rosterLayout){
    rosterLayout = [
      {emp:'TJ-4712', pattern:['S-M','S-M','S-M','S-M','S-M','warn','block']}, // 6 consec then day 7
      {emp:'TJ-4288', pattern:['blocked','blocked','blocked','blocked','blocked','blocked','blocked']}, // licence expired
      {emp:'TJ-4103', pattern:['S-M','S-M','off','S-M','S-M','S-M','off']},
      {emp:'TJ-5044', pattern:['S-N','S-N','S-N','S-N','off','S-N','S-N']},
      {emp:'TJ-6154', pattern:['S-A','S-A','S-A','off','S-A','S-A','S-A']},
      {emp:'TJ-7001', pattern:['S-M','onleave','S-M','off','S-M','S-M','S-M']}, // ROS-status: seeded ON LEAVE cell (Tue)
      {emp:'TJ-7002', pattern:['S-A','S-A','holiday','S-A','S-A','S-A','off']}, // ROS-status: seeded PUBLIC HOLIDAY cell (Wed)
      {emp:'TJ-7003', pattern:['S-N','S-N','S-N','S-N','rostergap','S-N','S-N']}, // ROS-status: seeded ROSTER GAP cell (Fri) — leave-approved, uncovered
      {emp:'TJ-7004', pattern:['S-M','off','S-M','S-M','S-A','S-M','off']}, // status:'inactive' demo row
      {emp:'TJ-7005', pattern:['S-A','S-A','S-A','S-A','S-A','off','S-M']}, // status:'resigning' demo row
      {emp:'TJ-7006', pattern:['empty','empty','empty','empty','empty','empty','empty']}, // status:'terminated' — holds no shifts
    ];
  }
  const fullLayout = rosterLayout;
  // ROS-01: LOT selector filters visible rows; full data stays in rosterLayout for mutations.
  const layout = rosterLot === 'All LOTs' ? fullLayout : fullLayout.filter(r=>{
    const e = EMPS.find(x=>x.id===r.emp);
    return e && e.lot === rosterLot;
  });

  // Coverage KPIs computed from the pattern grid (headcount planner hook — ROS-06)
  const workingCells   = layout.flatMap(r=>r.pattern).filter(k=>k==='S-M'||k==='S-A'||k==='S-N'||k==='warn').length;
  const offCells       = layout.flatMap(r=>r.pattern).filter(k=>k==='off').length;
  const blockedCells   = layout.flatMap(r=>r.pattern).filter(k=>k==='blocked').length;
  const hardBlockCells = layout.flatMap(r=>r.pattern).filter(k=>k==='block').length;
  const doubleCount    = 1; // ROS-03: seeded double-assignment conflict (Salim Hassan, Thu 14 Aug)
  const gapCount       = layout.flatMap(r=>r.pattern).filter(k=>k==='rostergap').length; // ROSTER GAP: leave-approved uncovered shift(s)
  const rosterHeadcount = layout.length;
  const totalCells     = rosterHeadcount * 7;
  const validPct       = totalCells ? Math.round(workingCells / totalCells * 100) : 0;
  const offPct         = totalCells ? Math.round(offCells / totalCells * 100) : 0;
  const blockPct       = totalCells ? Math.round((blockedCells + hardBlockCells) / totalCells * 100) : 0;
  const conflictCount  = blockedCells + hardBlockCells + doubleCount + gapCount; // week-level rule violations (ROS-03)

  const shortWk = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dayNums = [11,12,13,14,15,16,17];

  const ICO = './assets/figma-icons/';
  // Figma cell = one or more white chip cards; each chip = icon+label pairs + a status badge.
  // Short labels keep the chips at the Figma proportions ("Sector A" / "Lot 1").
  const CELL_META = {
    'S-M':  {badge:'morning',   label:'Morning Shift',   icon:'shift-morning.svg',  route:'Route A'},
    'S-A':  {badge:'afternoon', label:'Mid Day Shift',   icon:'shift-midday.svg',   route:'Route B'},
    'S-N':  {badge:'night',     label:'Night Shift',     icon:'shift-night.svg',    route:'Route N'},
  };
  // items: array of {icon:'fa-...', text} for BRD-field lines, or plain strings for the simple
  // off/block/blocked cells (rendered with the legacy skew icon).
  const chip = (items, badgeCls, badgeText, icon, draggable, ot, tip, tipPos, stKey)=>`
    <div class="fcal-chip"${draggable?` tabindex="0" onpointerdown="fcalChipPointerDown(event,'${draggable.emp}',${draggable.day})" onclick="if(!fcalDrag||!fcalDrag.dragging) fcalOpenMoveModal('${draggable.emp}',${draggable.day})"`:''}${tip?` data-tip="${tip.replace(/"/g,'&quot;')}"${tipPos?` data-tip-pos="${tipPos}"`:''} onpointerenter="fcalChipShowTip(event)" onpointerleave="fcalChipHideTip(event)" onfocus="fcalChipShowTip(event)" onblur="fcalChipHideTip(event)"`:''}>
      ${stKey ? fcalStatus(stKey) : `<div class="fcal-badge ${badgeCls}">${icon?`<img src="./assets/figma-icons/${icon}" alt="">`:''}<span>${badgeText}</span></div>`}
      ${items.map(t=>typeof t==='string'
        ? `<div class="fcal-chip-item"><img src="${ICO}skew.svg" alt=""><span>${t}</span></div>`
        : `<div class="fcal-chip-item"><i class="${t.icon}"></i><span>${t.text}</span></div>`
      ).join('')}
      ${ot?fcalStatus('otpending'):''}
    </div>`;

  // ROS-02: `draggable` carries {emp,day} for chips that can be picked up and moved.
  // ROS-04: shift cells show only the two highest-priority job-assignment fields on the card
  // itself — Route (the work) and Vehicle plate (the asset) — beyond the employee/date/shift
  // already conveyed by row, column header, and badge. The remaining fields (supervisor, sector,
  // depot, full vehicle string) move to a hover/focus tooltip (global [data-tip] system) and stay
  // fully available, always, via the job-card modal (fcalOpenJobCard). All fields are derived via
  // fcalJobFields so the card, tooltip, and modal never disagree.
  const cellHtml = (kind, e, draggable, rowIdx)=>{
    if (kind==='empty')     return ''; // moved-away source cell — bare #f9fafb background, no chip
    if (kind==='off')       return chip(['Weekly off'], 'off', 'Off', null); // OFF is not part of the official 15-status set — kept as-is
    if (kind==='block')     return chip(['Rest due'], null, null, null, null, false, null, null, 'dayseven');
    if (kind==='blocked')   return chip(['Licence expired'], null, null, null, null, false, null, null, 'docblock');
    if (kind==='onleave')   return chip(['Annual leave'], null, null, null, null, false, null, null, 'onleave');
    if (kind==='holiday')   return chip(['Eid Al Fitr'], null, null, null, null, false, null, null, 'holiday');
    if (kind==='rostergap') return chip(['Cover required'], null, null, null, null, false, null, null, 'rostergap');
    const cellKind = kind==='warn' ? 'S-M' : kind;
    const m = CELL_META[cellKind] || CELL_META['S-M'];
    const geom = fcalDailyGeom(cellKind) || fcalDailyGeom('S-M');
    const jf = fcalJobFields(e, geom);
    const ot = draggable && rosterOT.has(draggable.emp+'|'+draggable.day);
    const items = [
      {icon:'fa-solid fa-route',       text: jf.route},

    const tip = `Supervisor · ${jf.supervisor} · Sector · ${jf.sector} · Depot · ${jf.depot} · ${jf.vehicleFull}`;
    const tipPos = rowIdx===0 ? 'bottom' : 'top';
    return chip(items, m.badge, m.label, m.icon, draggable, ot, tip, tipPos);
  };

  // Day-header row (Figma Frame 12) — weekday label + date number, today tinted #22c882.
  const dayHdr = shortWk.map((d,i)=>`
    <div class="fcal-day${i===0?' today':''}">
      <div class="in"><span class="wd">${d}</span><span class="nu">${dayNums[i]}</span></div>
    </div>`).join('');

  // Left "Drivers" column (Figma "Inspectors") — one 154px card per driver.

    // Card is a fixed 154px — the official-status badge (fcalStatus) replaces the old
    // "Utilization: N%" pill (not part of the 15-status set); the % moves into the Shifts
    // metric label so it stays visible without growing the card.
    return `

        <div class="fcal-emp-top">
          <div class="fcal-emp-av" style="background:${e.color||'#0072D6'}">${initials}</div>

        </div>
        ${fcalStatus(fcalEmpStatusKey(e.status))}
        <div class="fcal-emp-metric">
          <span class="k">Shifts · ${util}%</span>

            <div class="bar"><i style="width:${util}%"></i></div>
            <span class="v">${worked}/7</span>

        </div>
        <div class="fcal-emp-metric">
          <span class="k">Hours</span>
          <span class="v"><img src="${ICO}clock-sm.svg" alt="">${hours}h 00min</span>
        </div>
        <div class="fcal-emp-metric">
          <span class="k">Idle time</span>
          <span class="v"><img src="${ICO}hourglass-02.svg" alt="">${idle}h 00min</span>
        </div>
      </div>`;
  }).join('');

  // Calendar body is column-major (Figma stacks Cards inside a per-day column).
  const colHtml = shortWk.map((_,di)=>`
    <div class="fcal-col">
      ${layout.map((r,ri)=>{
        const e = EMPS.find(x=>x.id===r.emp);
        const kind = r.pattern[di];
        const draggable = fcalWorkingKind(kind) ? {emp:r.emp, day:di} : null;
        return `<div class="fcal-cell" data-emp="${r.emp}" data-day="${di}">${cellHtml(kind, e, draggable, ri)}</div>`;

    </div>`).join('');

  // ROS-04: daily hour-timeline board (Monday only, per BRD daily job assignment view)
  const dailyHourHdr = Array.from({length: ROSTER_DAILY_END - ROSTER_DAILY_START + 1}, (_,i)=>{
    const h = ROSTER_DAILY_START + i;
    return `<div class="fcal-d-hour"><span class="wd">${String(h).padStart(2,'0')}:00</span></div>`;
  }).join('');
  const dailyWindow = ROSTER_DAILY_END - ROSTER_DAILY_START;
  const dailyRows = layout.map(r=>{
    const e = EMPS.find(x=>x.id===r.emp);
    const kind = r.pattern[0]; // Monday = pattern index 0
    let inner = '';
    if (kind==='off'){
      inner = `<div class="fcal-d-off">Weekly off</div>`;

      const geom = fcalDailyGeom(kind);

      <div class="fcal-d-gridlines">${Array.from({length: ROSTER_DAILY_END - ROSTER_DAILY_START + 1}, ()=>'<i></i>').join('')}</div>

  const totalGridCells   = layout.length * 7;

  const missingPct       = totalGridCells ? Math.round(missingCells / totalGridCells * 100) : 0;
  const conflictPct      = totalGridCells ? Math.round(conflictCount / totalGridCells * 100) : 0;
  const shownDrivers     = layout.length;

              </span>

          </div>
          <button class="fcal-hd-plus" onclick="toast('New view','info')" data-tip="New view">
            <img src="./assets/figma-icons/hd-plus.svg" alt="">
          </button>
        </div>
        <div class="fcal-hd-right">
          <span class="fcal-pub-tag ${!rosterPublished?'draft':(rosterDirty?'pending':'published')}">${!rosterPublished?'Draft':(rosterDirty?'Changes pending republish':'Published')}</span>
          <button class="ros-secondary-btn fcal-hd-btn" onclick="toast('Roster saved as draft','ok')"><i class="fa-regular fa-floppy-disk"></i> Save draft</button>
          <button class="ros-primary-btn fcal-hd-btn${rosterPublished && rosterDirty?' pub-dot':''}"${rosterPublished && !rosterDirty?' style="opacity:.65"':''} onclick="fcalPublishRoster()"><i class="fa-solid fa-paper-plane"></i> ${rosterPublished ? (rosterDirty ? 'Republish' : 'Published ✓') : 'Publish'}</button>
        </div>
      </div>

      <!-- Toolbar row 1 · search + filter — Figma 554:20373 -->
      <div class="fcal-tools">
        <div class="fcal-tools-l">
          <div class="fcal-search">
            <img src="./assets/figma-icons/search-refraction.svg" alt="">
            <input type="text" placeholder="Search anything here">
          </div>
          <button class="fcal-filter" onclick="toast('Filter panel opened','info')" title="Filter">
            <img src="./assets/figma-icons/filter-funnel-02.svg" alt="">
          </button>
          <select class="fcal-lot" title="Filter by LOT" onchange="setRosterLot(this.value)">
            ${['LOT 4','LOT 3','LOT 5','All LOTs'].map(l=>`<option value="${l}"${rosterLot===l?' selected':''}>${l==='LOT 4'?'LOT 4 (Musaffah)':l}</option>`).join('')}
          </select>
        </div>

      <!-- Toolbar row 2 · Weekly/Daily segmented + date navigator — Figma 554:20383 -->
      <div class="fcal-row2">
        <div class="fcal-row2-l">
          <div class="fcal-seg">
            <button class="${rosterMode==='weekly'?'active':''}" onclick="setRosterMode('weekly')">Weekly</button>
            <button class="${rosterMode==='daily'?'active':''}" onclick="setRosterMode('daily')">Daily</button>
          </div>
          <div class="fcal-datenav">
            <img class="chev" src="./assets/figma-icons/chevron-selector-horizontal.svg" alt="">
            <div class="lbl">
              ${rosterMode==='daily' ? `<span class="range">Mon, 11 Aug 2026</span>` : `<span class="range">10 Aug, 2026 - 16 Aug, 2026</span><span class="sub">( Week 33 )</span>`}
            </div>

        </div>
      </div>

      <!-- KPI cards — Figma 554:20395 -->
      <div class="fcal-kpis">
        <div class="fcal-kpi">
          <div class="av" style="background:#f4edf7"><img src="./assets/figma-icons/bar-line-chart.svg" alt=""></div>
          <div class="txt"><div class="l">Shift-cell coverage</div><div class="v">${validPct}%</div></div>
        </div>
        <div class="fcal-kpi">
          <div class="av" style="background:#e6f1fb"><img src="./assets/figma-icons/clock-fast-forward.svg" alt=""></div>
          <div class="txt"><div class="l">Total Shifts</div><div class="v">${workingCells}</div></div>
        </div>
        <div class="fcal-kpi">
          <div class="av" style="background:#ecfdf3"><img src="./assets/figma-icons/check-circle-broken.svg" alt=""></div>
          <div class="txt"><div class="l">Rostered Drivers</div><div class="v">${rosterHeadcount}</div></div>
        </div>
        <div class="fcal-kpi">
          <div class="av" style="background:#fef3f2"><img src="./assets/figma-icons/alert-octagon.svg" alt=""></div>
          <div class="txt"><div class="l">Blocked Cells</div><div class="v">${blockedCells + hardBlockCells}</div></div>
        </div>
      </div>

      ${conflictCount > 0 ? `
        <div class="ros-alert">

function leavePlannerView(){
  // Fixed August 2026 grid — 1 Aug = Saturday. Show 6 weeks from 26 Jul (last week of Jul out-of-month).
  const firstOfMonth = new Date(2026, 7, 1);
  const startWeekday = firstOfMonth.getDay(); // 0=Sun
  const gridStart = new Date(2026, 6, 26); // start on 26 Jul (Sunday)
  const days = [];
  for (let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(d.getDate()+i);
    days.push(d);
  }
  const iso = d => d.toISOString().slice(0,10);
  const inMonth = d => d.getMonth()===7 && d.getFullYear()===2026;
  const dayLeaves = d => LEAVES.filter(l => l.status==='approved' && l.from<=iso(d) && l.to>=iso(d));
  const holidayFor = d => UAE_HOLIDAYS_AUG_2026.find(h=>h.d===iso(d));
  const today = iso(new Date(2026,7,13));

  return `
    <div class="lve-planner-toolbar">
      <div class="lve-month-nav">
        <button class="btn" data-tip="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="lbl">August 2026</div>
        <button class="btn" data-tip="Next month"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <select class="ros-depot" style="min-width:180px" data-tip="Filter approved leave by LOT · scope respects your role"><option>LOT 4 · Musaffah</option><option>LOT 3 · Al Wathba</option><option>LOT 5 · Al Ain</option><option>All LOTs</option></select>
      <div style="margin-left:auto;font-size:11.5px;color:var(--ink-3)" data-tip="Federal public holidays declared by UAE Cabinet · auto-refreshed yearly"><i class="fa-regular fa-calendar" style="color:var(--primary);margin-right:5px"></i>Public holidays overlay: UAE 2026</div>
    </div>

    <div class="lve-cal">
      <div class="lve-cal-hd">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="lve-cal-grid">
        ${days.map(d=>{
          const im = inMonth(d);
          const hol = holidayFor(d);
          const abs = dayLeaves(d);
          const clsList = ['lve-cal-day'];
          if (!im) clsList.push('out');
          if (hol) clsList.push('holiday');
          if (iso(d)===today) clsList.push('today');
          const chips = abs.slice(0,3).map(l=>{
            const e = EMPS.find(x=>x.id===l.emp) || {name:l.emp};
            return `<div class="lve-cal-chip ${l.type}" onclick="event.stopPropagation();showLeaveTrail('${l.id}')" title="${e.name} · ${(UAE_LEAVE_TYPES.find(t=>t.id===l.type)||{}).label||l.type}">${e.name.split(' ')[0]} · ${l.type.slice(0,3).toUpperCase()}</div>`;
          }).join('');
          const more = abs.length>3 ? `<div class="lve-cal-chip more">+${abs.length-3} more</div>` : '';
          return `<div class="${clsList.join(' ')}">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span class="dnum">${d.getDate()}</span>
              ${hol?`<i class="fa-solid fa-star" style="color:var(--amber-500);font-size:9px"></i>`:''}
            </div>
            ${hol?`<div class="hol">${hol.name.split(' ').slice(0,2).join(' ')}</div>`:''}
            ${chips}${more}
          </div>`;
        }).join('')}
      </div>
      <div class="lve-cal-legend">
        <span><i class="sw" style="background:var(--blue-500)"></i>Annual</span>
        <span><i class="sw" style="background:var(--red-500)"></i>Sick</span>
        <span><i class="sw" style="background:var(--amber-500)"></i>Casual</span>
        <span><i class="sw" style="background:var(--ink-3)"></i>Unpaid</span>
        <span><i class="sw" style="background:#FEF3E6;border:1px solid var(--amber-500)"></i>Public holiday</span>
      </div>
    </div>
  `;
}

  if (openLeaveId) return renderLeaveDetail();
  const counts = {
    pending: LEAVES.filter(x=>x.status==='pending').length,
    endorsed: LEAVES.filter(x=>x.status==='endorsed').length,
  };
  const openCount = counts.pending + counts.endorsed;
  const exitsOpen = EXITS.filter(x=>x.status!=='complete').length;
  const encReady  = EXITS.filter(x=>x.encashment.status==='ready').length;
  return `

        <button class="tab${leaveView==='planner'?' active':''}" onclick="setLeaveView('planner')" data-tip="LVE-04 · month grid of approved leave + UAE public holidays">Monthly Planner</button>
        <button class="tab${leaveView==='exits'?' active':''}" onclick="setLeaveView('exits')" data-tip="LVE-05 · exit tracker · notice / clearance / settlement / camp bed release">Exits${exitsOpen>0?`<span class="cnt" data-tip="${exitsOpen} active exit${exitsOpen>1?'s':''}">${exitsOpen}</span>`:''}</button>

/* --- Exits view (LVE-05) ------------------------------------------------- */
function leaveExitsView(){
  const filtered = exitStatusFilter==='all' ? EXITS : EXITS.filter(x=>x.status===exitStatusFilter);
  const counts = {
    all: EXITS.length,
    notice: EXITS.filter(x=>x.status==='notice').length,
    clearance: EXITS.filter(x=>x.status==='clearance').length,
    settlement: EXITS.filter(x=>x.status==='settlement').length,
    complete: EXITS.filter(x=>x.status==='complete').length,
  };
  const inNoticeCount = EXITS.filter(x=>['notice','clearance','settlement'].includes(x.status)).length;
  const clrPending = EXITS.filter(x=>x.status==='clearance').length;
  const overdueCount = EXITS.filter(x=>{
    const lwd = new Date(x.lwd); const today = new Date(2026,7,18);
    return x.status!=='complete' && lwd < today;
  }).length;
  const readyForPayroll = EXITS.filter(x=>x.encashment.status==='ready' || x.encashment.status==='in-payroll').length;

  const clrDots = (cl)=>{
    const gates = [
      {k:'it',      lbl:'IT',      tip:'IT clearance · laptop, VPN, email, licences'},
      {k:'hr',      lbl:'HR',      tip:'HR clearance · leave balance, final letter, gratuity calc'},
      {k:'camp',    lbl:'Camp',    tip:'Camp checkout · bed handover, room inspection'},
      {k:'assets',  lbl:'Assets',  tip:'Assets return · uniform, ID card, keys, PPE'},
      {k:'finance', lbl:'Finance', tip:'Finance clearance · loans, advances, cash card'},
    ];
    return `<div class="clr-dots">${gates.map(g=>{
      const st = cl[g.k] || 'pending';
      const icon = st==='done' ? '<i class="fa-solid fa-check"></i>' : (st==='na' ? '<i class="fa-solid fa-minus"></i>' : g.lbl[0]);
      return `<span class="clr-dot ${st}" data-tip="${g.lbl} · ${st==='done'?'complete':st==='na'?'not applicable':'pending'} · ${g.tip}">${icon}</span>`;
    }).join('')}</div>`;
  };

  const lwdChip = (lwd)=>{
    const target = new Date(lwd); const today = new Date(2026,7,18);
    const days = Math.round((target-today)/86400000);
    const cls = days<0?'past':(days===0?'today':(days<=7?'near':'far'));
    const label = days<0?`${Math.abs(days)}d ago`:(days===0?'Today':`${days}d left`);
    return `<span class="lwd-chip ${cls}" data-tip="Last working day · ${lwd}"><i class="fa-regular fa-calendar-check"></i>${label}</span>`;
  };

  const exitRow = (x)=>{
    const e = EMPS.find(m=>m.id===x.emp) || {name:x.emp, id:x.emp, role:'—', color:'#0072D6'};
    const initials = e.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
    const reasonMap = {resignation:'Resignation', termination:'Termination', 'contract-end':'End of Contract', retirement:'Retirement'};
    const statusMap = {notice:'In Notice', clearance:'Clearance', settlement:'Settlement', complete:'Complete', 'on-hold':'On Hold'};
    return `<tr onclick="toast('Exit detail · coming in build phase','info')" style="cursor:pointer">
      <td>
        <div class="lve-emp-cell">
          <div class="av" style="background:${e.color||'#0072D6'}">${initials}</div>
          <div><div class="nm">${e.name}</div><div class="id">${x.id} · ${e.id} · ${e.role}</div></div>
        </div>
      </td>
      <td><span class="ex-reason ${x.reason}" data-tip="Reason for exit · drives clearance rules and settlement gate">${reasonMap[x.reason]}</span></td>
      <td>${x.noticeStart} → ${x.lwd}<div style="margin-top:4px">${lwdChip(x.lwd)}</div></td>
      <td>${clrDots(x.checklist)}</td>
      <td>${x.camp.checkout
          ? `<span data-tip="Bed released ${x.camp.checkout}"><i class="fa-solid fa-bed" style="color:var(--green-500);margin-right:5px"></i>${x.camp.room} · out</span>`
          : `<span data-tip="Bed still occupied · releases on last working day per LVE-05"><i class="fa-solid fa-bed" style="color:var(--amber-500);margin-right:5px"></i>${x.camp.room}</span>`}</td>
      <td><span class="ex-stat ${x.status}" data-tip="${x.status==='notice'?'Serving notice period':x.status==='clearance'?'Clearance checklist in progress':x.status==='settlement'?'Settlement gate — awaiting Finance':x.status==='complete'?'Exit complete · bed released · encashment paid':'Held pending exception'}">${statusMap[x.status]}</span></td>
      <td style="text-align:right"><i class="fa-solid fa-chevron-right" style="color:var(--ink-3);font-size:11px"></i></td>
    </tr>`;
  };

  return `
    <div class="lve-kpis">
      <div class="lve-kpi" data-tip="Active exits · employees currently in the DF-04 exit workflow" data-tip-pos="bottom"><div class="lbl">Active exits</div><div class="val">${inNoticeCount}</div><div class="sub">Notice · Clearance · Settlement</div></div>
      <div class="lve-kpi" data-tip="Exits with checklist gates still pending" data-tip-pos="bottom"><div class="lbl">Clearance pending</div><div class="val amber">${clrPending}</div><div class="sub">Any of IT / HR / Camp / Assets / Finance</div></div>
      <div class="lve-kpi" data-tip="Exits past their last working day but not yet closed · escalated" data-tip-pos="bottom"><div class="lbl">Past LWD · open</div><div class="val red">${overdueCount}</div><div class="sub">Auto-escalates to Ops Manager</div></div>
      <div class="lve-kpi" data-tip="Encashment calcs ready to hand off to Oracle payroll" data-tip-pos="bottom"><div class="lbl">Ready for payroll</div><div class="val green">${readyForPayroll}</div><div class="sub">LVE-06 hand-off queue</div></div>
    </div>

    <div class="lve-panel">
      <div class="lve-panel-hd">
        <div>
          <h3>Exits &amp; Clearance</h3>
          <div class="sub">LVE-05 · exit tracker with notice / clearance / settlement gates · camp bed auto-releases on LWD</div>
        </div>
        <div class="spacer"></div>
        <div class="lve-status-pills">
          <button class="${exitStatusFilter==='all'?'active':''}" onclick="setExitStatus('all')" data-tip="Every exit record">All (${counts.all})</button>
          <button class="${exitStatusFilter==='notice'?'active':''}" onclick="setExitStatus('notice')" data-tip="Serving notice period · clearance not yet started">Notice (${counts.notice})</button>
          <button class="${exitStatusFilter==='clearance'?'active':''}" onclick="setExitStatus('clearance')" data-tip="Clearance checklist in progress across 5 gates">Clearance (${counts.clearance})</button>
          <button class="${exitStatusFilter==='settlement'?'active':''}" onclick="setExitStatus('settlement')" data-tip="Awaiting Finance settlement + encashment payout">Settlement (${counts.settlement})</button>
          <button class="${exitStatusFilter==='complete'?'active':''}" onclick="setExitStatus('complete')" data-tip="Exit closed · bed released · settlement paid">Complete (${counts.complete})</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Employee</th><th>Reason</th><th>Notice period</th><th>Clearance gates</th><th>Camp bed</th><th>Status</th><th></th></tr></thead>
        <tbody>${filtered.map(exitRow).join('')}</tbody>
      </table>
    </div>
  `;
}

/* --- Encashment view (LVE-06) -------------------------------------------- */
function leaveEncashmentView(){
  const filtered = encStatusFilter==='all' ? EXITS : EXITS.filter(x=>x.encashment.status===encStatusFilter);
  const counts = {
    all: EXITS.length,
    'pending-calc': EXITS.filter(x=>x.encashment.status==='pending-calc').length,
    ready:          EXITS.filter(x=>x.encashment.status==='ready').length,
    'in-payroll':   EXITS.filter(x=>x.encashment.status==='in-payroll').length,
    paid:           EXITS.filter(x=>x.encashment.status==='paid').length,
    held:           EXITS.filter(x=>x.encashment.status==='held').length,
  };
  const totalPending = EXITS.filter(x=>['ready','in-payroll','pending-calc'].includes(x.encashment.status)).reduce((s,x)=>s+x.encashment.net,0);
  const paidThisMonth = EXITS.filter(x=>x.encashment.status==='paid').reduce((s,x)=>s+x.encashment.net,0);
  const heldAmount = EXITS.filter(x=>x.encashment.status==='held').reduce((s,x)=>s+x.encashment.gross,0);
  const readyAmount = EXITS.filter(x=>x.encashment.status==='ready').reduce((s,x)=>s+x.encashment.net,0);
  const fmt = n => n.toLocaleString('en-AE', {minimumFractionDigits:0, maximumFractionDigits:0});

  const statusMap = {'pending-calc':'Pending Calc', ready:'Ready for Payroll', 'in-payroll':'In Oracle', paid:'Paid', held:'On Hold'};

  const encRow = (x)=>{
    const e = EMPS.find(m=>m.id===x.emp) || {name:x.emp, id:x.emp, role:'—', color:'#0072D6'};
    const initials = e.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
    const canPush = x.encashment.status==='ready';
    return `<tr>
      <td>
        <div class="lve-emp-cell">
          <div class="av" style="background:${e.color||'#0072D6'}">${initials}</div>
          <div><div class="nm">${e.name}</div><div class="id">${x.id} · ${e.id} · ${e.role}</div></div>
        </div>
      </td>
      <td><span data-tip="Unused leave balance at last working day · Annual leave only per LVE-06">${x.encashment.days} day${x.encashment.days===1?'':'s'}</span></td>
      <td data-tip="Daily rate = (basic salary + housing allowance) ÷ 30 · from HR master"><span class="amt"><span class="cur">AED</span>${fmt(x.encashment.rate)}</span></td>
      <td data-tip="Gross = days × daily rate"><span class="amt"><span class="cur">AED</span>${fmt(x.encashment.gross)}</span></td>
      <td data-tip="Loan / advance recoveries deducted at Finance clearance"><span class="amt" style="color:${x.encashment.deductions?'var(--red-500)':'var(--ink-3)'}"><span class="cur">AED</span>${fmt(x.encashment.deductions)}</span></td>
      <td data-tip="Net payable to employee's payroll account"><span class="amt" style="color:var(--primary);font-size:14px"><span class="cur">AED</span>${fmt(x.encashment.net)}</span></td>
      <td><span class="enc-stat ${x.encashment.status}" data-tip="${x.encashment.status==='pending-calc'?'Waiting on HR to finalise leave balance':x.encashment.status==='ready'?'Calc verified · ready to push to Oracle payroll':x.encashment.status==='in-payroll'?'Handed off to Oracle · awaiting payment run':x.encashment.status==='paid'?'Paid to employee · GL posted':'Payment held pending exception (see exit notes)'}">${statusMap[x.encashment.status]}</span></td>
      <td style="text-align:right">
        ${canPush
          ? `<button class="ros-primary-btn" style="height:28px;padding:0 10px;font-size:11.5px" onclick="event.stopPropagation();toast('Pushed ${x.id} to Oracle payroll queue','ok')" data-tip="Hand off calc to Oracle payroll (LVE-06 §7.5)"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px"></i> Push</button>`
          : `<i class="fa-solid fa-chevron-right" style="color:var(--ink-3);font-size:11px"></i>`}
      </td>
    </tr>`;
  };

  return `
    <div class="lve-kpis">

/* --- Leave detail page (Tadweer "Issues Reported" pattern) --------------- */
function renderLeaveDetail(){
  const l = LEAVES.find(x=>x.id===openLeaveId); if (!l) return '';
  const e = EMPS.find(x=>x.id===l.emp) || {name:l.emp, id:l.emp, role:'—', color:'#0072D6', depot:'—', lot:'—'};
  const t = UAE_LEAVE_TYPES.find(x=>x.id===l.type) || {label:l.type};
  const initials = e.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const statusText = ({pending:'Pending endorsement', endorsed:'Awaiting approval', approved:'Approved', rejected:'Rejected'})[l.status];
  const isOpen = l.status==='pending' || l.status==='endorsed';
  const nextAction = l.status==='pending' ? 'Endorse' : 'Approve';

  // Roster-impact week strip (Mon–Sun of the request start date)
  const fromDate = new Date(l.from);
  const day0 = new Date(fromDate); day0.setDate(day0.getDate() - ((fromDate.getDay()+6)%7)); // Monday
  const shortWk = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const strip = shortWk.map((d,i)=>{
    const dd = new Date(day0); dd.setDate(dd.getDate()+i);
    const iso = dd.toISOString().slice(0,10);
    const inRange = iso >= l.from && iso <= l.to;
    const isHoliday = UAE_HOLIDAYS_AUG_2026.find(h=>h.d===iso);
    const cls = inRange ? 'affected' : (isHoliday ? 'holiday' : (i>=5 ? 'off' : ''));
    const badge = inRange ? 'IMPACT' : (isHoliday ? 'HOLIDAY' : (i>=5 ? 'OFF' : 'OK'));
    return `<div class="lve-impact-day ${cls}">
      <div class="d">${d}</div>
      <div class="n">${dd.getDate()}</div>
      <div class="badge">${badge}</div>
    </div>`;
  }).join('');

  // Related requests: same employee OR overlapping range
  const related = LEAVES.filter(x=>x.id!==l.id && (x.emp===l.emp || (x.from<=l.to && x.to>=l.from))).slice(0,6);

  const tabs = leaveDetailTabs.map(tid=>{
    const item = LEAVES.find(x=>x.id===tid); if (!item) return '';
    const isActive = tid===openLeaveId;
    return `<div class="lve-detail-tab ${isActive?'':'inactive'}" onclick="switchLeaveTab('${tid}')">
      <span class="close" onclick="event.stopPropagation();closeLeaveDetail('${tid}')" data-tip="Close ${tid}"><i class="fa-solid fa-xmark"></i></span>
      <div class="meta"><span class="sub">Leave Request</span><span class="id">${tid}</span></div>
    </div>`;
  }).join('');

  return `
    <div class="lve-detail">
      <div class="lve-detail-tabs">${tabs}</div>
      <div class="lve-detail-body">
        <div class="lve-detail-main">
          <div class="lve-detail-hd">
            <div class="lve-detail-hd-l">
              <div class="lve-detail-idrow">
                <span class="idpill"><i class="fa-solid fa-hashtag"></i>${l.id}</span>
                <span class="idbadge"><i class="fa-regular fa-calendar" style="color:var(--primary)"></i>Leave Request</span>
                ${l.onBehalf?'<span class="idbadge" data-tip="Filed on-behalf by a supervisor"><i class="fa-solid fa-user-tag" style="color:var(--ink-3)"></i>On-behalf</span>':''}
              </div>
              <div class="lve-detail-title">${t.label} · ${e.name}</div>
            </div>
            <div class="lve-detail-hd-r">
              <div class="lve-status-badge ${l.status}" data-tip="${statusTooltip(l.status)}" data-tip-pos="bottom">${statusText}</div>
              <button class="collapse" onclick="closeLeaveDetail('${l.id}')" data-tip="Close detail · back to register" data-tip-pos="bottom"><i class="fa-solid fa-angles-right"></i></button>
            </div>
          </div>

          <div class="lve-meta-grid">
            <div class="lve-meta"><span class="k">Leave Type</span><span class="v"><span class="lve-type ${l.type}">${t.label}</span></span></div>
            <div class="lve-meta"><span class="k">Submitted On</span><span class="v">${l.submitted}</span></div>
            <div class="lve-meta"><span class="k">Reported By</span><span class="v"><span class="av" style="background:${e.color||'#0072D6'}">${initials}</span>${e.name}${l.onBehalf?' <span style="color:var(--ink-3);font-weight:500">· on-behalf</span>':''}</span></div>
            <div class="lve-meta"><span class="k">Duration</span><span class="v">${l.days} day${l.days>1?'s':''}<span style="color:var(--ink-3);font-weight:500;margin-left:6px">· ${l.from} → ${l.to}</span></span></div>
            <div class="lve-meta"><span class="k">Roster Impact</span><span class="v">${l.impact>0?`<span class="lve-impact"><i class="fa-solid fa-triangle-exclamation"></i>${l.impact} shift${l.impact>1?'s':''}</span>`:'<span class="lve-impact none">No impact</span>'}</span></div>
            <div class="lve-meta"><span class="k">SLA</span><span class="v">${isOpen?`<span class="lve-sla ${l.sla<=6?'brk':(l.sla<=16?'warn':'ok')}"><i class="fa-regular fa-clock"></i>${l.sla}h remaining</span>`:'<span style="color:var(--ink-3);font-weight:500">Closed · no SLA</span>'}</span></div>
            <div class="lve-meta"><span class="k">Linked Employee</span><span class="v"><a href="javascript:void(0)" class="link" onclick="empProfile('${e.id}')">${e.id} <i class="fa-solid fa-arrow-up-right-from-square"></i></a></span></div>
            <div class="lve-meta"><span class="k">Depot · LOT</span><span class="v">${e.depot||'—'} · ${e.lot||'—'}</span></div>
          </div>

          <div class="lve-impact-card">
            <div class="hd">
              <h4>Affected week · shift-level impact</h4>

            </div>
            <div class="lve-impact-strip">${strip}</div>

          <div class="lve-section">

              <i class="fa-solid fa-chevron-down caret"></i>
              <h3>Employee Details</h3>
            </div>
            <div class="lve-section-body">
              <div class="row-item"><span class="k">Name</span><span class="v"><i class="fa-regular fa-user"></i>${e.name}</span></div>
              <div class="row-item"><span class="k">Employee ID</span><span class="v"><i class="fa-solid fa-id-badge"></i>${e.id}</span></div>
              <div class="row-item"><span class="k">Role</span><span class="v"><i class="fa-solid fa-briefcase"></i>${e.role}</span></div>
              <div class="row-item"><span class="k">Shift</span><span class="v"><i class="fa-regular fa-clock"></i>${e.shift?(SHIFTS.find(s=>s.id===e.shift)||{}).name||e.shift:'—'}</span></div>
              <div class="row-item"><span class="k">Depot</span><span class="v"><i class="fa-solid fa-location-dot"></i>${e.depot||'—'}</span></div>
              <div class="row-item"><span class="k">LOT</span><span class="v"><i class="fa-solid fa-layer-group"></i>${e.lot||'—'}</span></div>
            </div>
          </div>

          <div class="lve-section">
            <div class="lve-section-hd" onclick="this.parentElement.classList.toggle('collapsed')">
              <i class="fa-solid fa-chevron-down caret"></i>
              <h3>Request Details</h3>
            </div>
            <div class="lve-section-body" style="grid-template-columns:1fr;gap:14px">
              ${l.note?`<div class="lve-note-block" style="margin:0"><h4>Notes</h4><div class="note">${l.note}</div></div>`:''}
              <div class="lve-atts">
                <h4>Attachments</h4>
                <div class="lve-atts-row">
                  ${l.type==='sick' && l.days>2 ? `
                    <div class="lve-att-tile" data-tip="Medical certificate · required for Sick Leave > 2 days"><i class="fa-solid fa-file-medical" style="color:var(--red-500)"></i><div class="nm">MC · 2 pages</div></div>
                    <div class="lve-att-tile" data-tip="Prescription attachment"><i class="fa-solid fa-file-image" style="color:var(--blue-500)"></i><div class="nm">rx.jpg</div></div>
                  ` : `<div class="lve-att-tile" data-tip="No attachments · optional for this leave type"><i class="fa-regular fa-file-lines"></i><div class="nm">None</div></div>`}
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="lve-detail-side">
          ${isOpen?`<div class="lve-side-action">
            <button class="btn reject" onclick="toast('Request ${l.id} rejected','warn');closeLeaveDetail('${l.id}')" data-tip="Reject with reason · notifies employee"><i class="fa-solid fa-xmark"></i> Reject</button>
            <button class="btn approve" onclick="toast('Request ${l.id} ${nextAction.toLowerCase()}d · roster gap flagged','ok');closeLeaveDetail('${l.id}')" data-tip="${nextAction} and advance to the next DF-04 step"><i class="fa-solid fa-check"></i> ${nextAction}</button>
          </div>`:''}

          <div class="lve-side-tabs">
            <button class="tab${leaveDetailSide==='timeline'?' active':''}" onclick="setLeaveDetailSide('timeline')" data-tip="DF-04 workflow trail · every step with timestamps and notes">Timeline<span class="cnt">${l.trail.length}</span></button>
            <button class="tab${leaveDetailSide==='related'?' active':''}" onclick="setLeaveDetailSide('related')" data-tip="Other requests by same employee or overlapping this range">Related Requests<span class="cnt">${related.length}</span></button>
          </div>

          <div class="lve-side-body">
            ${leaveDetailSide==='timeline' ? `
              <div class="lve-day-hd">Today · 18 Aug 2026</div>
              ${l.trail.map(s=>`
                <div class="lve-tl-item">
                  <div class="lve-tl-icon ${s.state}">${s.state==='done'?'<i class="fa-solid fa-check"></i>':(s.state==='active'?'<i class="fa-solid fa-hourglass-half"></i>':s.step)}</div>
                  <div class="lve-tl-body">
                    <div class="lve-tl-actor">${s.actor} <span class="txt">· ${s.state==='done'?'completed':s.state==='active'?'in progress':'pending'}</span></div>
