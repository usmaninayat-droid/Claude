<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAJMEE'E — WFMC Blue Review (13 Aug 2026)</title>
<!--
  ============================================================================
  WFMC BLUE REVIEW PROTOTYPE — for internal review 13 Aug 2026
  ----------------------------------------------------------------------------
  Covers the six BLUE (committed) workstreams from the 06-Aug design sync,
  plus the Global Shift entity that blocks four of them.
    1. Global Shift entity                     (settings)
    2. Employee Master — field alignment       (workforce)
    3. Document Expiry Alerts + Dispatch Block (alerts)
    4. Training / Skill Matrix / Materials     (compliance)
    5. Roster board + working-hours rules      (workforce)
    6. Standby vs Reliever                     (workforce)
    7. Attendance — two sources                (workforce)
  Green (good-for-product) and Parked items are intentionally excluded.
  Blue vs Green partitioning is preserved via the topbar banner and nav tags.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================================
   TAJMEE'E / IWMP BRANDING — tokens mirror contract-management/index.html
   Primary #22c882 (IWMP green) · blue→green gradient rail · Gilroy → Inter fallback
   ============================================================================ */
:root{
  --fams:#0072D6; --fams-hover:#005CAB; --fams-50:#E6F1FB; --fams-200:#8ABEEC;
  --primary:#22c882; --primary-hover:#43d095; --primary-lightest:#e9faf3;
  --blue-500:#0072d6; --blue-100:#e6f2fc; --blue-50:#eaf4fd;   /* info accent */
  --green-500:#12b76a; --green-100:#e7f9f1;                     /* success tint */
  --amber-500:#f79009; --amber-100:#fef3e6;                     /* warning tint */
  --red-500:#f04438;   --red-100:#feecec;                       /* error tint */
  --violet-500:#444ce7; --violet-100:#eceefd;                   /* indigo tint */
  --bg:#f9fafb; --surface:#ffffff; --surface-2:#f9fafb;
  --line:#eaecf0; --line-strong:#d0d5dd;
  --ink:#101828; --ink-2:#344054; --ink-3:#98a2b3;
  --sidebar:linear-gradient(180deg,#0a8bc4 0%,#19b09d 30%,#22c784 70%,#26d07c 100%);
  --sidebar-ink:rgba(255,255,255,.75); --sidebar-active:#FFFFFF;
  --module-rail:#FFFFFF;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-1:0 1px 3px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.06);
  --shadow-2:0 4px 8px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-3:0 20px 48px rgba(16,24,40,.16);
  --radius:4px; --radius-lg:8px; --radius-full:999px;
  --font:'Gilroy','Inter',system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#0C1220; --surface:#131A2A; --surface-2:#1A2338;
  --line:#25304A; --line-strong:#374561;
  --ink:#F5F7FA; --ink-2:#B4BFD1; --ink-3:#7A879E;
  --sidebar:linear-gradient(180deg,#0a5a7c 0%,#0f6d5a 60%,#12805a 100%);
  --module-rail:#131A2A;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 4px 12px rgba(0,0,0,.35);
  --blue-100:#0F3253; --blue-50:#0B2340; --green-100:#0F3B29; --amber-100:#3D2B10; --red-100:#3D1E1A; --violet-100:#231C45;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}

/* ================ LAYOUT — IWMP dual rail: 52px gradient + 66px white ================ */
.app{display:grid;grid-template-columns:52px 66px 1fr;grid-template-rows:1fr;height:100vh;
     grid-template-areas:"apprail modrail main"}

/* Primary rail — 52px, tadweer gradient, 1:1 port of contract-management .sidenav-primary */
.apprail{grid-area:apprail;background:var(--sidebar);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:16px 12px;z-index:20}
.apprail-top{display:flex;flex-direction:column;align-items:flex-start;gap:28px;width:28px;flex:none}
/* Tadweer logo — ring-mask.svg (masked white) + logo-text.svg (image below) */
.tadweer{position:relative;width:28px;height:34px;flex:none}
.tadweer .ring{position:absolute;left:5px;top:1px;width:18.51px;height:19.92px;background:#ffffff;
               -webkit-mask-image:url('./contract-management/icons/ring-mask.svg');mask-image:url('./contract-management/icons/ring-mask.svg');
               -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.tadweer .txt{position:absolute;left:0;top:23.09px;width:28px;height:10.05px;display:block}
.apprail-apps{display:flex;flex-direction:column;align-items:flex-start;gap:16px;width:28px;flex:none}
.apptile{position:relative;width:28px;height:28px;border-radius:var(--radius);flex:none;
         display:flex;align-items:center;justify-content:center;cursor:pointer}
.apptile.active{background:#ffffff;border-left:2px solid rgba(34,200,130,.3)}
.apptile.tile2{background:rgba(255,255,255,.4);border-left:2px solid rgba(34,200,130,.2)}
.apptile img{width:18px;height:18px;object-fit:contain;display:block}
.apprail-bottom{display:flex;flex-direction:column;align-items:center;gap:12px;flex:none}
.apprail .foot{width:28px;height:28px;border-radius:41px;background:rgba(255,255,255,.20);
               display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,box-shadow .15s}
.apprail .foot:hover{background:rgba(255,255,255,.30)}
.apprail .foot.active{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.apprail .foot.active img{filter:brightness(0) saturate(1) invert(58%) sepia(78%) saturate(400%) hue-rotate(105deg) brightness(92%) contrast(88%)}
.apprail .foot img{width:18px;height:18px;object-fit:contain;display:block}

/* Secondary rail — 66px white, 1:1 port of contract-management .sidenav-secondary */
.modrail{grid-area:modrail;background:var(--module-rail);border-right:1px solid var(--line-strong);
         display:flex;flex-direction:column;align-items:center;padding:16px;gap:16px;overflow-y:auto;z-index:19}
.modrail .brand{display:none}
.nav-label{display:none}

/* .nav-item styled exactly like contract-management .sidenav-item */
.nav-item{position:relative;width:34px;height:34px;border-radius:var(--radius);flex:none;
          display:flex;align-items:center;justify-content:center;cursor:pointer;
          background:transparent;border:none;padding:0;transition:background .15s}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--primary)}
.nav-item.active img{filter:brightness(0) invert(1)}
.nav-item:not(.active){filter:drop-shadow(0 .944px .944px rgba(16,24,40,.05))}
.nav-item img{width:18px;height:18px;object-fit:contain;display:block}
.nav-item i{display:none}      /* FontAwesome fallback hidden — SVG imgs win */
.nav-item .item-label{display:none}
.nav-item .tag{display:none}

/* Tooltip on hover — 24px right of tile, ink pill */
.nav-item::after{content:attr(data-tt);position:absolute;left:calc(100% + 24px);top:50%;transform:translateY(-50%);
                 background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:var(--radius);
                 white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s;
                 box-shadow:var(--shadow-1);z-index:30}
.nav-item:hover::after{opacity:1;visibility:visible}

.topbar{grid-area:topbar;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.topbar .title{font-size:14px;font-weight:600;color:var(--ink)}
.topbar .crumb{color:var(--ink-3);font-size:12.5px;margin-left:6px}
.topbar .spacer{flex:1}
.topbar .action{padding:6px 12px;border-radius:var(--radius);background:transparent;border:1px solid var(--line-strong);color:var(--ink-2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-xs)}
.topbar .action:hover{background:var(--primary-lightest);color:var(--primary);border-color:var(--primary)}

.banner{grid-area:banner;background:var(--primary-lightest);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;font-size:12.5px;color:var(--ink-2)}
.banner .pill{background:var(--primary);color:#fff;padding:2px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:700;letter-spacing:.5px}
.banner strong{color:var(--ink)}
.banner .right{margin-left:auto;color:var(--ink-3);font-size:11.5px}

.main{grid-area:main;overflow-y:auto;padding:24px 28px 60px}

/* ================ COMPONENTS ================ */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head h2{font-size:20px;font-weight:700;margin-bottom:4px}
.page-head .sub{color:var(--ink-2);font-size:13px;max-width:720px}
.page-head .ref{margin-left:auto;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:none;margin-bottom:16px}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3 .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:var(--radius);background:var(--blue-100);color:var(--primary);letter-spacing:.4px}
.card h3 .badge.new{background:var(--green-100);color:var(--green-500)}
.card h3 .sub{margin-left:auto;color:var(--ink-3);font-size:12px;font-weight:400}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative}
.kpi .label{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .value{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .delta{margin-top:4px;font-size:11.5px;color:var(--ink-2)}
.kpi.warn{border-color:var(--amber-500);background:var(--amber-100)}
.kpi.warn .value{color:var(--amber-500)}
.kpi.crit{border-color:var(--red-500);background:var(--red-100)}
.kpi.crit .value{color:var(--red-500)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink)}
tr:hover td{background:var(--surface-2)}
.thin td{padding:8px 12px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chip.blue{background:var(--blue-100);color:var(--blue-500)}
.chip.green{background:var(--green-100);color:var(--green-500)}
.chip.amber{background:var(--amber-100);color:var(--amber-500)}
.chip.red{background:var(--red-100);color:var(--red-500)}
.chip.violet{background:var(--violet-100);color:var(--violet-500)}
.chip.gray{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-strong)}
.chip.new-field{background:transparent;color:var(--green-500);border:1px dashed var(--green-500);text-transform:none}

/* Buttons */
.btn{padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all .15s;border:1px solid transparent;line-height:1.2;box-shadow:var(--shadow-xs)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn.danger{background:var(--red-500);color:#fff}
.btn.subtle{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary-lightest)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.field label .req{color:var(--red-500);margin-left:2px}
.field label .new{background:var(--green-100);color:var(--green-500);font-size:9.5px;padding:1px 5px;border-radius:3px;margin-left:6px;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);transition:border .15s;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-lightest)}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.field.added{background:linear-gradient(90deg,rgba(21,149,112,.06),transparent);padding:8px;margin:0 -8px 6px;border-radius:6px}

/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(11,31,53,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;box-shadow:var(--shadow-3);max-height:90vh;overflow-y:auto}
.modal .h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal .h h4{font-size:15px;font-weight:700;flex:1}
.modal .b{padding:20px 22px}
.modal .f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius);box-shadow:var(--shadow-3);z-index:100;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* Roster board */
.roster{overflow-x:auto}
.roster table{min-width:900px}
.roster td.day{width:11.5%;padding:6px;vertical-align:top}
.roster .emp{width:16%;min-width:170px}
.roster .emp .name{font-weight:600;font-size:13px}
.roster .emp .meta{font-size:11px;color:var(--ink-3)}
.shift-chip{display:block;padding:6px 8px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:grab;user-select:none;margin-bottom:4px}
.shift-chip.morning{background:var(--blue-100);color:var(--blue-500)}
.shift-chip.evening{background:var(--violet-100);color:var(--violet-500)}
.shift-chip.night{background:#1F2937;color:#F3F4F6}
.shift-chip.off{background:var(--surface-2);color:var(--ink-3);text-align:center;font-style:italic;cursor:not-allowed}
.shift-chip.standby{background:var(--amber-100);color:var(--amber-500);border:1px dashed var(--amber-500)}
.shift-chip.reliever{background:var(--green-100);color:var(--green-500);border:2px solid var(--green-500)}
.shift-chip .rt{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:2px}
td.warn-day{background:rgba(217,119,6,.08);position:relative}
td.warn-day::after{content:'⚠';position:absolute;top:2px;right:4px;font-size:11px;color:var(--amber-500)}
td.block-day{background:rgba(220,38,38,.06);position:relative}
td.block-day::after{content:'\f023';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:4px;right:6px;font-size:10px;color:var(--red-500)}

/* Skill matrix grid */
.smx{display:grid;gap:2px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.smx > div{background:var(--surface);padding:8px 10px;font-size:11.5px;text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center}
.smx .head{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
.smx .name{background:var(--surface-2);text-align:left;font-weight:600;font-size:12px}
.smx .cell.on{background:var(--green-100);color:var(--green-500);font-weight:700}
.smx .cell.exp{background:var(--red-100);color:var(--red-500);font-weight:700}
.smx .cell.miss{color:var(--ink-3)}

/* Source badges */
.src{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.2px}
.src.plan{background:var(--blue-100);color:var(--blue-500)}
.src.bio{background:var(--violet-100);color:var(--violet-500)}
.src.none{background:var(--red-100);color:var(--red-500)}

/* Pool cards */
.pool-emp{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);margin-bottom:6px}
.pool-emp .av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.pool-emp .info{flex:1}
.pool-emp .info .n{font-weight:600;font-size:12.5px}
.pool-emp .info .m{font-size:10.5px;color:var(--ink-3)}

/* Alert bucket */
.bucket{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.bucket:hover{border-color:var(--primary);transform:translateX(2px)}
.bucket .icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.bucket .icon.d90{background:var(--blue-100);color:var(--blue-500)}
.bucket .icon.d60{background:var(--violet-100);color:var(--violet-500)}
.bucket .icon.d30{background:var(--amber-100);color:var(--amber-500)}
.bucket .icon.d7{background:var(--red-100);color:var(--red-500)}
.bucket .icon.exp{background:#1F2937;color:#fff}
.bucket .txt{flex:1}
.bucket .txt .h{font-weight:600;font-size:13px}
.bucket .txt .s{font-size:11.5px;color:var(--ink-3)}
.bucket .cnt{font-size:22px;font-weight:700}

/* Blocked employee state */
.blocked-row{opacity:.55;position:relative;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(220,38,38,.05) 6px,rgba(220,38,38,.05) 12px)}
.blocked-row td:first-child::before{content:'\f023';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--red-500);margin-right:6px}

/* Section legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.legend .item{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:14px;border-radius:3px}

.review-badge{position:fixed;bottom:20px;left:138px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:12px;box-shadow:var(--shadow-2);display:flex;gap:10px;align-items:center;z-index:50}
.review-badge .dot{width:8px;height:8px;background:var(--primary);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab:hover{color:var(--primary)}

/* Two-column split */
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty i{font-size:32px;margin-bottom:12px;color:var(--ink-3)}

/* ============================================================================
   SHIFT CONFIGURATION SCREEN — pixel-match to Figma node 2073:33843 (FAMS Blue)
   ============================================================================ */
@font-face{font-family:'Gilroy';font-weight:300;font-style:normal;src:url('./contract-management/fonts/Gilroy-Light.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:400;font-style:normal;src:url('./contract-management/fonts/Gilroy-Regular.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:500;font-style:normal;src:url('./contract-management/fonts/Gilroy-Medium.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:600;font-style:normal;src:url('./contract-management/fonts/Gilroy-Semibold.otf') format('opentype')}
@font-face{font-family:'Gilroy';font-weight:700;font-style:normal;src:url('./contract-management/fonts/Gilroy-Bold.otf') format('opentype')}

.shift-screen{display:grid;grid-template-columns:274px 1fr;gap:0;margin:-24px -28px -60px;
              min-height:100vh;background:#fff;position:relative;font-family:'Gilroy',var(--font)}

/* Left sub-nav — 274px, "Settings" header + 2 groups */
.shift-nav{border-right:1px solid var(--line-strong);padding:32px 28px;display:flex;flex-direction:column;gap:32px;overflow-y:auto}
.shift-nav .head{display:flex;flex-direction:column;gap:12px}
.shift-nav .back{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-3);font-weight:500;cursor:pointer;background:none;border:none;padding:0}
.shift-nav .back i{font-size:8px}
.shift-nav .brand-row{display:flex;align-items:center;gap:8px}
.shift-nav .brand-icn{width:28px;height:28px;border-radius:2px;background:rgba(138,190,236,.40);display:flex;align-items:center;justify-content:center;flex:none}
.shift-nav .brand-icn img{width:20px;height:20px;display:block;object-fit:contain}
.settings-group{display:flex;flex-direction:column;gap:0}
.settings-group .group-label{font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 0;font-family:'Gilroy',var(--font)}
.settings-nav-item{display:flex;align-items:center;gap:12px;padding:12px;height:40px;border-radius:4px;font-size:14px;color:#475467;font-weight:400;cursor:pointer;background:transparent;border:none;text-align:left;font-family:'Gilroy',var(--font);white-space:nowrap;line-height:1}
.settings-nav-item:hover{background:var(--surface-2)}
.settings-nav-item.active{background:var(--fams-50);color:#000;font-weight:500}
.settings-nav-item img{width:16px;height:16px;display:block;flex:none;object-fit:contain}

/* Right main pane */
.shift-main{padding:20px 28px 40px;position:relative;min-width:0}
.shift-crumb{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--ink-3);font-weight:500;font-family:'Gilroy',var(--font);margin-bottom:44px}
.shift-crumb i{font-size:7px;color:var(--ink-3)}
.shift-search{position:absolute;top:20px;right:28px;width:367px;height:32px;border:1px solid var(--line-strong);border-radius:4px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
.shift-search i{color:var(--ink-3);font-size:12px}
.shift-search input{border:none;outline:none;background:transparent;font-size:10px;flex:1;color:var(--ink);font-family:'Gilroy',var(--font);font-weight:500}
.shift-search input::placeholder{color:var(--ink-3);font-size:10px}
.shift-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}
.shift-header h1{font-size:24px;font-weight:700;color:#000;margin:0 0 4px;line-height:30px;font-family:'Gilroy',var(--font)}
.shift-header .subtitle{font-size:14px;color:#98A2B3;font-weight:300;max-width:773px;line-height:normal;font-family:'Gilroy',var(--font)}
.configure-btn{background:var(--primary);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);font-family:'Gilroy',var(--font);flex:none}
.configure-btn:hover{background:var(--primary-hover)}
.configure-btn i{font-size:14px}

.shift-list{display:flex;flex-direction:column;gap:16px}
.shift-row{background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:12px 20px;display:flex;align-items:center;gap:20px}
.shift-cell{display:flex;flex-direction:column;gap:4px;min-width:0;flex:none}
.shift-cell .lbl{font-size:11px;color:var(--ink-3);font-weight:500;font-family:'Gilroy',var(--font);line-height:normal;text-transform:none;letter-spacing:0}
.shift-cell .val{font-size:14px;color:#000;font-weight:500;text-transform:uppercase;font-family:'Gilroy',var(--font);line-height:normal;white-space:nowrap;letter-spacing:.02em}
.shift-cell.name{flex:0 0 160px}
.shift-cell.name .val{text-transform:none;letter-spacing:0}
.name-with-icon{display:flex;align-items:center;gap:8px}
.name-with-icon img{width:18px;height:18px;object-fit:contain;flex:none}
.shift-cell.sub-orgs-cell{flex:1 1 auto;min-width:200px}
.sub-orgs-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill-sub-org{display:inline-block;padding:3px 10px;border-radius:4px;background:var(--primary-lightest);color:var(--primary-hover);font-size:11.5px;font-weight:600;font-family:'Gilroy',var(--font);letter-spacing:.02em;white-space:nowrap;line-height:16px;border:1px solid rgba(34,200,130,.2)}
.pill-add{width:22px;height:22px;border-radius:4px;background:var(--primary-lightest);color:var(--primary);border:1px dashed rgba(34,200,130,.4);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:10px;padding:0}
.pill-add:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.date-val{color:#000;font-weight:500;text-transform:none;letter-spacing:0}

/* Varies-value — first day's value shown truncated with hover popover for full per-day breakdown */
.time-cell,.brk-cell{position:relative}
.varies-value{display:inline-flex;align-items:baseline;gap:2px;cursor:help;position:relative;outline:none}
.varies-value .varies-more{color:var(--ink-3);font-weight:700;font-size:13px;letter-spacing:0;line-height:1}
.varies-pop{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:12px 14px;min-width:280px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s;z-index:40;pointer-events:none}
.varies-value:hover .varies-pop,
.varies-value:focus .varies-pop{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.varies-pop .vp-head{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-family:'Gilroy',var(--font)}
.varies-pop table{width:100%;border-collapse:collapse;font-family:'Gilroy',var(--font)}
.varies-pop td{padding:5px 0;font-size:12.5px;color:var(--ink);border:none;text-transform:none;letter-spacing:0;font-weight:500}
.varies-pop .td-day{font-weight:700;color:#000;width:44px;letter-spacing:.02em}
.varies-pop .td-time{color:var(--ink)}
.varies-pop .td-brk{color:var(--ink-3);text-align:right;font-size:11.5px}
.shift-toggle-cell{display:flex;align-items:center;flex:none;margin-left:auto}
.shift-toggle{width:36px;height:20px;border-radius:12px;background:var(--primary);padding:2px;display:inline-flex;align-items:center;justify-content:flex-end;cursor:pointer;border:none;transition:background .15s}
.shift-toggle.off{background:#EAECF0;justify-content:flex-start}
.shift-toggle .knob{width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(16,24,40,.15)}

/* Right sidesheet — Configure New Shift */
.sheet-scrim{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-scrim.open{opacity:1;pointer-events:auto}
.sheet-close{position:fixed;top:24px;right:876px;width:40px;height:40px;background:#fff;border-radius:50%;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(16,24,40,.2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:16px;z-index:102;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-close.open{opacity:1;pointer-events:auto}
.sidesheet{position:fixed;top:0;right:0;bottom:0;width:860px;background:#fff;z-index:101;transform:translateX(100%);transition:transform .28s ease-out;display:flex;flex-direction:column;font-family:'Gilroy',var(--font)}
.sidesheet.open{transform:none}
.sheet-head{padding:32px 40px 16px}
.sheet-head h2{font-size:24px;font-weight:700;color:#000;margin:0 0 4px;font-family:'Gilroy',var(--font)}
.sheet-head p{font-size:14px;color:var(--ink-3);font-weight:500;margin:0;font-family:'Gilroy',var(--font)}
.sheet-tabs{display:flex;gap:32px;border-bottom:1px solid var(--line);padding:0 40px}
.sheet-tab{padding:12px 0;font-size:14px;color:var(--ink-3);font-weight:500;cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Gilroy',var(--font)}
.sheet-tab:hover{color:var(--fams)}
.sheet-tab.active{color:var(--fams);font-weight:700;border-bottom-color:var(--fams)}
.sheet-body{flex:1;padding:28px 40px 32px;overflow-y:auto}
.sheet-section h3{font-size:18px;font-weight:700;color:#000;margin:0 0 20px;font-family:'Gilroy',var(--font)}
.sheet-row{display:flex;gap:24px;margin-bottom:16px}
.sheet-field{flex:1;position:relative;min-width:0}
.sheet-field.narrow{flex:0 0 106px}
.sheet-field .picker-label{font-size:11px;font-weight:500;color:var(--ink-2);font-family:'Gilroy',var(--font);display:block;margin-bottom:8px}
/* Design-system input — label INSIDE the box, tiny grey caption above the value.
   Matches Figma frame 2073:34022 (Configure New Shift → Basic Info) */
.ds-input{background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:8px 12px;min-height:54px;
          display:flex;flex-direction:column;gap:4px;justify-content:center;position:relative;transition:border-color .15s,box-shadow .15s;font-family:'Gilroy',var(--font)}
.ds-input:focus-within{border-color:var(--fams);box-shadow:0 0 0 2px var(--fams-50)}
.ds-input .ds-label{font-family:'Gilroy',var(--font);font-weight:600;font-size:10px;color:#98A2B3;line-height:normal;text-transform:none;letter-spacing:0}
.ds-input input,.ds-input textarea,.ds-input select{font-family:'Gilroy',var(--font);font-weight:500;font-size:14px;color:#000;
                                                     line-height:normal;border:none;outline:none;padding:0;background:transparent;width:100%;resize:none}
.ds-input textarea{min-height:96px;resize:vertical;font-family:'Gilroy',var(--font)}
.ds-input.has-pin{padding-left:34px}
.ds-input .pin{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.ds-input .stepper{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;color:var(--ink-3);font-size:9px;gap:2px;cursor:pointer}
.ds-input.textarea{min-height:auto;padding:12px}
.ds-input.textarea .ds-label{margin-bottom:2px}
.ds-input input:disabled,.ds-input select:disabled{color:var(--ink-2);cursor:not-allowed;-webkit-text-fill-color:var(--ink-2);opacity:1}
.ds-input.disabled{background:#F9FAFB}
.ds-input select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='7' viewBox='0 0 12 7'><path d='M1 1l5 5 5-5' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right center;padding-right:20px}
.sheet-foot{padding:20px 40px;border-top:1px solid var(--line);background:#fff}
.sheet-save{width:100%;background:var(--fams);color:#fff;padding:14px;border-radius:4px;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:'Gilroy',var(--font)}
.sheet-save:hover{background:var(--fams-hover)}
.sheet-input-wrap select{width:100%;padding:11px 12px;border:none;outline:none;font-size:14px;color:#000;font-family:'Gilroy',var(--font);background:transparent;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='7' viewBox='0 0 12 7'><path d='M1 1l5 5 5-5' stroke='%2398A2B3' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
.sheet-input-wrap input:disabled{color:var(--ink-2);background:#F9FAFB;cursor:not-allowed}
.scope-hint{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--fams-50);border-radius:4px;font-size:12.5px;color:var(--ink-2);font-family:'Gilroy',var(--font);margin:-4px 0 16px;line-height:1.5}
.scope-hint i{color:var(--fams);font-size:14px;margin-top:2px}
.lbl-hint{color:var(--ink-3);font-weight:400}
/* ---- Schedule form (finalized) ---- */
.section-heading{font-size:16px;font-weight:600;color:#000;margin:28px 0 14px;font-family:'Gilroy',var(--font);letter-spacing:0}
.section-heading:first-child{margin-top:0}

.sheet-field.narrow-icon{flex:0 0 54px}
.ds-shift-icon{width:54px;height:54px;border:1px solid var(--line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;position:relative;padding:6px;transition:border-color .15s,box-shadow .15s}
.ds-shift-icon:hover{border-color:var(--fams);box-shadow:0 0 0 2px var(--fams-50)}
.ds-shift-icon img{width:24px;height:24px;object-fit:contain}
.ds-shift-icon::after{content:"\f078";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;bottom:4px;right:5px;font-size:7px;color:var(--ink-3)}

.freq-hint{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--fams-50);border-left:3px solid var(--fams);border-radius:4px;font-size:13px;color:var(--ink);font-family:'Gilroy',var(--font);margin-bottom:16px;line-height:1.5;font-weight:400}
.freq-hint i{color:var(--fams);font-size:14px;margin-top:2px;flex:none}
.freq-hint strong{font-weight:600}
.days-label{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:10px;font-family:'Gilroy',var(--font);text-transform:uppercase;letter-spacing:.04em}

.day-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.day-check{display:flex;align-items:center;gap:8px;width:80px;flex:none}
.day-check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--fams);cursor:pointer;margin:0;flex:none}
.day-check label{font-size:14px;font-weight:500;color:#000;cursor:pointer;font-family:'Gilroy',var(--font)}
.day-row.inactive .day-check label{color:var(--ink-3)}

.time-fields{display:flex;gap:12px;flex:1;min-width:0}
.time-fields.solo{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.time-fields > .ds-input{flex:1;min-width:0;min-height:auto;height:54px;padding:8px 32px 8px 12px;position:relative}
.day-row.inactive .time-fields > .ds-input{opacity:.5}
.time-fields > .ds-input input:disabled{cursor:not-allowed}

.ds-input .clear-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:transparent;color:var(--ink-3);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:10px;padding:0;opacity:0;transition:opacity .12s}
.ds-input:hover .clear-x{display:flex;opacity:1}
.ds-input .clear-x:hover{background:rgba(240,68,56,.1);color:#F04438}
.ds-input.readonly{background:linear-gradient(135deg,var(--fams-50) 0%,#F0F7FE 100%);pointer-events:none;border-color:#C9DDF3}
.ds-input.readonly .ds-label{color:var(--fams)}
.ds-input.readonly .wh-val{font-size:15px;font-weight:600;color:var(--fams);font-family:'Gilroy',var(--font);line-height:normal;display:flex;align-items:center;gap:6px}
.ds-input.readonly .wh-val::before{content:"\f017";font-family:"Font Awesome 6 Free";font-weight:400;font-size:12px;opacity:.7}
/* Hide native time picker icon in Chrome/Edge — we already have the label pattern */
input[type=time]::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer;filter:invert(60%)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;width:20px;cursor:pointer}

.week-block{margin-bottom:24px;padding:16px;background:#F9FAFB;border:1px solid var(--line);border-radius:6px}
.week-block:last-child{margin-bottom:0}
.week-header{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#000;margin-bottom:14px;font-family:'Gilroy',var(--font)}
.week-badge{width:26px;height:26px;border-radius:6px;background:var(--fams);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.week-badge.b{background:#7C3AED}

.date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.date-cell{height:38px;border:1px solid var(--line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--ink);font-family:'Gilroy',var(--font);padding:0;transition:all .12s}
.date-cell:hover{border-color:var(--fams);background:var(--fams-50)}
.date-cell.selected{background:var(--fams);color:#fff;border-color:var(--fams);font-weight:600}
.date-cell.wide{grid-column:span 4;font-size:12px}

.custom-date-row{display:flex;align-items:center;gap:12px;padding:14px;background:#F9FAFB;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.cdr-date{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#000;width:150px;flex:none;font-family:'Gilroy',var(--font)}
.cdr-date i{color:var(--fams);font-size:12px}
.row-remove{background:#fff;border:1px solid var(--line-strong);color:#F04438;width:38px;height:38px;border-radius:4px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.row-remove:hover{background:#FEECEC;border-color:#F04438}
.btn-add-date{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:transparent;border:1px dashed var(--line-strong);border-radius:4px;color:var(--fams);font-weight:600;font-size:13px;cursor:pointer;font-family:'Gilroy',var(--font);margin-top:4px}
.btn-add-date:hover{background:var(--fams-50);border-color:var(--fams)}

/* Custom recurrence controls — Google Calendar-style compact panel */
.custom-freq-block{padding:20px;border:1px solid var(--line);border-radius:6px;background:#F9FAFB;display:flex;flex-direction:column;gap:20px}
.cfb-inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cfb-inline-label{font-size:14px;color:var(--ink);font-weight:500;font-family:'Gilroy',var(--font)}
.repeat-every{display:flex;gap:12px;align-items:center}
.repeat-every > .ds-input{min-height:44px;height:44px}
.ds-input.narrow-num{flex:0 0 72px}
.ds-input.narrow-num input{text-align:center;font-weight:600;padding-right:0}
.day-toggles{display:flex;gap:8px;flex-wrap:wrap}
.day-toggle{width:38px;height:38px;border:1px solid var(--line-strong);border-radius:50%;background:#fff;font-family:'Gilroy',var(--font);font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:all .12s;
            display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0}
.day-toggle:hover{border-color:var(--fams);color:var(--fams)}
.day-toggle.selected{background:var(--fams);color:#fff;border-color:var(--fams)}
.ends-row{display:flex;flex-direction:column;gap:8px}
.radio-row{display:flex;align-items:center;gap:8px;font-size:14px;font-family:'Gilroy',var(--font);color:var(--ink);cursor:pointer}
.radio-row input[type=radio]{accent-color:var(--fams);width:16px;height:16px}
.mini-date,.mini-num{padding:6px 10px;border:1px solid var(--line-strong);border-radius:4px;font-family:'Gilroy',var(--font);font-size:13px;color:var(--ink);background:#fff}
.mini-num{width:64px;text-align:center}
.mini-date{width:150px}

.icon-picker{display:flex;gap:10px}
.icon-swatch{width:44px;height:44px;border-radius:4px;border:1px solid var(--line-strong);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;padding:0}
.icon-swatch:hover{border-color:var(--fams)}
.icon-swatch.selected{border-color:var(--fams);background:var(--fams-50);box-shadow:0 0 0 2px rgba(0,114,214,.15)}
.icon-swatch img{width:22px;height:22px;object-fit:contain;display:block}
</style>
</head>
<body>
<div class="app">
  <!-- Primary rail (52px) — tadweer logo + WFMC active app + settings/user, real SVG assets -->
  <aside class="apprail" aria-label="Applications">
    <div class="apprail-top">
      <div class="tadweer" title="Tadweer Group">
        <div class="ring"></div>
        <img class="txt" src="./contract-management/icons/logo-text.svg" alt="tajmee'e tadweer collection">
      </div>
      <div class="apprail-apps">
        <div class="apptile active" title="Workforce · WFMC">
          <img src="./contract-management/icons/wfmc-app.svg" alt="">
        </div>
      </div>
    </div>
    <div class="apprail-bottom">
      <div class="foot" id="footSettings" title="Settings · Shift configuration" onclick="go('shift')"><img src="./contract-management/icons/settings.svg" alt="Settings"></div>
      <div class="foot" title="User"><img src="./contract-management/icons/user.svg" alt="User"></div>
    </div>
  </aside>

  <!-- Secondary rail (66px) — icon-only SVGs from contract-management/icons, tooltip on hover -->
  <aside class="modrail" aria-label="Modules">
    <button class="nav-item" data-route="summary" data-tt="Review Summary"><img src="./contract-management/icons/report.svg" alt=""></button>
    <button class="nav-item" data-route="shift" data-tt="Global Shift Entity"><img src="./contract-management/icons/kpi-clock.svg" alt=""></button>
    <button class="nav-item" data-route="employee" data-tt="Employee Master"><img src="./contract-management/icons/users.svg" alt=""></button>
    <button class="nav-item" data-route="roster" data-tt="Roster Board"><img src="./contract-management/icons/tour-map.svg" alt=""></button>
    <button class="nav-item" data-route="pools" data-tt="Standby &amp; Reliever"><img src="./contract-management/icons/user.svg" alt=""></button>

const DAY_ORDER = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
function formatDaysList(activeDays){
  const idx = activeDays.map(d => DAY_ORDER.indexOf(d)).sort((a,b)=>a-b);
  if (idx.length === 0) return '—';
  if (idx.length === 7) return 'MON - SUN';
  if (idx.length === 5 && idx[0] === 0 && idx[4] === 4) return 'MON - FRI';
  const isCont = idx.every((v,i) => i === 0 || v === idx[i-1] + 1);
  if (isCont) return `${DAY_ORDER[idx[0]]} - ${DAY_ORDER[idx[idx.length-1]]}`;
  return idx.map(i => DAY_ORDER[i]).join(', ');
}
function summarizeSchedule(sh){
  const active = sh.schedule.filter(d => d.on);
  const daysStr = formatDaysList(active.map(d => d.day));
  const startsUniq = new Set(active.map(d => d.start));
  const endsUniq = new Set(active.map(d => d.end));
  const brksUniq = new Set(active.map(d => d.brk));
  const timeConsistent = startsUniq.size === 1 && endsUniq.size === 1;
  const brkConsistent = brksUniq.size === 1;
  return {
    days: daysStr,
    time: timeConsistent ? `${active[0].start} - ${active[0].end}` : null,
    brk:  brkConsistent  ? active[0].brk : null,
    active
  };
}
function scheduleTooltip(active){
  const rows = active.map(d => `<tr><td class="td-day">${d.day}</td><td class="td-time">${d.start} – ${d.end}</td><td class="td-brk">${d.brk} break</td></tr>`).join('');
  return `<div class="varies-pop"><div class="vp-head">Per-day schedule</div><table>${rows}</table></div>`;
}

/* ---- Interactive behaviour ---- */
function parseTime(v){
  if (!v) return null;
  const m = v.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1])*60 + parseInt(m[2]);
}
function parseBreak(v){
  if (!v) return 0;
  const m = v.match(/^([\d.]+)\s*(hour|min)/i);
  if (!m) return 0;
  return m[2].toLowerCase()==='hour' ? Math.round(parseFloat(m[1])*60) : parseInt(m[1]);
}
function computeWorkingHours(start, end, brk){
  const s = parseTime(start), e = parseTime(end);
  if (s === null || e === null) return '—';
  let diff = e - s;
  if (diff <= 0) diff += 24*60; // overnight
  diff -= parseBreak(brk);
  if (diff <= 0) return '—';
  const h = Math.floor(diff/60), m = diff%60;
  return m === 0 ? `${h} hour${h===1?'':'s'}` : `${h}h ${m}m`;
}
function containerFor(el){
  const tf = el.closest('.time-fields');
  if (!tf) return null;
  if (tf.classList.contains('solo')) return tf;
  return el.closest('.day-row, .custom-date-row');
}
function recomputeWH(container){
  if (!container) return;
  const s = container.querySelector('[data-t="start"]')?.value || '';
  const e = container.querySelector('[data-t="end"]')?.value || '';
  const b = container.querySelector('[data-t="break"]')?.value || '';
  const whEl = container.querySelector('.wh-val');
  if (whEl) whEl.textContent = computeWorkingHours(s, e, b);
}
document.addEventListener('input', (e) => {
  if (!e.target.matches('[data-t]')) return;
  recomputeWH(containerFor(e.target));
});
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-t="break"]')) { recomputeWH(containerFor(e.target)); return; }
  const row = e.target.closest('.day-row');
  if (row && e.target.type === 'checkbox') {
    row.classList.toggle('inactive', !e.target.checked);
    row.querySelectorAll('.time-fields input, .time-fields select').forEach(el => el.disabled = !e.target.checked);
    if (e.target.checked) recomputeWH(row);
    else row.querySelector('.wh-val').textContent = '—';
  }
});
document.addEventListener('click', (e) => {
  // Clear-x button
  const clr = e.target.closest('.clear-x');
  if (clr) {
    e.preventDefault();
    const inp = clr.parentElement.querySelector('input');
    if (inp) { inp.value = ''; recomputeWH(containerFor(inp)); }

  // Day-of-week toggle in Custom freq

});

  const dayHdr = days.map(d=>`<th class="day" style="width:11.5%">${d}</th>`).join('');

    if (kind==='off') return `<div class="shift-chip off">Weekly off</div>`;

    if (kind==='sb') return `<div class="shift-chip standby">STANDBY<span class="rt">Approved leave cover</span></div>`;
    if (kind==='rv') return `<div class="shift-chip reliever">RELIEVER<span class="rt">Buffer · no-show cover</span></div>`;
    const s = SHIFTS.find(x=>x.id===kind);
    const cls = kind==='S-M'?'morning':(kind==='S-A'?'evening':(kind==='S-N'?'night':'morning'));
    return `<div class="shift-chip ${cls}">${s?s.name.split(' ')[0].toUpperCase():'—'}<span class="rt">Route ${route}</span></div>`;

      let cls='day';
      if (k==='warn') cls+=' warn-day';
      if (k==='block') cls+=' block-day';
      return `<td class="${cls}">${chip(k)}</td>`;
    }).join('');
    return `<tr>
      <td class="emp"><div class="name">${e.name}</div><div class="meta">${e.id} · ${e.role}</div></td>
      ${cells}
    </tr>`;
  }).join('');

  return `

        <span class="sub">${EMPS.filter(e=>e.lot==='LOT 4').length} employees · 2 pool lanes</span>

/* ---------- 6. ATTENDANCE TWO-SOURCE ---------- */
route('attendance', ()=>{
  return `
    <div class="page-head">
      <div>
        <h2>Attendance · two data sources <span class="chip blue" style="vertical-align:middle;margin-left:6px">Source-aware</span></h2>
        <div class="sub">Drivers: attendance derived from <strong>Plan-login</strong> (opening and executing their route in the app). Helpers &amp; terminal workforce: <strong>BioTime</strong> biometric only. The register never pretends these are the same event.</div>
      </div>
      <div class="ref">ATT · v1</div>
    </div>

    <div class="grid-4" style="margin-bottom:16px">
      <div class="kpi"><div class="label">Rostered today</div><div class="value">${EMPS.length}</div></div>
      <div class="kpi"><div class="label">Plan-login</div><div class="value" style="color:var(--blue-500)">${EMPS.filter(e=>e.src==='plan').length}</div><div class="delta">Drivers · route-based</div></div>
      <div class="kpi"><div class="label">BioTime</div><div class="value" style="color:var(--violet-500)">${EMPS.filter(e=>e.src==='bio').length}</div><div class="delta">Helpers / terminal</div></div>
      <div class="kpi warn"><div class="label">Missing source</div><div class="value">1</div><div class="delta">Expected but no signal</div></div>
    </div>

    <div class="card">
      <h3>Daily attendance register · 12 Aug 2026</h3>
      <table>
        <thead><tr><th>Employee</th><th>Role</th><th>Shift</th><th>Source</th><th>In</th><th>Out</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${EMPS.map(e=>{
            const src = e.src==='plan'?'<span class="src plan"><i class="fa-solid fa-route"></i> Plan-login</span>':'<span class="src bio"><i class="fa-solid fa-fingerprint"></i> BioTime</span>';
            const inT = e.src==='plan' ? '06:04' : '05:58';
            const outT = e.src==='plan' ? '14:12' : '14:03';
            const stat = e.status.startsWith('blocked') ? '<span class="chip red">Blocked</span>' : '<span class="chip green">Present</span>';
            return `<tr><td><strong>${e.name}</strong><div style="font-size:11px;color:var(--ink-3)">${e.id}</div></td><td>${e.role}</td><td>${SHIFTS.find(x=>x.id===e.shift).name}</td><td>${src}</td><td>${inT}</td><td>${outT}</td><td>${stat}</td><td><button class="btn ghost" onclick="showPunch('${e.id}')"><i class="fa-solid fa-magnifying-glass-plus"></i></button></td></tr>`;
          }).join('')}
          <tr style="background:var(--red-100)"><td><strong>Kareem Anwar</strong><div style="font-size:11px;color:var(--ink-3)">TJ-5122</div></td><td>HD Driver</td><td>Morning Shift</td><td><span class="src none"><i class="fa-solid fa-circle-question"></i> No signal</span></td><td>—</td><td>—</td><td><span class="chip red">Absent · plan not opened</span></td><td><button class="btn ghost"><i class="fa-solid fa-magnifying-glass-plus"></i></button></td></tr>
        </tbody>
      </table>
      <div style="margin-top:12px;padding:12px 14px;background:var(--surface-2);border-radius:8px;font-size:12.5px;color:var(--ink-2)">
        <strong>Missing-source state:</strong> a driver expected on Plan-login who never opened the app shows as <em>"Absent · plan not opened"</em> — never as a BioTime miss. The two sources are never conflated.
      </div>
    </div>

    <div class="grid-2">
      <div class="card" style="border-left:4px solid var(--blue-500)">
        <h3><span class="src plan"><i class="fa-solid fa-route"></i> Plan-login</span> · how it works</h3>
        <ol style="padding-left:20px;font-size:12.5px;color:var(--ink-2);line-height:1.9">
          <li>Driver opens the app for their published plan</li>
          <li>App confirms identity + route</li>
          <li>Login timestamp = attendance In</li>
          <li>Route completion = attendance Out</li>
          <li>Deviation from shift window flagged via grace rules from the shift's timing variant</li>
        </ol>
        <div style="margin-top:10px;font-size:11.5px;color:var(--ink-3)">Applies to: HD Driver, LD Driver</div>
      </div>
      <div class="card" style="border-left:4px solid var(--violet-500)">
        <h3><span class="src bio"><i class="fa-solid fa-fingerprint"></i> BioTime</span> · how it works</h3>
        <ol style="padding-left:20px;font-size:12.5px;color:var(--ink-2);line-height:1.9">
          <li>Employee taps their card at depot device</li>
          <li>Device polls WFMC every 10 minutes</li>
          <li>Punch matched to employee &amp; shift</li>
          <li>In / Out derived from first / last punch</li>
          <li>Missed punches route to regularization workflow</li>
        </ol>
        <div style="margin-top:10px;font-size:11.5px;color:var(--ink-3)">Applies to: Labour, Helper, Supervisor, Terminal staff</div>
      </div>
    </div>
  `;
}, 'Attendance', 'Workforce › Attendance');

function showPunch(id){
  const e = EMPS.find(x=>x.id===id);
  const isPlan = e.src==='plan';
  modal(`
    <div class="modal" style="max-width:520px">
      <div class="h">
        ${isPlan?'<span class="src plan"><i class="fa-solid fa-route"></i> Plan-login</span>':'<span class="src bio"><i class="fa-solid fa-fingerprint"></i> BioTime</span>'}
        <h4>${e.name} · punch detail</h4><button class="btn ghost" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="b">
        ${isPlan?`
          <div class="field"><label>Plan ID</label><input value="PLN-2026-08-12-R14" disabled></div>
          <div class="field"><label>Login timestamp</label><input value="06:04:12 · 12 Aug 2026" disabled></div>
          <div class="field"><label>Route executed</label><input value="R-14 · Musaffah Sector 3" disabled></div>
          <div class="field"><label>Completion</label><input value="14:12:44 · 118 bins collected" disabled></div>
        `:`
          <div class="field"><label>Device</label><input value="BIO-MSF-01 · Musaffah gate" disabled></div>
          <div class="field"><label>First punch</label><input value="05:58:20 · 12 Aug 2026" disabled></div>
          <div class="field"><label>Shift window</label><input value="Morning · Early · 05:00–13:00" disabled></div>
          <div class="field"><label>Exception</label><input value="None · within grace" disabled></div>
        `}
        <div class="field"><label>Actions</label>
          <div style="display:flex;gap:8px"><button class="btn ghost"><i class="fa-solid fa-download"></i> Timesheet</button><button class="btn ghost"><i class="fa-regular fa-pen-to-square"></i> Regularization</button></div>
        </div>
      </div>
    </div>
  `);
}
