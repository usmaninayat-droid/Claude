<svg width="58" height="24" viewBox="0 0 58 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Green collection truck (matches FAMS success ramp) -->
  <g stroke="#05603A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- cargo body -->
    <rect x="1.5" y="4" width="34" height="14.5" rx="2.4" fill="#12B76A"/>
    <!-- body highlight panel -->
    <rect x="5" y="7" width="27" height="8.5" rx="1.4" fill="#39c97f" stroke="none"/>
    <!-- cab -->
    <path d="M35.5 8 h9.5 a2 2 0 0 1 1.7 1 l4 6.6 a2 2 0 0 1 .3 1.1 v0.8 a2 2 0 0 1 -2 2 h-13.5 z" fill="#039855"/>
    <!-- windshield -->
    <path d="M37.5 9.5 h6.6 a1 1 0 0 1 .85 .5 l2.5 4.1 a0.7 0.7 0 0 1 -.6 1.05 h-9.35 z" fill="#DDF3E8" stroke="#05603A" stroke-width="1"/>
  </g>
  <!-- wheels -->
  <g>
    <circle cx="12" cy="19.5" r="3.4" fill="#0F1E17"/>
    <circle cx="12" cy="19.5" r="1.3" fill="#B8C9BF"/>
    <circle cx="42" cy="19.5" r="3.4" fill="#0F1E17"/>
    <circle cx="42" cy="19.5" r="1.3" fill="#B8C9BF"/>
  </g>
</svg>
