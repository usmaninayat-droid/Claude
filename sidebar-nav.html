<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FAMS — Side Navigation</title>
<style>
  :root{
    --fams:#1E7FE8;          /* primary blue (matches screenshot) */
    --fams-deep:#1670D0;
    --ink-muted:#8A97A6;     /* inactive icon color on white column */
    --ink-on-blue:rgba(255,255,255,.78);
    --rail-blue-w:72px;
    --rail-white-w:76px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:#0F172A}

  .shell{display:flex;height:100vh}

  /* ── Rail: blue column ───────────────────────────────── */
  .rail-blue{
    width:var(--rail-blue-w);
    background:var(--fams);
    display:flex;flex-direction:column;align-items:center;
    padding:20px 0 24px;
    flex-shrink:0;
  }
  .rail-blue .top{display:flex;flex-direction:column;align-items:center;gap:18px;flex:1}
  .rail-blue .bottom{display:flex;flex-direction:column;align-items:center;gap:16px}

  /* FAMS hexagonal logo mark */
  .logo{
    width:36px;height:36px;display:grid;place-items:center;
    margin-bottom:2px;
  }
  .logo svg{width:32px;height:32px;display:block}

  /* icon buttons on blue rail */
  .b-item{
    width:44px;height:44px;border-radius:10px;
    display:grid;place-items:center;cursor:pointer;
    color:var(--ink-on-blue);
    transition:background .14s ease,color .14s ease;
  }
  .b-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .b-item:hover{background:rgba(255,255,255,.12);color:#fff}
  .b-item.active{background:#FFFFFF;color:var(--fams)}

  /* ── Rail: white column ──────────────────────────────── */
  .rail-white{
    width:var(--rail-white-w);
    background:#FFFFFF;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 0;
    gap:12px;
    flex-shrink:0;
    border-right:1px solid #EEF1F5;
  }
  .w-item{
    width:44px;height:44px;border-radius:10px;
    display:grid;place-items:center;cursor:pointer;
    color:var(--ink-muted);
    transition:background .14s ease,color .14s ease;
  }
  .w-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .w-item:hover{background:#F1F5FB;color:var(--fams)}
  .w-item.active{background:var(--fams);color:#FFFFFF}

  /* content stub */
  .stage{flex:1;display:grid;place-items:center;color:#94A3B8;font-size:13px}
</style>
</head>
<body>
  <div class="shell">
    <!-- Blue column -->
    <aside class="rail-blue" aria-label="Primary">
      <div class="top">
        <!-- FAMS hexagonal logo -->
        <div class="logo" title="FAMS">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Hexagon-style mark, white on blue -->
            <path d="M16 2.5 27.4 9v14L16 29.5 4.6 23V9L16 2.5Z" fill="#FFFFFF"/>
            <path d="M16 7.5 22.9 11.5v9L16 24.5 9.1 20.5v-9L16 7.5Z" fill="#1E7FE8"/>
            <path d="M13 12.5h6.2M13 12.5v7M13 16h4.6" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Active screen/monitor tile (selected) -->
        <div class="b-item active" title="Dashboard" aria-current="page">
          <!-- monitor icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.75" y="4.25" width="18.5" height="13" rx="2"/>
            <path d="M8.5 20.5h7M12 17.25v3.25"/>
          </svg>
        </div>
      </div>

      <div class="bottom">
        <div class="b-item" title="Settings">
          <!-- gear -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15 1.7 1.7 0 0 0 3.08 14H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9 1.7 1.7 0 0 0 4.3 7.13l-.06-.06A2 2 0 1 1 7.07 4.24l.06.06A1.7 1.7 0 0 0 9 4.64 1.7 1.7 0 0 0 10 3.08V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.34.22.7.22 1.07 0 .78.63 1.42 1.4 1.42H21a2 2 0 1 1 0 4h-.09c-.77 0-1.4.64-1.4 1.42Z"/>
          </svg>
        </div>
        <div class="b-item" title="Account">
          <!-- user -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20.5c1.5-3.5 4.6-5 8-5s6.5 1.5 8 5"/>
          </svg>
        </div>
      </div>
    </aside>

    <!-- White column -->
    <nav class="rail-white" aria-label="Module">
      <div class="w-item" title="Services">
        <!-- hand giving -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 13.5c1.8-1.5 3.7-2 5.5-1.2l3 1.3 4.5-1.6c1-.4 2.2.1 2.6 1.1.4 1-.1 2.1-1.1 2.5l-6 2.3c-1 .4-2 .4-2.9 0L3 16"/>
          <path d="M12 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>
          <path d="M14.6 6.4h4.6"/>
        </svg>
      </div>

      <div class="w-item active" title="Fleet" aria-current="page">
        <!-- car -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 15.5V12l2.2-4.5A2 2 0 0 1 8 6.5h8a2 2 0 0 1 1.8 1L20 12v3.5"/>
          <path d="M3.5 12h17"/>
          <path d="M4 15.5h16v3H4z"/>
          <circle cx="7.5" cy="17" r="1.2"/>
          <circle cx="16.5" cy="17" r="1.2"/>
        </svg>
      </div>

      <div class="w-item" title="Routes">
        <!-- winding route -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 20c0-3 4-3 4-6s-4-3-4-6 4-3 4-6"/>
          <circle cx="6" cy="20" r="1.4"/>
          <circle cx="14" cy="4" r="1.4"/>
        </svg>
      </div>

      <div class="w-item" title="Workshop">
        <!-- wrench + screwdriver crossed -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.5 6a3.5 3.5 0 0 1 4.9 4.9l-9.4 9.4a2 2 0 1 1-2.8-2.8l9.4-9.4A3.5 3.5 0 0 1 14.5 6Z"/>
          <path d="M4 4l5 5"/>
          <path d="M7.5 4L4 7.5"/>
        </svg>
      </div>

      <div class="w-item" title="Drivers">
        <!-- users -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="9" r="3.2"/>
          <path d="M3 19c1-3 3.4-4.2 6-4.2S14 16 15 19"/>
          <circle cx="16.5" cy="8" r="2.4"/>
          <path d="M15.5 14.9c2 .2 3.7 1.4 4.5 3.6"/>
        </svg>
      </div>
    </nav>

    <main class="stage">Content area</main>
  </div>
</body>
</html>
