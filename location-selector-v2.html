<meta charset="utf-8">
<title>Location Selector — FM-5679</title>
<style>
  /* ── Local Gilroy Pro (matches Figma) ────────────────────────────────── */
  @font-face{font-family:'Gilroy';src:url('./Gilroy%20Pro/Gilroy-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Gilroy';src:url('./Gilroy%20Pro/Gilroy-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'Gilroy';src:url('./Gilroy%20Pro/Gilroy-Semibold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:'Gilroy';src:url('./Gilroy%20Pro/Gilroy-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}

  /* Figma tokens sampled from vars: neutral-300 #D0D5DD, neutral-400 #98A2B3, #F9FAFB, white, black */
  :root{
    --white:#FFFFFF;
    --black:#000000;
    --n300:#D0D5DD;
    --n400:#98A2B3;
    --n50:#F9FAFB;
    --err-tx:#B42318; --err-bg:#FEF3F2; --err-bd:#FDA29B;
    --r:4px;
    --font:'Gilroy',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--white);
    color:var(--black);
    font-size:14px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  svg{display:block;overflow:visible}
  [hidden]{display:none !important}
  button{font:inherit;color:inherit;cursor:pointer}

  /* Component sits alone on the page, matching the Figma frame proportions */
  .stage{max-width:682px;margin:24px auto;padding:0 12px}

  /* ── Component: EXACT Figma layout ───────────────────────────────────── */
  .loc{display:flex;flex-direction:column;gap:8px}
  .loc-label{
    font-size:12px;font-weight:600;color:var(--n400);
    line-height:14px;font-family:var(--font);
  }
  .loc-fields{display:flex;flex-direction:column;gap:16px;width:100%}

  /* Field row — matches Figma: h-56 · px-12 py-8 · border-1 #D0D5DD · rounded-4 · white bg */
  .field{
    display:flex;align-items:center;gap:10px;
    height:56px;padding:8px 12px;
    background:var(--white);
    border:1px solid var(--n300);
    border-radius:var(--r);
    width:100%;
    transition:opacity .12s,border-color .12s,background-color .12s;
  }
  .field .ic{width:20px;height:20px;flex:0 0 auto;color:var(--n400);position:relative}
  .field .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .field .body{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden}
  .field .label{
    font-size:14px;font-weight:600;color:var(--n400);
    line-height:normal;font-family:var(--font);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .field .value{
    font-size:14px;font-weight:600;color:var(--black);
    line-height:normal;font-family:var(--font);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .field .value.mono{font-family:var(--mono);font-weight:500;letter-spacing:-.005em;font-size:13.5px}
  .field .chev{width:12px;height:12px;flex:0 0 auto;color:var(--black)}
  .field .chev svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .field.disabled{opacity:.5}
  .field:focus-within{border-color:var(--black)}

  /* GPS field accepts typing and pasting — same 14px SemiBold as Figma placeholder */
  .field input{
    border:0;outline:none;background:transparent;
    font-family:var(--font);font-size:14px;font-weight:600;color:var(--black);
    padding:0;width:100%;letter-spacing:-.002em;
  }
  .field input::placeholder{color:var(--n400)}
  .field input.mono{font-family:var(--mono);font-size:13.5px;font-weight:500;letter-spacing:-.005em}
  .field .action{
    font-size:12px;font-weight:600;color:var(--black);
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 8px;border:1px solid var(--n300);border-radius:var(--r);
    background:var(--white);flex:0 0 auto;line-height:1;
  }
  .field .action svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--black)}
  .field .action:hover{background:var(--n50)}
  .field .action.on{background:var(--black);color:var(--white);border-color:var(--black)}
  .field .action.on svg{color:var(--white)}
  .field .badge{
    font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:999px;
    background:var(--n50);color:var(--n400);letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto;
    border:1px solid var(--n300);line-height:1;
  }
  .field .clear{
    width:20px;height:20px;border:0;background:var(--n50);color:var(--n400);
    border-radius:var(--r);display:grid;place-items:center;flex:0 0 auto;
  }
  .field .clear:hover{background:var(--n300);color:var(--black)}
  .field .clear svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

  .field.error{border-color:var(--err-bd);background:var(--err-bg)}
  .field.error .ic{color:var(--err-tx)}
  .field.error input{color:var(--err-tx)}

  /* Wrapper containing Sector + Map (mirrors Figma Frame 1984079492) */
  .wrapper{background:var(--n50);border-radius:var(--r);width:100%;display:flex;flex-direction:column}
  .wrapper .field.sector{
    background:var(--n50);
    border-color:var(--n300);
    border-bottom:0;
    border-radius:var(--r) var(--r) 0 0;
  }
  .wrapper .map-frame{
    border:1px solid var(--n300);
    border-radius:0 0 var(--r) var(--r);
    overflow:hidden;
    position:relative;
    height:486px;
    background:linear-gradient(135deg,#F1F4F6,#E9EDF0);
  }
  .wrapper .map-frame.interactive{cursor:crosshair}

  /* Empty state — matches Figma frame 299:17554 */
  .empty-state{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px;text-align:center;pointer-events:none;
  }
  .empty-state .globe{width:176px;height:193px;background:url('./tracking-globe.svg') center/contain no-repeat}
  .empty-state h5{
    font-size:18px;font-weight:600;color:var(--black);
    line-height:normal;margin:0;font-family:var(--font);
  }
  .empty-state p{
    font-size:12px;font-weight:600;color:var(--n400);
    margin:0;font-family:var(--font);
  }

  /* Map "sketch" tiles — visible after empty state hides */
  .tiles{position:absolute;inset:0;
    background:
      linear-gradient(90deg,transparent 49.75%,rgba(255,255,255,.28) 49.75%,rgba(255,255,255,.28) 50.25%,transparent 50.25%),
      linear-gradient(0deg,transparent 49.75%,rgba(255,255,255,.28) 49.75%,rgba(255,255,255,.28) 50.25%,transparent 50.25%),
      radial-gradient(circle at 28% 38%,#DEE4E1 0%,transparent 26%),
      radial-gradient(circle at 72% 62%,#D2DADD 0%,transparent 28%),
      radial-gradient(circle at 50% 22%,#D0D8DE 0%,transparent 32%);
    background-size:80px 80px,80px 80px,auto,auto,auto;opacity:.85;pointer-events:none}
  .roads{position:absolute;inset:0;pointer-events:none}
  .roads path{fill:none;stroke:#C4CDD2;stroke-width:5;stroke-linecap:round}
  .roads path.hi{stroke:#D6C8AE;stroke-width:7;opacity:.6}

  /* Interactive map affordances (shown once user starts a coordinate) */
  .map-hint{
    position:absolute;top:12px;left:12px;
    background:var(--white);border:1px solid var(--n300);border-radius:var(--r);
    padding:6px 10px;font-size:12px;font-weight:600;color:var(--black);
    display:inline-flex;align-items:center;gap:6px;cursor:default;
  }
  .map-hint svg{width:14px;height:14px;color:var(--n400);stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .map-controls{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px}
  .map-btn{
    width:28px;height:28px;border-radius:var(--r);
    background:var(--white);border:1px solid var(--n300);
    display:grid;place-items:center;color:var(--n400);
  }
  .map-btn:hover{color:var(--black)}
  .map-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
  .map-place{
    position:absolute;bottom:12px;left:12px;right:12px;
    background:var(--white);border:1px solid var(--n300);border-radius:var(--r);
    padding:8px 12px;font-size:13px;color:var(--black);
    display:flex;align-items:center;gap:8px;font-weight:600;cursor:default;
  }
  .map-place svg{width:14px;height:14px;color:var(--n400);stroke:currentColor;fill:none;stroke-width:1.6}

  .pin{position:absolute;transform:translate(-50%,-100%);z-index:3;cursor:grab}
  .pin.dragging{cursor:grabbing}
  .pin .marker{width:26px;height:34px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
  .pin .pulse{
    position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
    width:22px;height:8px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(16,24,40,.25),transparent 70%);
    animation:pulse 2.2s ease-out infinite;pointer-events:none;
  }
  @keyframes pulse{0%{transform:translateX(-50%) scale(.55);opacity:1}100%{transform:translateX(-50%) scale(1.6);opacity:0}}

  /* Compact error message below GPS field on invalid paste (kept minimal) */
  .field-error{
    font-size:12px;font-weight:600;color:var(--err-tx);
    display:flex;align-items:center;gap:6px;padding-left:2px;
  }
  .field-error svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
</style>

<!-- Icon symbols matching Figma glyph paths ────────────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <!-- marker-pin-01 (from Figma) -->

      <circle cx="2.79762" cy="4.16667" r="1.16667" fill="currentColor" stroke="none"/>

<div class="stage">
  <div class="loc">
    <div class="loc-label">Location Details</div>

    <div class="loc-fields">

      <!-- GPS Coordinates row — accepts typing AND paste (Google Maps link, "lat, lng", DMS).
           A small "Drop pin" toggle on the right activates the map for pinning. -->
      <div>
        <div class="field" data-coord-field>
          <span class="ic"><svg><use href="#i-pin"/></svg></span>
          <div class="body">
            <input type="text" data-coord-input placeholder="GPS Coordinates" spellcheck="false" autocomplete="off"/>
          </div>
          <span class="badge" data-via hidden>Pinned</span>
          <button class="clear" data-clear hidden aria-label="Clear"><svg><use href="#i-x"/></svg></button>
          <button class="action" data-drop-pin aria-pressed="false">
            <svg><use href="#i-pin"/></svg> Drop pin
          </button>
        </div>
        <div class="field-error" data-err hidden style="margin-top:6px">
          <svg><use href="#i-info"/></svg>
          <span data-err-text>Couldn't parse coordinates. Expected 24.7136, 46.6753 or a Google Maps link.</span>
        </div>
      </div>

      <!-- LOT row (chevron opens a manual override dropdown; auto-fills on coord entry) -->
      <div class="field" data-lot-field>
        <span class="ic"><svg><use href="#i-lot"/></svg></span>
        <div class="body">
          <span class="label" data-lot-empty>Select Lot</span>
          <span class="value" data-lot-value hidden>—</span>
        </div>
        <span class="chev"><svg><use href="#i-chev"/></svg></span>
      </div>

      <!-- Sector + Map wrapper (Figma Frame 1984079492) -->
      <div class="wrapper">
        <div class="field sector disabled" data-sec-field>
          <span class="ic"><svg><use href="#i-sec"/></svg></span>
          <div class="body">
            <span class="label" data-sec-empty>Select Sector</span>
            <span class="value" data-sec-value hidden>—</span>
          </div>
          <span class="chev"><svg><use href="#i-chev"/></svg></span>
        </div>

        <div class="map-frame" data-map>
          <div class="tiles" hidden data-tiles></div>
          <svg class="roads" data-roads hidden viewBox="0 0 682 486" preserveAspectRatio="none">
            <path class="hi" d="M-20 140 Q 180 200 340 140 T 720 210"/>
            <path d="M-20 290 Q 200 330 400 310 T 720 340"/>
            <path d="M340 -10 Q 320 180 360 310 T 340 510"/>
            <path d="M120 -10 Q 140 230 100 400 T 140 510"/>
            <path d="M540 -10 Q 520 140 560 280 T 540 510"/>
          </svg>

          <!-- Figma empty state (default) -->
          <div class="empty-state" data-empty-state>
            <div class="globe"></div>
            <h5>No Lot Selected</h5>
            <p>Pick a lot above to view its sectors on the map.</p>
          </div>

          <!-- Interactive affordances (appear when pin mode is active or a value is set) -->
          <div class="map-hint" data-hint hidden>
            <svg><use href="#i-info"/></svg>
            <span data-hint-text>Click anywhere on the map to drop a pin</span>
          </div>
          <div class="map-controls" data-controls hidden>
            <button class="map-btn" title="My location"><svg><use href="#i-loc"/></svg></button>
            <button class="map-btn" title="Zoom in"><svg><use href="#i-plus"/></svg></button>
            <button class="map-btn" title="Zoom out"><svg><use href="#i-minus"/></svg></button>
          </div>
          <div class="map-place" data-place hidden>
            <svg><use href="#i-pin"/></svg>
            <span class="place" data-place-text>Al Nahda District, Riyadh</span>
          </div>
          <div class="pin" data-pin hidden>
            <div class="pulse"></div>
            <svg class="marker" viewBox="0 0 28 36" fill="none">
              <path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22c0-7.7-6.3-14-14-14Z" fill="#101828"/>
              <circle cx="14" cy="14" r="5.2" fill="#fff"/>
            </svg>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  // ── Mock geo resolver — rough Riyadh window ───────────────────────────
  const LAT_TOP = 24.85, LAT_BOT = 24.60;
  const LNG_LEFT = 46.55, LNG_RIGHT = 46.80;
  const LOTS = [
    { lot:'LOT 1 — Riyadh North',   sec:'Sector 4-A',  place:'Al Malqa District, Riyadh'  },
    { lot:'LOT 2 — Riyadh West',    sec:'Sector 7-C',  place:'Al Olaya District, Riyadh'  },
    { lot:'LOT 3 — Riyadh Central', sec:'Sector 12-B', place:'Al Nahda District, Riyadh'  },
    { lot:'LOT 4 — Riyadh East',    sec:'Sector 18-A', place:'Al Naseem District, Riyadh' },
    { lot:'LOT 5 — Riyadh South',   sec:'Sector 22-D', place:'Al Aziziyah District, Riyadh' },
    { lot:'LOT 6 — Diriyah',        sec:'Sector 26-A', place:'Diriyah, Riyadh' }
  ];
  const resolve = (xPct, yPct) => LOTS[(yPct < 50 ? 0 : 1) * 3 + Math.min(2, Math.floor(xPct / 33.34))];
  const coordFor = (xPct, yPct) => ({
    lat: +(LAT_TOP + (LAT_BOT - LAT_TOP) * (yPct/100)).toFixed(4),
    lng: +(LNG_LEFT + (LNG_RIGHT - LNG_LEFT) * (xPct/100)).toFixed(4)
  });
  const invCoord = (lat, lng) => ({
    x: Math.max(2, Math.min(98, ((lng - LNG_LEFT) / (LNG_RIGHT - LNG_LEFT)) * 100)),
    y: Math.max(4, Math.min(96, ((lat - LAT_TOP) / (LAT_BOT - LAT_TOP)) * 100))
  });
  const pctFromEvent = (map, ev) => {
    const rect = map.getBoundingClientRect();
    const x = ((ev.clientX - rect.left) / rect.width) * 100;
    const y = ((ev.clientY - rect.top) / rect.height) * 100;
    return { x: Math.max(2, Math.min(98, x)), y: Math.max(4, Math.min(96, y)) };
  };

  // ── Robust coordinate parser: "lat, lng", DMS, Google Maps link ───────
  function parse(text){
    if (!text) return null;
    const s = text.trim();
    // Google Maps URLs: extract @lat,lng or ?q=lat,lng
    let m = s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) ||
            s.match(/[?&](?:q|ll|query)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    if (m) return check(+m[1], +m[2]);
    // Plain "lat, lng"
    m = s.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) return check(+m[1], +m[2]);
    // DMS like 24°42'49"N 46°40'31"E
    const dms = s.match(/(\d+)[°d]\s*(\d+)['m]?\s*([\d.]+)?[\"s]?\s*([NSEW])/gi);
    if (dms && dms.length >= 2){
      const toDec = t => {
        const p = t.match(/(\d+)[°d]\s*(\d+)['m]?\s*([\d.]+)?[\"s]?\s*([NSEW])/i);
        if (!p) return null;
        let v = +p[1] + (+p[2])/60 + (+(p[3]||0))/3600;
        if (/[SW]/i.test(p[4])) v = -v;
        return v;
      };
      const a = toDec(dms[0]), b = toDec(dms[1]);
      if (a != null && b != null){
        const lat = Math.abs(a) <= 90 ? a : b;
        const lng = Math.abs(a) <= 90 ? b : a;
        return check(lat, lng);
      }
    }
    return null;
  }
  function check(lat, lng){
    if (isNaN(lat) || isNaN(lng)) return null;
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    return { lat, lng };
  }

  // ── DOM refs ──────────────────────────────────────────────────────────
  const loc = document.querySelector('.loc');
  const coordInput = loc.querySelector('[data-coord-input]');
  const coordField = loc.querySelector('[data-coord-field]');
  const via = loc.querySelector('[data-via]');
  const clearBtn = loc.querySelector('[data-clear]');
  const dropBtn = loc.querySelector('[data-drop-pin]');
  const err = loc.querySelector('[data-err]');
  const lotField = loc.querySelector('[data-lot-field]');
  const secField = loc.querySelector('[data-sec-field]');
  const lotEmpty = loc.querySelector('[data-lot-empty]'), lotValue = loc.querySelector('[data-lot-value]');
  const secEmpty = loc.querySelector('[data-sec-empty]'), secValue = loc.querySelector('[data-sec-value]');
  const map = loc.querySelector('[data-map]');
  const emptyState = loc.querySelector('[data-empty-state]');
  const tiles = loc.querySelector('[data-tiles]');
  const roads = loc.querySelector('[data-roads]');
  const hint = loc.querySelector('[data-hint]');
  const hintText = loc.querySelector('[data-hint-text]');
  const controls = loc.querySelector('[data-controls]');
  const placeRow = loc.querySelector('[data-place]');
  const placeText = loc.querySelector('[data-place-text]');
  const pin = loc.querySelector('[data-pin]');
  let pinMode = false;

  function activateMap(){
    emptyState.hidden = true;
    tiles.hidden = false; roads.hidden = false;
  }
  function deactivateMap(){
    emptyState.hidden = false;
    tiles.hidden = true; roads.hidden = true;
    hint.hidden = true; controls.hidden = true; placeRow.hidden = true; pin.hidden = true;
    map.classList.remove('interactive');
  }
  function enterPinMode(){
    pinMode = true;
    dropBtn.classList.add('on');
    dropBtn.setAttribute('aria-pressed','true');
    activateMap();
    hint.hidden = false; controls.hidden = false;
    hintText.textContent = 'Click anywhere on the map to drop a pin';
    map.classList.add('interactive');
  }
  function exitPinMode(){
    pinMode = false;
    dropBtn.classList.remove('on');
    dropBtn.setAttribute('aria-pressed','false');
    if (!pin.hidden) return;                  // keep map active if pin exists
    deactivateMap();
  }

  function setValue(lat, lng, via_){
    const info = resolve(...(function(){ const p = invCoord(lat,lng); return [p.x, p.y]; })());
    const p = invCoord(lat, lng);

    activateMap();
    controls.hidden = false;
    placeRow.hidden = false; placeText.textContent = info.place;

    pin.style.left = p.x + '%'; pin.style.top = p.y + '%'; pin.hidden = false;

    hint.hidden = false;
    hintText.textContent = pinMode ? 'Pin dropped · click again or drag to adjust' : 'Preview · switch to Drop pin to adjust on map';

    coordInput.value = lat + ', ' + lng;
    coordInput.classList.add('mono');
    via.textContent = via_;
    via.hidden = false;
    clearBtn.hidden = false;
    coordField.classList.remove('error');
    err.hidden = true;

    lotEmpty.hidden = true; lotValue.hidden = false; lotValue.textContent = info.lot;
    secEmpty.hidden = true; secValue.hidden = false; secValue.textContent = info.sec;
    secField.classList.remove('disabled');
  }

  function clearAll(){
    coordInput.value = '';
    coordInput.classList.remove('mono');
    via.hidden = true;
    clearBtn.hidden = true;
    coordField.classList.remove('error');
    err.hidden = true;

    lotEmpty.hidden = false; lotValue.hidden = true; lotValue.textContent = '';
    secEmpty.hidden = false; secValue.hidden = true; secValue.textContent = '';
    secField.classList.add('disabled');

    if (pinMode){
      pin.hidden = true; placeRow.hidden = true;
      activateMap();
      hint.hidden = false; hintText.textContent = 'Click anywhere on the map to drop a pin';
    } else {
      deactivateMap();
    }
  }

  function showError(msg){
    coordField.classList.add('error');
    err.hidden = false;
    err.querySelector('[data-err-text]').textContent = msg;
    via.hidden = true; clearBtn.hidden = true;
    lotEmpty.hidden = false; lotValue.hidden = true;
    secEmpty.hidden = false; secValue.hidden = true;
    secField.classList.add('disabled');
    if (!pinMode){ pin.hidden = true; placeRow.hidden = true; deactivateMap(); }
  }

  // ── Wire it up ────────────────────────────────────────────────────────
  dropBtn.addEventListener('click', function(){
    pinMode ? exitPinMode() : enterPinMode();
  });

  map.addEventListener('click', function(ev){
    if (!pinMode) return;
    if (ev.target.closest('.map-btn,.map-place,.map-hint,.pin')) return;
    const { x, y } = pctFromEvent(map, ev);
    const c = coordFor(x, y);
    setValue(c.lat, c.lng, 'Pinned');
  });

  // Pin drag
  (function(){
    let dragging = false;
    function onMove(ev){
      if (!dragging) return;
      ev.preventDefault();
      const p = ev.touches ? ev.touches[0] : ev;
      const { x, y } = pctFromEvent(map, p);
      const c = coordFor(x, y);
      setValue(c.lat, c.lng, 'Pinned');
    }
    function onUp(){
      if (!dragging) return;
      dragging = false; pin.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    pin.addEventListener('mousedown', function(ev){
      if (pin.hidden) return;
      ev.preventDefault(); ev.stopPropagation();
      dragging = true; pin.classList.add('dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    pin.addEventListener('touchstart', function(ev){
      if (pin.hidden) return;
      ev.preventDefault(); ev.stopPropagation();
      dragging = true;
      document.addEventListener('touchmove', onMove, { passive:false });
      document.addEventListener('touchend', onUp);
    }, { passive:false });
  })();

  // Paste / type in the GPS field — auto-parse
  coordInput.addEventListener('paste', function(ev){
    setTimeout(() => tryCommit(coordInput.value, 'Pasted'), 0);
  });
  coordInput.addEventListener('input', function(){
    // remove mono while user is typing raw
    if (!coordInput.value) return clearAll();
    coordInput.classList.remove('mono');
  });
  coordInput.addEventListener('blur', function(){
    if (!coordInput.value) return;
    tryCommit(coordInput.value, 'Manual');
  });
  coordInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); tryCommit(coordInput.value, 'Manual'); }
  });

  function tryCommit(text, viaLabel){
    if (!text || !text.trim()) return;
    const parsed = parse(text);
    if (!parsed){
      showError("Couldn't parse coordinates. Expected 24.7136, 46.6753 or a Google Maps link.");
      return;
    }
    // If coord is outside our fake map window, still write it but skip pin/resolution
    if (parsed.lat > LAT_TOP || parsed.lat < LAT_BOT || parsed.lng < LNG_LEFT || parsed.lng > LNG_RIGHT){
      showError('Coordinates are outside the known LOT boundary.');
      return;
    }
    setValue(parsed.lat, parsed.lng, viaLabel);
  }

  clearBtn.addEventListener('click', clearAll);
})();
</script>
