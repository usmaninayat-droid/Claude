<style>
/* ---------- design tokens: aliases onto the FAMS design system (tokens.css + tenants.css, tenant=iwmp) ---------- */

 --navy:var(--fams-color-sidebar-default);--navy-2:var(--fams-color-sidebar-accent);
 --green-500:var(--color-primary,var(--fams-color-primary));--green-600:var(--color-primary-700,var(--fams-color-success-scale-700));--green-100:var(--color-primary-50,var(--fams-color-success-scale-50));
 --blue-500:var(--fams-color-brand-500);--blue-100:var(--fams-color-brand-50);
 --amber-500:var(--fams-color-warning-scale-600);--amber-100:var(--fams-color-warning-scale-100);
 --red-500:var(--fams-color-error-600);--red-100:var(--fams-color-error-100);
 --violet-500:var(--fams-color-accent-family-lavender-dark);--violet-100:var(--fams-color-accent-family-lavender-light);
 --grey-500:var(--fams-color-gray-500);--grey-100:var(--fams-color-gray-100);
 --bg:var(--fams-color-background);--surface:var(--fams-color-card);--surface-2:var(--fams-color-gray-50);--line:var(--fams-color-border);
 --ink:var(--fams-color-text-color-darkest);--ink-2:var(--fams-color-text-color-dark);--ink-3:var(--fams-color-text-color-light);
 --shadow:var(--fams-shadow-md);
 --r-sm:var(--fams-radius-sm);--r:var(--fams-radius-md);--r-lg:12px;--r-full:var(--fams-radius-full);
 --font-sans:var(--fams-font-sans);--font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
 --side-bg:var(--color-sidebar-gradient,linear-gradient(180deg,var(--navy),var(--navy-2)));
 --side-fg:var(--fams-color-sidebar-foreground);--side-fg-2:rgba(255,255,255,.72);--side-fg-3:rgba(255,255,255,.55);
}
:root[data-theme=dark]{--surface-2:var(--fams-color-muted);--green-600:var(--fams-color-success-text);--amber-500:var(--fams-color-warning-text);--red-500:var(--fams-color-error-text);
 --green-100:rgba(34,200,130,.16);--blue-100:rgba(0,114,214,.18);--amber-100:rgba(247,144,9,.16);--red-100:rgba(240,68,56,.16);--violet-100:rgba(158,119,237,.18);--grey-100:var(--fams-color-gray-800);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--side-bg);color:var(--side-fg);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}

.nav a i{width:16px;text-align:center;color:var(--side-fg-2)}.nav a:hover{background:rgba(255,255,255,.08);color:var(--side-fg)}
.nav a.on{background:rgba(255,255,255,.16);color:var(--side-fg);border-left-color:#fff}.nav a.on i{color:var(--side-fg)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;font-size:11px;color:var(--side-fg-2);padding:12px 8px;border-top:1px solid rgba(255,255,255,.1)}
main{padding:0 26px 40px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px;position:sticky;top:0;background:var(--bg);z-index:5}
.crumb{font-size:12.5px;color:var(--ink-3)}.crumb b{color:var(--ink)}
.topbar .sp{flex:1}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.3px}.page-sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.card-h h3{font-size:13.5px;font-weight:700}.hint{font-size:11.5px;color:var(--ink-3)}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g7{grid-template-columns:repeat(7,1fr)}
.kpi{padding:14px 16px;border-top:3px solid var(--kpi,var(--blue-500));cursor:pointer;transition:transform .15s}.kpi:hover{transform:translateY(-2px)}
.kpi .l{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;justify-content:space-between}

.btn.danger{background:var(--fams-color-destructive);color:var(--fams-color-destructive-foreground);border-color:var(--fams-color-destructive)}.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:var(--r)}.btn.ghost{background:transparent}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:700;white-space:nowrap}
.badge.green{background:var(--green-100);color:var(--green-600)}.badge.blue{background:var(--blue-100);color:var(--blue-500)}.badge.amber{background:var(--amber-100);color:var(--amber-500)}
.badge.red{background:var(--red-100);color:var(--red-500)}.badge.violet{background:var(--violet-100);color:var(--violet-500)}.badge.grey{background:var(--grey-100);color:var(--grey-500)}
select,input[type=date],input[type=text],input[type=number],input[type=search]{padding:8px 11px;border:1px solid var(--fams-color-input);border-radius:var(--r);background:var(--fams-color-input-background);color:var(--ink);font-family:inherit;font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-left:4px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line)}
table.data td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}table.data tbody tr:hover{background:var(--surface-2)}
.tbl-wrap{overflow:auto;max-height:62vh}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:12px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--fams-color-input);font-size:11.5px;font-weight:600;cursor:pointer;background:var(--surface)}.chip.on{background:var(--green-500);color:var(--fams-color-primary-foreground);border-color:var(--green-500)}
.chart-box{position:relative;height:240px}.chart-box.tall{height:300px}
.empty{text-align:center;padding:30px;color:var(--ink-3)}.empty i{font-size:28px;display:block;margin-bottom:8px}.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* roster grid */
.rg{display:grid;grid-template-columns:250px repeat(7,1fr);font-size:12px;min-width:960px}
.rg>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 7px;min-height:52px}
.rg .h{background:var(--surface-2);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);font-weight:700;position:sticky;top:0;z-index:2;min-height:0;padding:8px}
.rg .emp{position:sticky;left:0;background:var(--surface);z-index:1;display:flex;gap:8px;align-items:center}
.rg .cell{cursor:pointer;display:flex;align-items:center;justify-content:center}.rg .cell:hover{background:var(--surface-2)}
.duty{padding:4px 8px;border-radius:var(--r);font-family:var(--font-mono);font-size:11px;font-weight:700;width:100%;text-align:center;border:1px solid transparent}
.duty.RT{background:var(--blue-100);color:var(--blue-500)}.duty.RL{background:var(--violet-100);color:var(--violet-500)}.duty.WO{background:var(--grey-100);color:var(--grey-500);border-style:dashed;border-color:var(--line)}
.duty.AV{background:var(--amber-100);color:var(--amber-500)}.duty.EL{background:var(--red-100);color:var(--red-500)}.duty.OC{background:var(--fams-color-accent-family-azure-light);color:var(--fams-color-accent-family-azure-dark)}.duty.SB{background:var(--fams-color-accent-family-aqua-green-light);color:var(--fams-color-accent-family-aqua-green-dark)}.duty.EX{background:var(--fams-color-accent-family-flame-light);color:var(--fams-color-accent-family-flame-dark)}
.duty.blank{background:transparent;color:var(--ink-3);border:1px dashed var(--line)}
.duty.warn{outline:2px solid var(--amber-500)}.duty.block{outline:2px solid var(--red-500)}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:11px;width:28px;height:28px;flex-shrink:0}
/* modal/toast */
.veil{position:fixed;inset:0;background:rgba(16,24,40,.5);display:grid;place-items:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--fams-shadow-2xl)}
.modal.lg{width:min(1040px,100%)}.modal.sm{width:min(520px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}.modal-h h3{font-size:15px;flex:1}
.modal-b{padding:18px 20px;overflow:auto}.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fld{display:flex;flex-direction:column;gap:5px}.fld label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px}.fld.span2{grid-column:1/-1}.req{color:var(--red-500)}
.fld select,.fld input{width:100%}
#toasts{position:fixed;right:18px;top:18px;z-index:60;display:flex;flex-direction:column;gap:8px;width:340px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green-500);border-radius:var(--r-lg);padding:11px 13px;box-shadow:var(--shadow);font-size:12.5px;animation:in .2s}.toast b{display:block;margin-bottom:2px}.toast.red{border-left-color:var(--red-500)}.toast.amber{border-left-color:var(--amber-500)}.toast.blue{border-left-color:var(--blue-500)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{padding:9px 14px;border:0;background:transparent;color:var(--ink-3);font-weight:700;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}.tab.on{color:var(--green-600);border-bottom-color:var(--green-500)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.progress{height:7px;background:var(--grey-100);border-radius:var(--r-full);overflow:hidden}.progress i{display:block;height:100%;background:var(--green-500)}
.rule{font-size:12px;color:var(--ink-2);background:var(--amber-100);border-radius:var(--r);padding:8px 11px}
.formula{font-size:11.5px;color:var(--ink-3);font-family:var(--font-mono)}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
@media(max-width:1100px){.g4,.g6,.g7{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{display:none}}
@media print{aside,.topbar,.page-actions,.filters{display:none}main{padding:0}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><i class="fa-solid fa-recycle"></i><div><b>IWMP · TAJMEE'E</b><span>Manpower Rostering</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">Blueprint v01 · LOT 4 pilot dataset<br>Ref: IWMP-SCOPE-ROSTER-V01</div>
</aside>
<main>
  <div class="topbar"><div class="crumb">Workforce Management · <b id="crumb">Deployment Dashboard</b></div><div class="sp"></div>
    <button class="btn sm" onclick="App.theme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
    <span class="badge green"><i class="fa-solid fa-circle-check"></i> Smart Plan v2026-09 approved</span>
    <span class="badge blue" id="syncBadge"><i class="fa-solid fa-fingerprint"></i> Attendance synced 13:40</span></div>
  <div id="view"></div>
</main>
</div>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================== DATA LAYER */
const DB = (() => {
  let seed = 20260901; const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1)); const pick = a => a[Math.floor(rnd() * a.length)];
  const iso = d => d.toISOString().slice(0, 10); const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const TODAY = new Date('2026-09-01');
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  /* ---- Training master: equipment / competency, validity months (HSE-configurable) ---- */
  const trainings = [
    { id: 'T-SL', name: 'Side Loader Operation', validity: 12, cat: 'Driver' },
    { id: 'T-RL', name: 'Rear End Loader Operation', validity: 12, cat: 'Driver' },
    { id: 'T-HL', name: 'Hook Loader (HLC) Operation', validity: 12, cat: 'Driver' },
    { id: 'T-HLG', name: 'Hook Loader with Grabber', validity: 12, cat: 'Driver' },
    { id: 'T-SK', name: 'Skip / Double Skip Loader (DSL)', validity: 12, cat: 'Driver' },
    { id: 'T-DT', name: 'Dump Truck / Tipper (TC15, TT48)', validity: 12, cat: 'Driver' },
    { id: 'T-3T', name: '3-Ton Pickup Operation', validity: 12, cat: 'Driver' },
    { id: 'T-CCV', name: 'Compactor Container Vehicle (CCV)', validity: 12, cat: 'Driver' },
    { id: 'T-BW', name: 'Bin Washer Vehicle (BWC)', validity: 6, cat: 'Driver' },
    { id: 'T-LB', name: 'Low Bed Trailer', validity: 12, cat: 'Driver' },
    { id: 'T-TW', name: 'Truck Wash Bay Operation', validity: 6, cat: 'Driver' },
    { id: 'T-DD', name: 'Defensive Driving', validity: 24, cat: 'Driver' },
    { id: 'T-HS', name: 'Waste Collection Safety (Helper)', validity: 6, cat: 'Helper' },
    { id: 'T-BH', name: 'Manual Bin Handling', validity: 6, cat: 'Helper' },
    { id: 'T-FM', name: 'Flag Man / Traffic Marshal', validity: 6, cat: 'Helper' },
    { id: 'T-TBT', name: 'HSE Induction', validity: 12, cat: 'All' },
  ];
  /* ---- Vehicle category ↔ required training matrix (route prefix → category) ---- */
  const vehicleCats = [
    { code: 'SL', name: 'Side Loader', lic: 'HDD', req: ['T-SL', 'T-DD'], helperReq: ['T-HS'] },
    { code: 'RL', name: 'Rear End Loader', lic: 'HDD', req: ['T-RL', 'T-DD'], helperReq: ['T-HS', 'T-BH'] },
    { code: 'HLC', name: 'Hook Loader Compactor', lic: 'HDD', req: ['T-HL', 'T-DD'], helperReq: ['T-HS'] },
    { code: 'HLG', name: 'Hook Loader + Grabber', lic: 'HDD', req: ['T-HL', 'T-HLG', 'T-DD'], helperReq: ['T-HS'] },
    { code: 'DSL', name: 'Double Skip Loader', lic: 'HDD', req: ['T-SK', 'T-DD'], helperReq: ['T-HS'] },
    { code: 'TC15', name: 'Dump Truck 15m³', lic: 'HDD', req: ['T-DT', 'T-DD'], helperReq: ['T-HS', 'T-BH'] },
    { code: 'TT48', name: 'Tipper Trailer 48m³', lic: 'HDD', req: ['T-DT', 'T-DD'], helperReq: ['T-HS'] },
    { code: '3TPU', name: '3-Ton Pickup', lic: 'LDD', req: ['T-3T', 'T-DD'], helperReq: ['T-HS', 'T-BH'] },
    { code: 'CCV', name: 'Compactor Container Vehicle', lic: 'HDD', req: ['T-CCV', 'T-DD'], helperReq: ['T-HS'] },
    { code: 'BWC', name: 'Bin Washer', lic: 'HDD', req: ['T-BW', 'T-DD'], helperReq: ['T-HS'] },
    { code: 'TW', name: 'Truck Wash Bay', lic: 'ANY', req: ['T-TW'], helperReq: ['T-HS'] },
    { code: 'LB', name: 'Low Bed', lic: 'HDD', req: ['T-LB', 'T-DD'], helperReq: [] },
  ];
  const catOf = code => vehicleCats.find(c => c.code === code);

  /* ---- Duty codes ---- */
  const duties = [
    { code: 'RT', name: 'Route (Smart Plan)', desc: 'Assigned to an approved smart-plan route; cell shows the route ID' },
    { code: 'RL', name: 'Reliever', desc: 'Covers weekly-offs / absences on the reliever pool; route decided day-of by dispatcher' },
    { code: 'WO', name: 'Weekly Off', desc: 'Contracted rest day — one per 7 days, staggered' },
    { code: 'AV', name: 'Annual Vacation', desc: 'Approved annual leave block' },
    { code: 'EL', name: 'Emergency Leave', desc: 'Approved emergency leave' },
    { code: 'OC', name: 'On Call', desc: 'Standby at depot for the shift; deployable within 30 min' },
    { code: 'SB', name: 'Standby / OJT', desc: 'On-the-job training or standby — not counted as deployed' },
    { code: 'EX', name: 'Extra Assignment', desc: 'Supervisor support · security · flag man · JCB support · bin deployment · truck wash · WCP · dispatch' },
  ];
  const extraTypes = ['Supervisor support', 'Helper as security', 'Flag man', 'JCB support', 'Bin deployment', 'Truck wash', 'WCP', 'Dispatch support', 'Workshop support', 'Camp support'];

  /* ---- Smart plan routes (approved) ---- */
  const districts = ['Mohammed Bin Zayed City', 'Shawamekh', 'Baniyas', 'Al Wathba', 'Musaffah Commercial', 'Al Falah', 'Madinat Al Riyad', 'Shamkha', 'Al Shawamekh Commercial', 'Mafraq Industrial'];
  const routes = [];
  const mk = (pfx, sl, n, shiftMix, freq, proj) => { for (let i = 1; i <= n; i++) routes.push({ id: `${pfx}_04_${sl}_${String(100 + i).padStart(3, '0')}`, cat: pfx, serviceLine: sl === 'MSW' ? 'MSW' : sl === 'BKW' ? 'BULKY' : sl, project: proj, shift: pick(shiftMix), freq: typeof freq === 'function' ? freq(i) : freq, district: pick(districts), target: ri(120, 190), status: 'Approved', plan: 'SP-2026-09' }); };
  mk('SL', 'MSW', 36, ['DAY', 'NIGHT'], i => i % 2 ? 'ALT ODD' : 'ALT EVEN', 'MSW');
  mk('RL', 'MSW', 52, ['DAY', 'NIGHT', 'NIGHT'], 'DAILY', 'MSW');
  mk('HLC', 'MSW', 28, ['DAY', 'NIGHT'], 'DAILY', 'MSW');
  mk('HLG', 'BKW', 6, ['DAY'], 'DAILY', 'MSW');
  mk('TC15', 'BKW', 22, ['DAY', 'NIGHT'], 'DAILY', 'MSW');
  mk('TT48', 'BKW', 14, ['DAY', 'NIGHT'], 'DAILY', 'MSW');
  mk('3TPU', 'BKW', 20, ['DAY'], i => i % 3 ? 'DAILY' : 'EVERY 6 DAYS', 'MSW');
  mk('DSL', 'BKW', 6, ['DAY', 'MID'], 'DAILY', 'MSW');
  mk('CCV', 'MSW', 7, ['DAY', 'AFN'], 'DAILY', 'Commercial');
  mk('BWC', 'MSW', 4, ['DAY'], 'DAILY', 'MSW');
  mk('TW', 'TW', 10, ['DAY', 'AFN', 'NIGHT'], 'DAILY', 'MSW');
  mk('RL', 'COM', 12, ['NIGHT', 'AFN'], 'DAILY', 'Commercial');
  mk('SL', 'COM', 6, ['NIGHT'], 'DAILY', 'Commercial');

  /* ---- Employees (synthetic, shaped on the LOT 4 roster workbook) ---- */

  const LN = ['BAHADUR', 'SINGH', 'KUMAR', 'TAMANG', 'LAMA', 'RUMBA', 'BHANDARI', 'MUKTAN', 'KHAN', 'ULLAH', 'ALAM', 'SK', 'SEKH', 'GUJAR', 'ADHIKARI', 'BUKYA', 'MAGAR', 'THAPA', 'YADAV', 'DAS', 'ANSARI', 'SARDAR', 'RAHAMAN', 'ISLAM', 'HUSSAIN', 'MOHAMMAD', 'GHARTI', 'BASYAL', 'SUNAR', 'CHAUDHARY', 'KOONA', 'MACHA', 'ODDITTI', 'RAGALLA', 'NEMBANG', 'SIRPALI', 'BISHOWKARMA', 'BASHIR', 'JAN', 'HARI'];
  const AVC = ['#0072d6', '#22c882', '#9e77ed', '#f79009', '#06b6d4', '#ee46bc', '#6941c6', '#b74300']; // FAMS chart accents

  mkEmp('LIGHT DUTY DRIVER', 'LOT 4', 29, { shifts: ['DAY', 'DAY', 'AFN'] });
  mkEmp('HELPER', 'LOT 4', 380, {});

  mkEmp('FLEET CONTROLLER', 'LOT 4', 4, { shifts: ['DAY', 'NIGHT'] });

      });

    }

  const days = []; for (let i = 0; i < 28; i++) days.push(iso(addD(new Date('2026-08-24'), i)));
  const roster = {}; // empId -> day -> {code, ref}

  const byShiftCat = {};
  routes.forEach(r => (byShiftCat[r.shift + '|' + r.cat] = byShiftCat[r.shift + '|' + r.cat] || []).push(r));
  const drvOK = (e, r) => eligibility(e, r.id).ok;
  // assign primary routes to eligible drivers
  const unassignedRoutes = [...routes];
  employees.filter(e => e.desig.includes('DRIVER') && e.family === 'ROSTERED').forEach(e => {
    let idx = unassignedRoutes.findIndex(r => r.shift === e.shift && drvOK(e, r));
    if (idx < 0) idx = unassignedRoutes.findIndex(r => drvOK(e, r));
    if (idx >= 0) { const r = unassignedRoutes.splice(idx, 1)[0]; e.route = r.id; e.shift = r.shift; routeCrew[r.id] = { driver: e.id, helpers: [] }; }
  });

  routes.filter(r => routeCrew[r.id]).forEach(r => { const n = ['RL', 'TC15', '3TPU', 'TT48'].includes(r.cat) ? 2 : ['TW', 'LB', 'BWC'].includes(r.cat) ? 0 : 1; for (let k = 0; k < n && hi < hpool.length; k++) { const h = hpool[hi++]; h.route = r.id; h.shift = r.shift; routeCrew[r.id].helpers.push(h.id); } });

      }

  const attendance = {}; // empId -> day -> {in, out, status}

})();

  pendingRoster: (E, from, to) => E.filter(e => e.status === 'Active' && KPI.isOps(e) && !DB.days.filter(d => d >= from && d <= to).some(d => DB.roster[e.id][d] && DB.roster[e.id][d].code !== 'WO')),
  trainingIssues: E => E.filter(e => e.status !== 'Inactive').map(e => { const issues = []; const isD = KPI.isDriver(e), isH = KPI.isHelper(e); const need = isD ? ['T-DD', 'T-TBT'] : isH ? ['T-HS', 'T-TBT'] : ['T-TBT']; need.forEach(t => { if (!e.trainings.find(x => x.id === t)) issues.push({ t, s: 'Pending' }); }); e.trainings.forEach(x => { const s = DB.trStatus(x); if (s === 'Expired' || s === 'Blocked') issues.push({ t: x.id, s }); }); if (isD && !e.trainings.some(x => DB.trainings.find(t => t.id === x.id).cat === 'Driver' && x.id !== 'T-DD')) issues.push({ t: 'EQUIP', s: 'Pending' }); return { e, issues }; }).filter(x => x.issues.length),
  dayBreakdown: (E, d) => {
    const total = E.filter(e => e.status !== 'Inactive').length;
    let planned = 0, reported = 0, wo = 0, vac = 0, absent = 0, late = 0;
    E.forEach(e => { const c = DB.roster[e.id]?.[d]; if (!c) return; if (c.code === 'WO') wo++; else if (c.code === 'AV' || c.code === 'EL') vac++; else { if (c.code !== 'SB') planned++; const a = DB.attendance[e.id]?.[d]; if (d <= DB.iso(DB.TODAY)) { if (a) { reported++; if (a.status === 'Late') late++; } else if (c.code !== 'SB') absent++; } } });
    const future = d > DB.iso(DB.TODAY);
    return { total, planned, reported: future ? null : reported, absent: future ? null : absent, late, wo, vac, available: future ? null : total - reported - wo - vac };
  }
};

    body: `<div class="frm"><div class="fld span2"><label>Employee <span class="req">*</span></label><select id="atEmp">${E.slice(0, 500).map(e => `<option value="${e.id}" ${e.id === pre ? 'selected' : ''}>${esc(e.name)} — ${e.sap} · ${e.desig}</option>`).join('')}</select></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto" id="atList">${DB.trainings.map(t => `<label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" value="${t.id}"> ${t.name} <span class="hint">· ${t.validity} mo</span></label>`).join('')}</div></div>
      <div class="fld"><label>Attendance date <span class="req">*</span></label><input type="date" id="atDate" value="${DB.iso(DB.TODAY)}"></div>
      <div class="fld"><label>Trainer / certificate ref</label><input type="text" placeholder="e.g. HSE-TRN-2026-0912"></div>
      <div class="fld span2"><label>Certificate</label><div style="border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--ink-3);cursor:pointer" onclick="UI.ok('Attached','Certificate attached to the training record.')"><i class="fa-solid fa-paperclip"></i> Attach certificate / attendance sheet</div></div></div>
      <p class="hint" style="margin-top:8px">Expiry is computed automatically: attendance date + validity from the training master. Existing records for the same training are superseded.</p>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" onclick="Views._atSave()">Save training records</button>`
  });
};
Views._atSave = () => { const e = DB.employees.find(x => x.id === $('#atEmp').value); const ids = $$('#atList input:checked').map(i => i.value); if (!ids.length) { UI.err('Nothing selected', 'Tick at least one completed training.'); return; } const on = new Date($('#atDate').value); ids.forEach(id => { const t = DB.trainings.find(x => x.id === id); e.trainings = e.trainings.filter(x => x.id !== id); e.trainings.push({ id, date: DB.iso(on), expiry: DB.iso(DB.addD(on, Math.round(t.validity * 30.4))) }); }); UI.close(); UI.ok('Training recorded', `${ids.length} training(s) saved for ${e.name}. Eligibility re-evaluated — roster exceptions cleared where applicable.`); App.route(); };

/* =========================================================== MASTERS & RULES */
Views.masters = () => `<div class="page-head"><div><div class="page-title">Masters & Rules</div><div class="page-sub">Configurable — no code release needed to change validity, matrix or codes</div></div></div>
  <div class="tabs" id="mTabs">${['Training master', 'Vehicle category ↔ training matrix', 'Duty codes', 'Smart plan routes', 'Business rules'].map((t, i) => `<button class="tab ${i ? '' : 'on'}" data-tab="${i}">${t}</button>`).join('')}</div><div id="mBody"></div>`;
Views._masters = () => {
  const body = $('#mBody');
  const render = i => {
    if (i === 0) body.innerHTML = `<div class="card"><div class="card-b"><table class="data"><thead><tr><th>ID</th><th>Training</th><th>Applies to</th><th>Validity (months)</th><th>Reminder days</th><th>Grace after expiry</th></tr></thead><tbody>${DB.trainings.map(t => `<tr><td class="mono">${t.id}</td><td><b>${t.name}</b></td><td>${t.cat}</td><td><input type="number" value="${t.validity}" style="width:80px" onchange="Views.setValidity('${t.id}',this.value)"></td><td class="mono">30 / 15 / 7</td><td class="mono">90 days</td></tr>`).join('')}</tbody></table><p class="hint" style="margin-top:10px">Changing validity re-computes expiry for all existing records and re-runs eligibility overnight.</p></div></div>`;
    else if (i === 1) body.innerHTML = `<div class="card"><div class="card-b"><div class="tbl-wrap"><table class="data matrix"><thead><tr><th>Vehicle category (route prefix)</th><th>Licence</th>${DB.trainings.filter(t => t.cat !== 'All').map(t => `<th title="${t.name}">${t.id.replace('T-', '')}</th>`).join('')}</tr></thead><tbody>${DB.vehicleCats.map(c => `<tr><td><b>${c.code}</b> — ${c.name}</td><td><span class="badge grey">${c.lic}</span></td>${DB.trainings.filter(t => t.cat !== 'All').map(t => `<td>${c.req.includes(t.id) ? '<i class="fa-solid fa-truck" style="color:var(--blue-500)" title="Driver requirement"></i>' : ''}${c.helperReq.includes(t.id) ? ' <i class="fa-solid fa-person" style="color:var(--violet-500)" title="Helper requirement"></i>' : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:10px"><i class="fa-solid fa-truck" style="color:var(--blue-500)"></i> required for the driver · <i class="fa-solid fa-person" style="color:var(--violet-500)"></i> required for helpers on that vehicle. Example: an employee trained only on HLC cannot be rostered to an SL route.</p><button class="btn sm" onclick="UI.ok('Matrix editor','Opens the matrix in edit mode — changes need HSE Manager approval.')"><i class="fa-solid fa-pen"></i> Edit matrix</button></div></div>`;
    else if (i === 2) body.innerHTML = `<div class="card"><div class="card-b"><table class="data"><thead><tr><th>Code</th><th>Duty</th><th>Counted as planned</th><th>Description</th></tr></thead><tbody>${DB.duties.map(d => `<tr><td><span class="duty ${d.code}" style="width:auto;display:inline-block">${d.code}</span></td><td><b>${d.name}</b></td><td>${['RT', 'RL', 'OC', 'EX'].includes(d.code) ? '<span class="badge green">Yes</span>' : '<span class="badge grey">No</span>'}</td><td>${d.desc}</td></tr>`).join('')}</tbody></table><p class="hint" style="margin-top:10px">Extra assignment types: ${DB.extraTypes.join(' · ')}</p></div></div>`;
    else if (i === 3) { body.innerHTML = `<div class="card" id="rtTable"></div>`; UI.table('rtTable', DB.routes.map(r => ({ ...r, catName: DB.catOf(r.cat).name, crew: DB.routeCrew[r.id] ? 'Crewed' : 'Uncrewed' })), [{ key: 'id', label: 'Route ID', mono: true }, { key: 'plan', label: 'Smart plan', mono: true }, { key: 'catName', label: 'Vehicle category' }, { key: 'serviceLine', label: 'Service line' }, { key: 'project', label: 'Project' }, { key: 'shift', label: 'Shift' }, { key: 'freq', label: 'Frequency' }, { key: 'district', label: 'District' }, { key: 'target', label: 'Daily target', mono: true }, { key: 'crew', label: 'Crew', render: r => UI.statusBadge(r.crew === 'Crewed' ? 'Active' : 'Inactive') }], { pageSize: 12, exportName: 'Smart_Plan_Routes' }); }
    else body.innerHTML = `<div class="card"><div class="card-b"><table class="data"><thead><tr><th>#</th><th>Rule</th><th>Enforcement</th></tr></thead><tbody>${[
      ['BR-01', 'Only employees with status Active can be assigned a route, reliever, on-call or extra-assignment duty.', 'Hard block'],
      ['BR-02', 'Route assignment requires valid training for the route\u2019s vehicle category (per matrix) and the matching licence class.', 'Hard block'],
      ['BR-03', 'Training expiry = attendance date + validity (6 / 12 / 24 months, configurable per training by HSE).', 'System-computed'],
      ['BR-04', 'Training expired ≤ 90 days: assignment allowed with warning; re-training booking mandatory.', 'Warning'],
      ['BR-05', 'Training expired > 90 days or never completed: assignment blocked for that category.', 'Hard block'],
      ['BR-06', 'One duty per employee per day; a route can have one driver per shift per day.', 'Hard block'],
      ['BR-07', 'One weekly off per 7-day period; zero or two weekly offs flagged for supervisor review.', 'Warning'],
      ['BR-08', 'Employees on AV / EL cannot receive work duties for those dates; leave approved in Leave module writes the code automatically.', 'Hard block'],
      ['BR-09', 'Routes come only from the approved Smart Plan version; unapproved routes are not selectable.', 'Hard block'],
      ['BR-10', 'Published weeks are locked; changes require a roster change request with reason and approval.', 'Workflow'],
      ['BR-11', 'Reported headcount and absenteeism are derived from the attendance machine only; no manual attendance marking in the roster.', 'System'],
      ['BR-12', 'Available HC = Total HC − Reported HC − Weekly off HC − Vacation HC (Annual + Emergency).', 'KPI definition'],
    ].map(r => `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${UI.statusBadge(r[2] === 'Hard block' ? 'Blocked' : r[2] === 'Warning' ? 'Expiring' : 'Valid').replace(/>[^<]+</, '>' + r[2] + '<')}</td></tr>`).join('')}</tbody></table></div></div>`;
  };
  render(0); $$('#mTabs .tab').forEach(t => t.onclick = () => { $$('#mTabs .tab').forEach(x => x.classList.remove('on')); t.classList.add('on'); render(+t.dataset.tab); });
};
Views.setValidity = (id, v) => { const t = DB.trainings.find(x => x.id === id); t.validity = +v; DB.employees.forEach(e => e.trainings.filter(x => x.id === id).forEach(x => x.expiry = DB.iso(DB.addD(new Date(x.date), Math.round(t.validity * 30.4))))); UI.ok('Validity updated', `${t.name} → ${v} months. Expiries recomputed for all records; eligibility refreshed.`); };

/* =========================================================== EXCEL → IWMP MAPPING */
Views.migration = () => `<div class="page-head"><div><div class="page-title">Excel workbook → IWMP function mapping</div><div class="page-sub">LOT4_DRIVERS & HELPERS THEORETICAL ROSTER (49 tabs, 17 roster versions) → what replaces each</div></div></div>
  <div class="card"><div class="card-b"><table class="data"><thead><tr><th>Workbook tab(s)</th><th>What it does today</th><th>IWMP function</th><th>Blueprint screen</th></tr></thead><tbody>${[
    ['DRIVERS & HELPERS Details', 'Master list of drivers/helpers with licence, shift, status, service line, assignment family; pivot counts', 'Employee master (already in WFMC) + assignment family attribute', 'Deployment Dashboard · KPI lists'],
    ['Sheet1 (summary)', 'Requirement vs onboard vs deployed vs under training, day/night split per HDD / LDD / Helper', 'Requirement vs onboard table with live counts', 'Deployment Dashboard'],
    ['LOT4 DRIVERS ROSTER V1 … V17', 'Driver roster: route number, vehicle, frequency, district, vehicle type, shift, one column per day with route / DAY OFF / ON CALL / STANDBY', 'Roster board (drivers) with versioning, approval and publish; frequency handled by smart plan', 'Roster Board'],
    ['Route Helpers Roster V1 … V4', 'Helper roster by route with MON–SUN duty codes, permit helpers, relievers', 'Roster board (helpers) + crew view per route', 'Roster Board · Crew view'],
    ['HELPERS FOR SUPERVISORS V1–V3', 'Helpers mapped to a supervisor code per day', 'Extra assignment — Supervisor support', 'Roster Board · Extra assignments'],
    ['HELPERS AS SECURITY v1–V3 · FLAG MAN · HELPERS FOR JCB · FOR WCP · WCP NOUSHAD · WCP SCHDL · LAVAJET', 'Non-route allocations by location / shift', 'Extra assignment types (security, flag man, JCB, WCP, bin deployment, dispatch, workshop, camp)', 'Roster Board · Extra assignments'],
    ['CURRENT OJT', 'Drivers on standby / on-the-job training with target vehicle type', 'Duty code SB (Standby / OJT) + Training status; not counted as deployed', 'Roster Board · Training'],
    ['Detail1 … Detail7', 'Pivot drill-downs (extra assignments, rostered helpers)', 'Click-through lists on every KPI card', 'Deployment Dashboard'],
    ['Sheet2 (route list)', 'Route ID, shift, active, frequency (alternate odd/even), target, district, vehicle', 'Smart plan route master (from Dispatcher / Smart Planning module)', 'Masters · Smart plan routes'],
    ['(none — manual)', 'Checking who is trained for which vehicle before assigning', 'Training master + vehicle category matrix + eligibility engine', 'Training & Eligibility · Masters'],
    ['(none — manual)', 'Comparing roster with attendance the next day', 'Attendance machine sync + reconciliation + absenteeism KPI', 'Attendance Reconciliation'],
  ].map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="badge blue">${r[3]}</span></td></tr>`).join('')}</tbody></table>
  <p class="hint" style="margin-top:12px">The export on the roster board reproduces the V17 column layout (SL, SAPID, NAME, LICENCE, ROUTE NUMBER, VEHICLE, SERVICE LINE, VEHICLE TYPE, ACTIVE/INACTIVE, SHIFT, one column per day) so downstream users are not disrupted during transition.</p></div></div>`;

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
