<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1280 1050" xmlns="http://www.w3.org/2000/svg" style="font-family:'Gilroy','Inter',system-ui,sans-serif">
  <rect width="1280" height="1050" fill="#ffffff"/>
  <defs>
    <marker id="fArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c882"/>
    </marker>
    <marker id="fArrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a2b3"/>
    </marker>
    <style><![CDATA[
      .stage-label{font-size:11px;fill:#98a2b3;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
      .stage-hdr{font-size:20px;font-weight:700;fill:#101828}
      .stage-sub{font-size:12px;fill:#667085}
      .card{fill:#fff;stroke:#d0d5dd;stroke-width:1}
      .card-static{fill:#eef4ff;stroke:#0072d6;stroke-width:1.5}
      .card-dynamic{fill:#fef3e6;stroke:#f79009;stroke-width:1.5}
      .card-tour{fill:#e9faf3;stroke:#22c882;stroke-width:1.5}
      .card-wo{fill:#f9f5ff;stroke:#9e77ed;stroke-width:1.5}
      .action-title{font-size:11px;fill:#101828;font-weight:600}
      .action-item{font-size:11px;fill:#344054}
      .role-pill-bg{fill:#f2f4f7}
      .role-pill-txt{font-size:9px;fill:#475467;font-weight:600;letter-spacing:0.03em;text-transform:uppercase}
      .flow-strong{stroke:#22c882;stroke-width:2.5;fill:none}
      .flow-weak{stroke:#98a2b3;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
      .field-item{font-size:10.5px;fill:#475467}
      .eq-sign{font-size:24px;font-weight:700;fill:#22c882}
    ]]></style>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#101828">Route → Tour → Work Order</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#667085">Static Plan + Dynamic Plan = Tour, containing 1..N Work Orders</text>

  <text x="60" y="105" class="stage-label">Layer 1 — Template</text>
  <g transform="translate(60,120)">
    <rect width="360" height="260" rx="10" class="card-static"/>
    <text x="20" y="30" class="stage-hdr" fill="#0072d6">ROUTE</text>
    <text x="20" y="50" class="stage-sub">Also called: Static Plan · Smart Plan</text>
    <line x1="20" y1="60" x2="340" y2="60" stroke="#c5dbf1" stroke-width="1"/>
    <text x="20" y="82" class="action-title">Contains</text>
    <text x="20" y="100" class="field-item">• Route name + waste type</text>
    <text x="20" y="116" class="field-item">• Zones (polygons) + Bins</text>
    <text x="20" y="132" class="field-item">• Frequency (Daily / Mon-Wed / …)</text>
    <text x="20" y="148" class="field-item">• Shift template (start–end)</text>
    <text x="20" y="164" class="field-item">• Resource template (vehicle class + driver role + helpers)</text>
    <text x="20" y="180" class="field-item">• Start Depot + Discharge Station</text>
    <text x="20" y="208" class="action-title">Actions</text>
    <text x="20" y="224" class="action-item">▸ Create via Planning Mode wizard</text>
    <text x="20" y="240" class="action-item">▸ Edit template · Clone · Archive</text>
    <text x="20" y="256" class="action-item">▸ Assign to Project · Activate / Deactivate</text>
    <rect x="235" y="35" width="105" height="20" rx="10" class="role-pill-bg"/>
    <text x="288" y="49" text-anchor="middle" class="role-pill-txt">PM · CM</text>
  </g>

  <text x="460" y="105" class="stage-label">Layer 2 — Orchestration</text>
  <g transform="translate(460,120)">
    <rect width="360" height="260" rx="10" class="card-dynamic"/>
    <text x="20" y="30" class="stage-hdr" fill="#f79009">DYNAMIC PLANNING</text>
    <text x="20" y="50" class="stage-sub">A process, not an entity. Runs per shift.</text>
    <line x1="20" y1="60" x2="340" y2="60" stroke="#f5d097" stroke-width="1"/>
    <text x="20" y="82" class="action-title">Auto-triggered when</text>
    <text x="20" y="100" class="field-item">• Route's frequency matches today</text>
    <text x="20" y="116" class="field-item">• Shift window opens (e.g. Morning 06–14)</text>
    <text x="20" y="140" class="action-title">Checks</text>
    <text x="20" y="158" class="field-item">• Workforce availability (leaves, off-days)</text>
    <text x="20" y="174" class="field-item">• Vehicle availability + maintenance</text>
    <text x="20" y="190" class="field-item">• Ad-hoc / incident requests to inject</text>
    <text x="20" y="216" class="action-title">Actions</text>
    <text x="20" y="232" class="action-item">▸ Auto-assign specific driver + vehicle</text>
    <text x="20" y="248" class="action-item">▸ Dispatcher manual override / swap</text>
    <rect x="200" y="35" width="140" height="20" rx="10" class="role-pill-bg"/>
    <text x="270" y="49" text-anchor="middle" class="role-pill-txt">DISPATCHER · OPS HEAD</text>
  </g>

  <text x="860" y="105" class="stage-label">Layer 3 — Runtime instance</text>
  <g transform="translate(860,120)">
    <rect width="360" height="260" rx="10" class="card-tour"/>
    <text x="20" y="30" class="stage-hdr" fill="#22c882">TOUR</text>
    <text x="20" y="50" class="stage-sub">One Tour = one Route × one shift</text>
    <line x1="20" y1="60" x2="340" y2="60" stroke="#a3e4c8" stroke-width="1"/>
    <text x="20" y="82" class="action-title">Contains</text>
    <text x="20" y="100" class="field-item">• Tour # (TR-YYYY-MM-DD-XXX)</text>
    <text x="20" y="116" class="field-item">• Parent Route link</text>
    <text x="20" y="132" class="field-item">• Assigned Driver + Vehicle + Helpers</text>
    <text x="20" y="148" class="field-item">• Scheduled + actual start / end</text>
    <text x="20" y="164" class="field-item">• Status (Scheduled → In Progress → Completed)</text>
    <text x="20" y="180" class="field-item">• 1..N Work Orders (child items)</text>
    <text x="20" y="208" class="action-title">Actions</text>
    <text x="20" y="224" class="action-item">▸ Review · Reassign driver / vehicle</text>
    <text x="20" y="240" class="action-item">▸ Inject ad-hoc WO · Split · Cancel</text>
    <text x="20" y="256" class="action-item">▸ Monitor live progress on map</text>
    <rect x="205" y="35" width="135" height="20" rx="10" class="role-pill-bg"/>
    <text x="272" y="49" text-anchor="middle" class="role-pill-txt">DISPATCHER · OPS · PM</text>
  </g>

  <path d="M 420 250 L 460 250" class="flow-strong" marker-end="url(#fArr)"/>
  <path d="M 820 250 L 860 250" class="flow-strong" marker-end="url(#fArr)"/>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#22c882" font-weight="600">applies →</text>
  <text x="840" y="230" text-anchor="middle" font-size="10" fill="#22c882" font-weight="600">produces →</text>

  <text x="640" y="410" text-anchor="middle" class="stage-label">Data sources — Dynamic Planning reads from</text>
  <g transform="translate(370,430)">
    <rect width="180" height="60" rx="8" class="card"/>
    <text x="90" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Workforce</text>
    <text x="90" y="44" text-anchor="middle" font-size="11" fill="#667085">Rosters · Leaves · Off-days</text>
  </g>
  <g transform="translate(560,430)">
    <rect width="180" height="60" rx="8" class="card"/>
    <text x="90" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Assets / Vehicles</text>
    <text x="90" y="44" text-anchor="middle" font-size="11" fill="#667085">Utilization · Maintenance</text>
  </g>
  <g transform="translate(750,430)">
    <rect width="180" height="60" rx="8" class="card"/>
    <text x="90" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Ad-hoc / Incidents</text>
    <text x="90" y="44" text-anchor="middle" font-size="11" fill="#667085">TAMM · IMS tickets</text>
  </g>
  <path d="M 460 430 L 550 400" class="flow-weak" marker-end="url(#fArrGrey)"/>
  <path d="M 640 430 L 640 400" class="flow-weak" marker-end="url(#fArrGrey)"/>
  <path d="M 840 430 L 730 400" class="flow-weak" marker-end="url(#fArrGrey)"/>

  <text x="60" y="540" class="stage-label">Layer 4 — Atomic execution unit (children of a Tour)</text>
  <line x1="60" y1="550" x2="1220" y2="550" stroke="#eaecf0"/>

  <g transform="translate(60,570)">
    <rect width="260" height="130" rx="10" class="card-wo"/>
    <text x="20" y="30" class="stage-hdr" fill="#6941c6" font-size="16">WORK ORDER 1</text>
    <text x="20" y="52" class="field-item">Type: PLANNED · Zone Al Mushrif-A</text>
    <text x="20" y="70" class="field-item">Status: Completed</text>
    <text x="20" y="88" class="field-item">Start 06:18 · End 07:42</text>
    <text x="20" y="106" class="field-item">Photos: before / after · Notes</text>
  </g>
  <g transform="translate(340,570)">
    <rect width="260" height="130" rx="10" class="card-wo"/>
    <text x="20" y="30" class="stage-hdr" fill="#6941c6" font-size="16">WORK ORDER 2</text>
    <text x="20" y="52" class="field-item">Type: PLANNED · Zone Al Mushrif-B</text>
    <text x="20" y="70" class="field-item">Status: In Progress</text>
    <text x="20" y="88" class="field-item">Start 09:05 · Est. end 10:20</text>
    <text x="20" y="106" class="field-item">Driver on-site</text>
  </g>
  <g transform="translate(620,570)">
    <rect width="260" height="130" rx="10" class="card-wo"/>
    <text x="20" y="30" class="stage-hdr" fill="#6941c6" font-size="16">WORK ORDER 3</text>
    <text x="20" y="52" class="field-item">Type: AD-HOC · Bulky sofa pickup</text>
    <text x="20" y="70" class="field-item">Status: Scheduled (injected)</text>
    <text x="20" y="88" class="field-item">Source: TAMM ticket #45601</text>
    <text x="20" y="106" class="field-item">Priority: High</text>
  </g>

  <g transform="translate(900,570)">
    <rect width="320" height="130" rx="10" class="card"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#101828">Actions per Work Order</text>
    <line x1="20" y1="40" x2="300" y2="40" stroke="#eaecf0"/>
    <text x="20" y="60" class="action-item">▸ Start / Complete (timestamp)</text>
    <text x="20" y="78" class="action-item">▸ Report Incident (blocked / overflow / …)</text>
    <text x="20" y="96" class="action-item">▸ Upload before / after photos</text>
    <text x="20" y="114" class="action-item">▸ Add notes · Skip · Reassign</text>
    <rect x="205" y="18" width="95" height="20" rx="10" class="role-pill-bg"/>
    <text x="252" y="32" text-anchor="middle" class="role-pill-txt">DRIVER · SUP</text>
  </g>

  <path d="M 1040 380 L 1040 420 L 380 420 L 380 570" class="flow-strong" marker-end="url(#fArr)"/>
  <text x="960" y="415" font-size="11" fill="#22c882" font-weight="600">generates 1..N →</text>

  <text x="60" y="750" class="stage-label">Who does what</text>
  <line x1="60" y1="760" x2="1220" y2="760" stroke="#eaecf0"/>

  <g transform="translate(60,780)">
    <rect width="270" height="70" rx="8" class="card"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#101828">Project Manager (PM)</text>
    <text x="16" y="42" class="field-item">• Owns Route (Static Plan)</text>
    <text x="16" y="58" class="field-item">• Sets frequency, resource template</text>
  </g>
  <g transform="translate(345,780)">
    <rect width="270" height="70" rx="8" class="card"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#101828">Dispatcher / Ops Head</text>
    <text x="16" y="42" class="field-item">• Approves generated Tours</text>
    <text x="16" y="58" class="field-item">• Overrides driver / vehicle assignment</text>
  </g>
  <g transform="translate(630,780)">
    <rect width="270" height="70" rx="8" class="card"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#101828">Supervisor</text>
    <text x="16" y="42" class="field-item">• Monitors live Tours + WOs on map</text>
    <text x="16" y="58" class="field-item">• Reassigns WO if driver unavailable</text>
  </g>
  <g transform="translate(915,780)">
    <rect width="270" height="70" rx="8" class="card"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#101828">Driver</text>
    <text x="16" y="42" class="field-item">• Executes Work Orders on ground</text>
    <text x="16" y="58" class="field-item">• Start/complete + photos + incidents</text>
  </g>

  <text x="60" y="890" class="stage-label">Where each lives in the prototype</text>
  <line x1="60" y1="900" x2="1220" y2="900" stroke="#eaecf0"/>

  <g transform="translate(60,920)">
    <rect width="360" height="100" rx="8" class="card"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#0072d6">Route Management module</text>
    <text x="16" y="46" class="field-item">Interactive Planning hybrid view</text>
    <text x="16" y="64" class="field-item">Planning Mode 9-step wizard (create Routes)</text>
    <text x="16" y="82" class="field-item">Route Detail popup (Applied Projects, Stops, History)</text>
  </g>
  <g transform="translate(460,920)">
    <rect width="360" height="100" rx="8" class="card"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#22c882">Tour Management module</text>
    <text x="16" y="46" class="field-item">Live Operations hybrid view</text>
    <text x="16" y="64" class="field-item">Tour Detail popup (7 tabs)</text>
    <text x="16" y="82" class="field-item">Ad-hoc Tour creation flow</text>
  </g>
  <g transform="translate(860,920)">
    <rect width="360" height="100" rx="8" class="card"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#6941c6">Work Orders</text>
    <text x="16" y="46" class="field-item">Inside Tour Detail → Work Orders tab</text>
    <text x="16" y="64" class="field-item">Individual WO drill-down: Work Order Detail tab</text>
    <text x="16" y="82" class="field-item">Driver App (not built yet) will consume these</text>
  </g>
</svg>
